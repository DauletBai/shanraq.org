# Production stack: Postgres + app + Caddy (automatic HTTPS).
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets come from .env (never committed). The database port is NOT published;
# only Caddy is exposed (80/443). Fixed subnet so the app can trust Caddy's
# forwarded client IPs (see server.trusted_proxies in configs/config.prod.yaml).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shanraq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shanraq
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shanraq"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: reachable only on the internal network.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]            # app settings + provider API keys (SHANRAQ_*, ANTHROPIC_API_KEY…)
    environment:
      # Built from the compose secret so the DSN password is never duplicated.
      SHANRAQ_DATABASE_URL: postgres://shanraq:${POSTGRES_PASSWORD}@db:5432/shanraq?sslmode=disable
    volumes:
      - ./configs/config.prod.yaml:/app/config.yaml:ro
      - media-data:/app/data    # uploaded media (avatars, images) persists here
      # GeoIP databases for visitor-country analytics (DB-IP Lite, refreshed
      # monthly on the host). Read-only; the app degrades gracefully if absent.
      # country.mmdb → country per IP; asn.mmdb → flags hosting/cloud/VPN traffic.
      - ./data/dbip-country.mmdb:/app/geoip/country.mmdb:ro
      - ./data/dbip-asn.mmdb:/app/geoip/asn.mmdb:ro
    restart: unless-stopped
    # No published ports: only Caddy talks to the app.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (your-domain.kz) in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # TLS certificates (Let's Encrypt) persist here
      - caddy-config:/config

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

  # The speech synthesiser that reads articles aloud. Kept beside the app
  # rather than inside it: it is Python with an ONNX runtime and 240 MB of voice
  # models, while the app is a small static binary. It is not published to the
  # internet -- only the app talks to it, over the compose network.
  #
  # Memory is the constraint, not speed. The Kazakh voice is around 600 MB
  # resident and synthesises at roughly twice real time on these four cores,
  # which is fast enough to keep ahead of a listener; two of them at once is
  # what gets this container killed, so the service serialises its work.
  tts:
    build: ./deploy/tts
    restart: unless-stopped
    environment:
      TTS_PORT: 8081
      # Ten per cent slower than the model's default pace. At the default the
      # voice clips the ends of words, and both Russian and Kazakh carry their
      # grammar there -- a swallowed suffix is a lost case, not a blemish.
      # Tune by ear without rebuilding: raise for slower, 1.0 is the default.
      TTS_LENGTH_SCALE: "1.1"
    volumes:
      # Filled once by deploy/tts/fetch-voices.sh. Out of the image because the
      # models are large, change about never, and carry their own licence.
      - /var/lib/shanraq/voices:/models:ro
    mem_limit: 1600m
    expose:
      - "8081"

volumes:
  db-data:
  media-data:
  caddy-data:
  caddy-config:
