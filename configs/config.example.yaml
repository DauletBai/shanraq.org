environment: development
# Canonical public origin (no trailing slash). Used for SEO canonical/hreflang
# links, RSS/Telegram links, and password-reset emails. In production this MUST
# be a real https:// origin (not localhost) or startup fails.
public_base_url: "http://localhost:8080"
server:
  address: ":8080"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  # Reverse proxies whose X-Forwarded-For / X-Real-IP may be trusted. Empty =
  # never trust forwarded headers (the client IP is the TCP peer), so nobody can
  # spoof their IP to dodge rate limits. In production set this to the proxy's
  # address, e.g. ["127.0.0.1/32"] for a same-host Caddy or the Docker net CIDR.
  trusted_proxies: []
database:
  url: postgres://postgres:postgres@127.0.0.1:5432/shanraq?sslmode=disable
  max_conns: 10
  min_conns: 1
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_period: 30s
telemetry:
  enable_metrics: true
  metrics_path: /metrics
logging:
  level: info
  mode: development
auth:
  token_secret: super-secret-key
  token_ttl: 30m
  mfa:
    totp:
      enabled: false
      issuer: Shanraq Console
notifications:
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
# AI writing assistant. Stays OFF until enabled AND the active provider has a
# key, so the app runs with zero AI spend by default. The ACTIVE provider and
# models are chosen at runtime from the admin panel (stored in the DB) — these
# values are only the initial defaults on first run. The API keys, however, live
# ONLY here (or in env), one per provider, never in the DB or git; switching
# provider in the admin panel never requires a code change.
ai:
  enabled: false
  provider: anthropic                # default active provider: anthropic|openai|kimi
  api_key: ""                        # legacy Anthropic key (or export ANTHROPIC_API_KEY)
  editor_model: claude-sonnet-5      # co-editor: quality tone
  translate_model: claude-haiku-4-5  # bulk KZ/RU/EN translation: cheap
  max_tokens: 4096
  providers:                         # per-provider secret keys (never committed)
    anthropic:
      api_key: ""                    # or export ANTHROPIC_API_KEY
    openai:
      api_key: ""                    # ChatGPT; or export OPENAI_API_KEY
      base_url: ""                   # default https://api.openai.com/v1
    kimi:
      api_key: ""                    # Kimi K3 (Moonshot); or export KIMI_API_KEY
      base_url: ""                   # default https://api.moonshot.ai/v1
# Block-resilience channels. RSS (/feed.xml) is always on. Telegram auto-posts
# an announcement on publish once a bot token + channel are set.
syndicate:
  base_url: "http://localhost:8080"   # absolute base for RSS + Telegram links (set your real domain)
  # Instant submission of new URLs to Bing and Yandex on publish. Any 8-128
  # hex characters; generate with: openssl rand -hex 16. Empty disables it.
  indexnow_key: ""
  telegram:
    enabled: false
    bot_token: ""          # from @BotFather
    chat_id: ""            # @your_channel or -100XXXXXXXXXX

# Public social profiles shown in the top info bar. Empty = the icon is hidden.
# (Weather is fetched server-side from open-meteo for Almaty; exchange rates
#  from the National Bank of Kazakhstan feed — both cached, both degrade to a
#  placeholder if the source is unreachable.)
social:
  telegram: ""    # e.g. https://t.me/shanraq
  instagram: ""
  youtube: ""
  facebook: ""

# Legal operator shown in the Privacy Policy, Terms and Support pages.
# Leave BLANK here — the real BIN and registered address must NOT be committed
# to a public repository. Put the real values in a non-committed config (e.g.
# configs/config.local.yaml, which is git-ignored) and run with -config that file.
operator:
  legal_name: ""       # e.g. ТОО «Ваша Компания»
  legal_name_en: ""    # e.g. Your Company LLP
  bin: ""              # business identification number
  address: ""          # registered address (RU/KZ)
  address_en: ""       # registered address (EN, optional)
  email: ""            # operator contact, e.g. support@shanraq.org
  phone: ""            # optional
