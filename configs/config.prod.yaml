# Production configuration — NON-SECRET values only.
# Secrets and instance-specific values come from the environment (.env):
#   SHANRAQ_DATABASE_URL, SHANRAQ_AUTH_TOKEN_SECRET, SHANRAQ_PUBLIC_BASE_URL,
#   SHANRAQ_TELEMETRY_METRICS_TOKEN, SHANRAQ_NOTIFICATIONS_SMTP_*,
#   SHANRAQ_OPERATOR_*, ANTHROPIC_API_KEY, …  (see .env.example)
# Environment variables OVERRIDE anything here, so no secret ever lives in git.
environment: production

server:
  address: ":8080"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  # Trust the bundled Caddy reverse proxy on the internal compose network
  # (fixed subnet in docker-compose.prod.yml) so client IPs / rate limits are
  # correct. A slice like this cannot come from a single env var, so it lives
  # here (it is not a secret).
  trusted_proxies: ["172.28.0.0/16"]

  # When Cloudflare proxying is switched on (orange cloud), its edge becomes
  # the hop in front of Caddy and its ranges have to be trusted too, or the
  # right-hand end of X-Forwarded-For is Cloudflare's own address and every
  # reader is counted as arriving from the nearest Cloudflare city.
  #
  # DO NOT uncomment this on its own. Trusting these ranges while the origin
  # is still reachable directly opens the spoofing hole it is meant to close:
  # anyone may put their own site behind Cloudflare and reach us from one of
  # these addresses, and we would then believe the forwarded header they sent
  # with it. The two steps go together — trust the ranges AND firewall the
  # origin so nothing but Cloudflare can reach it.
  #
  # Fetched 2026-08-13 from https://www.cloudflare.com/ips-v4 and ips-v6.
  # Cloudflare changes these; re-fetch before enabling.
  # trusted_proxies: ["172.28.0.0/16",
  #   "173.245.48.0/20",
  #   "103.21.244.0/22",
  #   "103.22.200.0/22",
  #   "103.31.4.0/22",
  #   "141.101.64.0/18",
  #   "108.162.192.0/18",
  #   "190.93.240.0/20",
  #   "188.114.96.0/20",
  #   "197.234.240.0/22",
  #   "198.41.128.0/17",
  #   "162.158.0.0/15",
  #   "104.16.0.0/13",
  #   "104.24.0.0/14",
  #   "172.64.0.0/13",
  #   "131.0.72.0/22",
  #   "2400:cb00::/32",
  #   "2606:4700::/32",
  #   "2803:f800::/32",
  #   "2405:b500::/32",
  #   "2405:8100::/32",
  #   "2a06:98c0::/29",
  #   "2c0f:f248::/32"]

database:
  max_conns: 20
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_period: 30s

telemetry:
  enable_metrics: true          # /metrics requires SHANRAQ_TELEMETRY_METRICS_TOKEN
  metrics_path: /metrics

logging:
  level: info
  mode: production

media:
  backend: fs
  dir: /app/data/media          # mounted as a Docker volume (persists uploads)
  public_prefix: /media
  max_upload_bytes: 26214400
  max_dimension: 2000
  quota_bytes: 536870912       # 512 MiB per account (~70 listings' worth of photos)
  max_total_bytes: 21474836480 # 20 GiB across every account — the floor under a
                               # single VPS: raise it only with the disk
  orphan_grace_hours: 24       # uploads nothing refers to are swept after a day
  watermark: false   # brand mark is applied as a CSS overlay at render (covers
                     # every cover/photo, incl. demo & external), so baking it
                     # into uploads too would double it. Flip to true only if you
                     # drop the overlay and want the mark embedded in the file.

ai:
  enabled: false                # turn on from the admin panel once a key is set

# Public social links shown in the header info-bar and footer. Non-secret URLs.
social:
  telegram: "https://t.me/shanraq_org"   # our auto-post channel (@shanraq_org)
  instagram: "https://instagram.com/shanraq_org"   # @shanraq_org
  facebook: "https://www.facebook.com/profile.php?id=61592467086570"   # brand page (swap for /shanraqorg once the username is set)
  github: "https://github.com/DauletBai/shanraq.org"   # footer only (not shown in the header)

# Aggregate audience analytics. geoip_db points to a MaxMind-format country
# database (DB-IP Lite, bind-mounted read-only by docker-compose) used to bucket
# visits by country — to tell domestic (KZ) readers from genuine foreign ones.
# Only the country code is read from a visitor's IP; the IP itself is never
# stored. If the file is absent the country panel simply stays empty.
analytics:
  geoip_db: /app/geoip/country.mmdb
  # Optional ASN database (DB-IP ASN Lite): visits from hosting/cloud/VPN networks
  # are shown as "ЦОД / VPN" instead of a country, so the country rows are real
  # readers, not US-hosted bots/VPN exits. Absent file → filter simply off.
  geoip_asn_db: /app/geoip/asn.mmdb

# Speech synthesiser for reading articles aloud. Empty or absent means no
# narration: articles work exactly as before and show no listen button.
tts:
  url: "http://tts:8081"
