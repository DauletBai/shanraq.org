<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <title>Өңдеу — {{ .Article.Title }}</title>
  </head>
  <body>
    <h1>Тақырыпты өңдеу</h1>
    {{ with .Err }}<p class="err">{{ . }}</p>{{ end }}
    <form method="post" action="/edit/{{ .Article.Slug }}">
      <input type="text" name="title" value="{{ .Article.Title }}" autofocus>
      <button type="submit">сақтау</button>
    </form>
    <p><a href="/read/{{ .Article.Slug }}">← мақалаға</a></p>
  </body>
</html>
