<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <title>{{ .Article.Title }}</title>
  </head>
  <body>
    <h1>{{ .Article.Title }}</h1>
    <p>{{ .Article.Body }}</p>
    <p>оқу уақыты: {{ .Article.ReadingTime }} мин</p>
    {{ with .Article.UpdatedAt }}<p>өңделген: {{ . }}</p>{{ end }}
    {{ with .Tags }}
    <p class="tags">{{ range . }}<a href="/tag/{{ . }}">#{{ . }}</a> {{ end }}</p>
    {{ end }}
    <p><a href="/edit/{{ .Article.Slug }}">өңдеу</a> · <a href="/">← тізімге</a></p>
  </body>
</html>
