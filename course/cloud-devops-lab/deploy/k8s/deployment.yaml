apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudlab
  namespace: cloudlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudlab
  template:
    metadata:
      labels:
        app: cloudlab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudlab
          image: ghcr.io/OWNER/cloudlab:VERSION
          envFrom:
            - configMapRef:
                name: cloudlab-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudlab-data
