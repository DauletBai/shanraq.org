name: Informatics course

on:
  push:
    paths:
      - 'course/lessons/informatics/**'
      - 'course/informatics/**'
      - 'course/informatics-assistant/**'
      - 'docs/informatics-course-proposal.md'
      - 'docs/informatics-course-audit-2026-10-09.md'
      - 'tools/course/lesson-slugs.json'
      - 'tools/course/generate_informatics_foundations.py'
      - 'tools/course/generate_informatics_maps.py'
      - 'tools/course/generate_informatics_representation.py'
      - 'tools/course/generate_informatics_representation_maps.py'
      - 'tools/course/generate_informatics_algorithms.py'
      - 'tools/course/generate_informatics_algorithm_maps.py'
      - 'tools/course/generate_informatics_python.py'
      - 'tools/course/generate_informatics_python_maps.py'
      - 'tools/course/informatics_python_content_*.py'
      - 'tools/course/informatics_enrichment.py'
      - 'tools/course/prepare_informatics.py'
      - 'tools/course/test_informatics_release.py'
      - 'web/static/course/informatics/**'
      - 'web/static/covers/school/informatics/**'
  pull_request:
    paths:
      - 'course/lessons/informatics/**'
      - 'course/informatics/**'
      - 'course/informatics-assistant/**'
      - 'docs/informatics-course-proposal.md'
      - 'docs/informatics-course-audit-2026-10-09.md'
      - 'tools/course/lesson-slugs.json'
      - 'tools/course/generate_informatics_foundations.py'
      - 'tools/course/generate_informatics_maps.py'
      - 'tools/course/generate_informatics_representation.py'
      - 'tools/course/generate_informatics_representation_maps.py'
      - 'tools/course/generate_informatics_algorithms.py'
      - 'tools/course/generate_informatics_algorithm_maps.py'
      - 'tools/course/generate_informatics_python.py'
      - 'tools/course/generate_informatics_python_maps.py'
      - 'tools/course/informatics_python_content_*.py'
      - 'tools/course/informatics_enrichment.py'
      - 'tools/course/prepare_informatics.py'
      - 'tools/course/test_informatics_release.py'
      - 'web/static/course/informatics/**'
      - 'web/static/covers/school/informatics/**'

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate localized lessons and support maps
        run: |
          python3 tools/course/generate_informatics_foundations.py
          python3 tools/course/generate_informatics_maps.py
          python3 tools/course/generate_informatics_representation.py
          python3 tools/course/generate_informatics_representation_maps.py
          python3 tools/course/generate_informatics_algorithms.py
          python3 tools/course/generate_informatics_algorithm_maps.py
          python3 tools/course/generate_informatics_python.py
          python3 tools/course/generate_informatics_python_maps.py
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Validate four atomic releases and Python checkpoint
        run: |
          python3 -m unittest tools.course.test_informatics_release
          cd course/informatics-assistant/step-03
          python3 -m unittest discover -s tests -v
      - name: Prepare publication without remote changes
        run: |
          python3 tools/course/prepare_informatics.py \
            --sql /tmp/informatics-course.sql \
            --expected /tmp/informatics-course-expected.json
