name: docker-smoke

on:
  push:
    branches: [ main ]
  pull_request:

# The job was called docker-smoke and only ran `docker build`. An image that
# compiles is not an image that starts: a bad migration, a missing environment
# variable, or a route that panics on boot all pass a build and fail a request.
# This runs the same script `make smoke` runs locally — bring the stack up
# against a real Postgres, then ask /healthz, /readyz and /metrics.
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and smoke-test the running container
        run: make smoke
