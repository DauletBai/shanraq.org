name: Course

# The lessons are code as much as prose: every one of them prints a program the
# reader is expected to type in, and a lesson that no longer compiles is found
# by that reader, not by us. It happened -- a regular expression rewrote a block
# and turned a working program into one that still looked right on the page.
#
# So the same checks that were run by hand now run here, and only when a lesson
# or a checker changes: gofmt parses every Go program, the Python compiler takes
# every Python one, the language of the code is held to the language of the
# lesson, and no element of the Python syllabus is left without a lesson.
#
# The outside world is checked once a week instead of on every push. A link that
# dies on somebody else's server is worth knowing about and is not a reason to
# fail a commit that did not touch it.

on:
  push:
    branches: [ main ]
    paths:
      - 'course/lessons/**'
      - 'course/py-digest/**'
      - 'tools/coursecheck/**'
      - 'tools/course/**'
      - 'docs/py-syllabus.md'
      - 'docs/py-course.md'
      - '.github/workflows/course.yml'
  pull_request:
    paths:
      - 'course/lessons/**'
      - 'course/py-digest/**'
      - 'tools/coursecheck/**'
      - 'tools/course/**'
      - 'docs/py-syllabus.md'
      - 'docs/py-course.md'
      - '.github/workflows/course.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  # The plan says the course runs on 3.12 and up, and this is what backs that
  # claim: every program is compiled on each version. Only compiled -- the
  # printed output is 3.14's, because Python's own messages change between
  # versions and a lesson prints what Python printed.
  compiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Every Python program compiles on ${{ matrix.python }}
        run: python3 tools/coursecheck/pycheck.py course/lessons/python/*.md

  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The lessons print what Python printed, and Python's own messages change
      # between versions: "unhashable type" gained a sentence around it in 3.14.
      # So the checks run the version the course says it was written on, rather
      # than whatever the runner happens to ship this month.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # From the pandas module on, the lessons need a library Python does not
      # ship, and the version is the one their output was printed with. Without
      # it those lessons are skipped rather than run -- a skip is silent, and a
      # silent check proves nothing.
      - name: Libraries the lessons are written against
        run: pip install --disable-pip-version-check -r course/lessons/requirements.txt

      # The checkers first: a broken checker is a green run that proves nothing,
      # and two of them have been quietly broken before.
      - name: The checks themselves work
        run: python3 tools/coursecheck/selftest.py

      - name: Code speaks the language of its lesson
        run: python3 tools/coursecheck/langcheck.py course/lessons/*/*.md

      - name: Every Go program parses
        run: python3 tools/coursecheck/gocheck.py course/lessons/go/*.md

      - name: Every Python program compiles
        run: python3 tools/coursecheck/pycheck.py course/lessons/python/*.md

      # Compiling is not the promise a lesson makes. The promise is that this
      # program, typed in as printed, prints exactly this -- and the one error
      # that slipped through every check was of that kind.
      - name: Every Python program prints what the lesson shows
        run: python3 tools/coursecheck/pyrun.py --libraries-required course/lessons/python/*.md

      - name: Every step of the course project runs
        run: python3 tools/coursecheck/pyrun.py --steps --libraries-required

      - name: Links into this repository exist
        run: python3 tools/coursecheck/linkcheck.py --offline course/lessons/*/*.md

      - name: Every element of the language has a lesson
        run: python3 tools/coursecheck/pysyllabus.py plan

      # And every published lesson, in all three languages, actually explains
      # what was assigned to it: a topic covered in Russian and dropped from the
      # Kazakh version is the gap nobody notices.
      - name: Every published lesson covers what it promised
        run: python3 tools/coursecheck/pysyllabus.py published

      - name: Follow every outside link
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/coursecheck/linkcheck.py course/lessons/*/*.md
