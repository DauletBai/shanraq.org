name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Every job installs the Go named in go.mod. setup-go reads the `toolchain`
# directive from go-version-file, so go.mod is the one place the version is
# decided and every builder honours it.
#
# 'stable' was not equivalent, and the difference was not cosmetic: pinning
# toolchain go1.26.6 for its seven standard-library security fixes left CI
# green-lighting builds of 1.26.5 and reporting the very vulnerabilities the
# pin had just closed. GOTOOLCHAIN stays on auto so a future bump of the
# directive alone is enough.
env:
  GOTOOLCHAIN: auto

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # A commit subject is the most repeated sentence the project has: it
      # heads every workflow run, every release and the front page of the
      # repository. Those are read by people who do not read Russian, so they
      # are English -- and the rule lives here rather than in anyone's memory,
      # because kept in memory it was broken about weekly.
      #
      # Only subjects are checked for now. The same script also finds Russian
      # prose in comments and in test failure messages; that switch goes on
      # once the backlog it reports is cleared, so it can be zero-tolerance
      # instead of a warning nobody reads.
      - name: commit subjects are English
        run: |
          before='${{ github.event.before }}'
          case "$before" in
            ''|0000000000000000000000000000000000000000)
              echo "no previous revision to compare against; nothing to check" ;;
            *)
              git fetch --quiet origin "$before" 2>/dev/null || true
              python3 scripts/check_language.py --commits "$before..${{ github.sha }}" --subjects-only ;;
          esac

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shanraq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHANRAQ_TEST_DB: postgres://postgres:postgres@localhost:5432/shanraq_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Apply the real migration set to the service database so the
      # integration tests (skipped without SHANRAQ_TEST_DB) actually run.
      - name: Migrate test database
        run: go run ./cmd/migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/shanraq_test
      # The failure is written into the job summary, not only the log. Logs on
      # this repository need a signed-in browser, so a red run said nothing more
      # than "exit code 1" to anyone reading the notification e-mail — twice this
      # week a flake cost an afternoon of guessing because the name of the
      # failing test was unreachable. The summary is public.
      - name: Go test
        run: |
          set -o pipefail
          go test -p 1 ./... 2>&1 | tee /tmp/test.log && exit 0
          {
            echo "### Failing tests"
            echo
            echo '```'
            grep -E '^(--- FAIL|FAIL|panic:)|\.go:[0-9]+:' /tmp/test.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Go test (race)
        run: |
          set -o pipefail
          go test -race -p 1 ./... 2>&1 | tee /tmp/race.log && exit 0
          {
            echo "### Failing tests (race)"
            echo
            echo '```'
            grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)|\.go:[0-9]+:' /tmp/race.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  snapshots:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Refresh template snapshots
        run: make snapshots
      - name: Verify no snapshot drift
        run: git diff --exit-code

  # NOTE: the Docker smoke test lives in the dedicated docker-smoke.yml
  # workflow. It used to be duplicated here as a `smoke` job, but that copy
  # flaked intermittently (Docker resource contention alongside the other
  # jobs) and produced false CI failures while docker-smoke.yml stayed green.
  # Keep Docker smoke in one place only.
