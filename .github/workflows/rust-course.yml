name: Rust course checks
on:
  push:
    paths:
      - 'course/lessons/rust/**'
      - 'course/rust-organizer/**'
      - 'docs/rust-*'
      - 'tools/course/prepare_rust.py'
      - 'tools/course/test_rust_release.py'
      - 'tools/course/rust-release.json'
      - 'tools/coursecheck/rustcheck.py'
      - 'tools/coursecheck/rust_boundaries.py'
      - 'tools/coursecheck/langcheck.py'
      - 'tools/coursecheck/selftest.py'
      - '.github/workflows/rust-course.yml'
  pull_request:
    paths:
      - 'course/lessons/rust/**'
      - 'course/rust-organizer/**'
      - 'docs/rust-*'
      - 'tools/course/prepare_rust.py'
      - 'tools/course/test_rust_release.py'
      - 'tools/course/rust-release.json'
      - 'tools/coursecheck/rustcheck.py'
      - 'tools/coursecheck/rust_boundaries.py'
      - 'tools/coursecheck/langcheck.py'
      - 'tools/coursecheck/selftest.py'
      - '.github/workflows/rust-course.yml'
permissions:
  contents: read
jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install checked Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt
      - name: Check examples and exercise answers
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: python tools/coursecheck/rustcheck.py

      - name: Check exercise boundary cases
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: python tools/coursecheck/rust_boundaries.py

      - name: Check publication boundary and locale coverage
        run: python -m unittest discover -s tools/course -p test_rust_release.py
