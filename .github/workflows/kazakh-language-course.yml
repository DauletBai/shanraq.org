name: Kazakh language course

on:
  push:
    paths:
      - 'course/kazakh-language/**'
      - 'course/lessons/kazakh-language/**'
      - 'course/drafts/kazakh-language/**'
      - 'docs/kazakh-language-course.md'
      - 'tools/course/generate_kazakh_language_foundations.py'
      - 'tools/course/kazakh_audio.py'
      - 'tools/course/generate_kazakh_language_maps.py'
      - 'tools/course/generate_kazakh_language_people_home.py'
      - 'tools/course/generate_kazakh_language_people_home_maps.py'
      - 'tools/course/generate_kazakh_language_school_city.py'
      - 'tools/course/generate_kazakh_language_school_city_maps.py'
      - 'tools/course/generate_kazakh_language_day_services.py'
      - 'tools/course/generate_kazakh_language_day_services_maps.py'
      - 'tools/course/generate_kazakh_language_space_cases.py'
      - 'tools/course/generate_kazakh_language_space_cases_maps.py'
      - 'tools/course/generate_kazakh_language_action_time.py'
      - 'tools/course/generate_kazakh_language_action_time_maps.py'
      - 'tools/course/generate_kazakh_language_plans_problems.py'
      - 'tools/course/generate_kazakh_language_connected_speech.py'
      - 'tools/course/generate_kazakh_language_information_opinion.py'
      - 'tools/course/generate_kazakh_language_independent.py'
      - 'tools/course/test_kazakh_language_plans_problems.py'
      - 'tools/course/generate_kazakh_audio_candidates.py'
      - 'tools/course/prepare_kazakh_language.py'
      - 'tools/course/prepare_kazakh_language_audio.py'
      - 'tools/course/test_kazakh_language_release.py'
      - 'web/static/course/kazakh-language/**'
      - 'web/static/covers/school/kazakh-language/**'
  pull_request:
    paths:
      - 'course/kazakh-language/**'
      - 'course/lessons/kazakh-language/**'
      - 'course/drafts/kazakh-language/**'
      - 'docs/kazakh-language-course.md'
      - 'tools/course/generate_kazakh_language_foundations.py'
      - 'tools/course/kazakh_audio.py'
      - 'tools/course/generate_kazakh_language_maps.py'
      - 'tools/course/generate_kazakh_language_people_home.py'
      - 'tools/course/generate_kazakh_language_people_home_maps.py'
      - 'tools/course/generate_kazakh_language_school_city.py'
      - 'tools/course/generate_kazakh_language_school_city_maps.py'
      - 'tools/course/generate_kazakh_language_day_services.py'
      - 'tools/course/generate_kazakh_language_day_services_maps.py'
      - 'tools/course/generate_kazakh_language_space_cases.py'
      - 'tools/course/generate_kazakh_language_space_cases_maps.py'
      - 'tools/course/generate_kazakh_language_action_time.py'
      - 'tools/course/generate_kazakh_language_action_time_maps.py'
      - 'tools/course/generate_kazakh_language_plans_problems.py'
      - 'tools/course/generate_kazakh_language_connected_speech.py'
      - 'tools/course/generate_kazakh_language_information_opinion.py'
      - 'tools/course/generate_kazakh_language_independent.py'
      - 'tools/course/test_kazakh_language_plans_problems.py'
      - 'tools/course/generate_kazakh_audio_candidates.py'
      - 'tools/course/prepare_kazakh_language.py'
      - 'tools/course/prepare_kazakh_language_audio.py'
      - 'tools/course/test_kazakh_language_release.py'
      - 'web/static/course/kazakh-language/**'
      - 'web/static/covers/school/kazakh-language/**'

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate localized lesson and support maps
        run: |
          python3 tools/course/generate_kazakh_language_foundations.py
          python3 tools/course/generate_kazakh_language_maps.py
          python3 tools/course/generate_kazakh_language_people_home.py
          python3 tools/course/generate_kazakh_language_people_home_maps.py
          python3 tools/course/generate_kazakh_language_school_city.py
          python3 tools/course/generate_kazakh_language_school_city_maps.py
          python3 tools/course/generate_kazakh_language_day_services.py
          python3 tools/course/generate_kazakh_language_day_services_maps.py
          python3 tools/course/generate_kazakh_language_space_cases.py
          python3 tools/course/generate_kazakh_language_space_cases_maps.py
          python3 tools/course/generate_kazakh_language_action_time.py
          python3 tools/course/generate_kazakh_language_action_time_maps.py
          python3 -m tools.course.generate_kazakh_language_plans_problems
          python3 -m tools.course.generate_kazakh_language_connected_speech
          python3 -m tools.course.generate_kazakh_language_information_opinion
          python3 -m tools.course.generate_kazakh_language_independent
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Validate completed blocks
        run: python3 -m unittest tools.course.test_kazakh_language_release tools.course.test_kazakh_language_plans_problems
      - name: Prepare atomic publication
        run: |
          python3 tools/course/prepare_kazakh_language.py \
            --sql /tmp/kazakh-language-course.sql \
            --expected /tmp/kazakh-language-course.json
