name: Chemistry course

on:
  push:
    paths:
      - 'course/chemistry/**'
      - 'tools/course/*chemistry_quantities*'
      - 'tools/course/*chemistry_solutions*'
      - 'course/lessons/chemistry/**'
      - 'docs/chemistry-course.md'
      - 'tools/course/chemistry_data.py'
      - 'tools/course/chemistry_particles_data.py'
      - 'tools/course/chemistry_elements_data.py'
      - 'tools/course/prepare_chemistry_reactions.py'
      - 'tools/course/build_chemistry_reactions.py'
      - 'tools/course/chemistry_reactions_data.py'
      - 'tools/course/test_chemistry_reactions.py'
      - 'tools/course/prepare_chemistry_bonds.py'
      - 'tools/course/build_chemistry_bonds.py'
      - 'tools/course/chemistry_bonds_data.py'
      - 'tools/course/build_chemistry_block.py'
      - 'tools/course/build_chemistry_particles.py'
      - 'tools/course/build_chemistry_elements.py'
      - 'tools/course/prepare_chemistry.py'
      - 'tools/course/prepare_chemistry_particles.py'
      - 'tools/course/prepare_chemistry_elements.py'
      - 'tools/course/test_chemistry_release.py'
      - 'tools/course/lesson-slugs.json'
      - 'web/static/course/chemistry/**'
      - 'web/static/covers/school/chemistry/**'
      - 'web/static/brand/chemistry.svg'
  pull_request:
    paths:
      - 'course/chemistry/**'
      - 'tools/course/*chemistry_quantities*'
      - 'tools/course/*chemistry_solutions*'
      - 'course/lessons/chemistry/**'
      - 'docs/chemistry-course.md'
      - 'tools/course/chemistry_data.py'
      - 'tools/course/chemistry_particles_data.py'
      - 'tools/course/chemistry_elements_data.py'
      - 'tools/course/prepare_chemistry_reactions.py'
      - 'tools/course/build_chemistry_reactions.py'
      - 'tools/course/chemistry_reactions_data.py'
      - 'tools/course/test_chemistry_reactions.py'
      - 'tools/course/prepare_chemistry_bonds.py'
      - 'tools/course/build_chemistry_bonds.py'
      - 'tools/course/chemistry_bonds_data.py'
      - 'tools/course/build_chemistry_block.py'
      - 'tools/course/build_chemistry_particles.py'
      - 'tools/course/build_chemistry_elements.py'
      - 'tools/course/prepare_chemistry.py'
      - 'tools/course/prepare_chemistry_particles.py'
      - 'tools/course/prepare_chemistry_elements.py'
      - 'tools/course/test_chemistry_release.py'
      - 'tools/course/lesson-slugs.json'
      - 'web/static/course/chemistry/**'
      - 'web/static/covers/school/chemistry/**'
      - 'web/static/brand/chemistry.svg'

jobs:
  chemistry-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate lessons and maps
        run: |
          python3 tools/course/build_chemistry_block.py
          python3 tools/course/build_chemistry_particles.py
          python3 tools/course/build_chemistry_elements.py
          python3 tools/course/build_chemistry_bonds.py
          python3 tools/course/build_chemistry_reactions.py
          python3 tools/course/build_chemistry_quantities.py
          python3 tools/course/build_chemistry_solutions.py
      - name: Ensure generated lessons and maps are committed
        run: git diff --exit-code
      - name: Check complete block and publication transaction
        run: |
          python3 -m unittest tools.course.test_chemistry_release tools.course.test_chemistry_reactions tools.course.test_chemistry_quantities tools.course.test_chemistry_solutions
          python3 tools/course/prepare_chemistry.py --sql /tmp/chemistry-course.sql --expected /tmp/chemistry-expected.json
          python3 tools/course/prepare_chemistry_particles.py --sql /tmp/chemistry-particles.sql --expected /tmp/chemistry-particles-expected.json
          python3 tools/course/prepare_chemistry_elements.py --sql /tmp/chemistry-elements.sql --expected /tmp/chemistry-elements-expected.json
          python3 tools/course/prepare_chemistry_bonds.py --sql /tmp/chemistry-bonds.sql --expected /tmp/chemistry-bonds-expected.json
          python3 tools/course/prepare_chemistry_reactions.py --sql /tmp/chemistry-reactions.sql --expected /tmp/chemistry-reactions-expected.json
          python3 tools/course/prepare_chemistry_quantities.py --sql /tmp/chemistry-quantities.sql --expected /tmp/chemistry-quantities-expected.json
          python3 tools/course/prepare_chemistry_solutions.py --sql /tmp/chemistry-solutions.sql --expected /tmp/chemistry-solutions-expected.json
