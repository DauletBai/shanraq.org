name: Bug report
description: Report a problem with Shanraq or shanraq.org
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Shanraq. For **security vulnerabilities**, do
        not use this form — see our [Security Policy](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I …, the site …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Articles / publishing
        - Real-estate listings
        - Studio / admin panel
        - Auth / account
        - Other
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser / device / language, and page URL if relevant.
      placeholder: Chrome on Android, ru, /read/…
