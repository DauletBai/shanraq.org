<text x="988" y="265.0" font-family="Arial,sans-serif" font-size="19" fill="#143242" text-anchor="start">pH</text>
<text x="988" y="345.0" font-family="Arial,sans-serif" font-size="23" fill="#143242" text-anchor="start">Модельді тексер</text>
