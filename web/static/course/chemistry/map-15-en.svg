<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">How do we find an element’s address in the periodic table?</title><desc id="desc">Teaching model · particles and distances are not to scale</desc>
<rect width="1280" height="560" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">How do we find an element’s address in the periodic table?</text>
<text x="40" y="145" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Teaching model · particles and distances are not to scale</text>
<rect x="40" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="60" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">1. PERIOD</text>
<text x="60" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Horizontal row</text>
<text x="322" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="370" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">2. GROUP</text>
<text x="370" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Vertical, 1–18</text>
<text x="632" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="680" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">3. LOCATE</text>
<text x="680" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Na: 3 / 1</text>
<text x="942" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="990" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">4. LIMIT</text>
<text x="990" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Not a full</text>
<text x="990" y="356" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">catalogue</text>
</svg>
