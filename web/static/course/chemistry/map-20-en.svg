<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Why can atomic weight be a decimal?</title><desc id="desc">Teaching model · particles and distances are not to scale</desc>
<rect width="1280" height="560" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">Why can atomic weight be a decimal?</text>
<text x="40" y="145" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Teaching model · particles and distances are not to scale</text>
<rect x="40" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="60" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">1. MIXTURE</text>
<text x="60" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Fractions total</text>
<text x="60" y="356" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">100%</text>
<text x="322" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="370" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">2. CALCULATE</text>
<text x="370" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">0.75×20 + 0.25×22</text>
<text x="632" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="680" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">3. Aᵣ</text>
<text x="680" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">20.5, no unit</text>
<text x="942" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="990" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">4. LIMIT</text>
<text x="990" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Not a single atom</text>
</svg>
