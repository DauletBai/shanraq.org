<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Зат формуласын өзгертпей реакцияны қалай теңестіреміз?</title><desc id="desc">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</desc>
<rect width="1280" height="560" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">Зат формуласын өзгертпей реакцияны қалай теңестіреміз?</text>
<text x="40" y="150" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</text>
<rect x="40" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="58" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ФОРМУЛА</text>
<text x="58" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Индексті өзгертпе</text>
<text x="323" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="368" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ОТТЕК</text>
<text x="368" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Екі жақта да 6 O</text>
<text x="633" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="678" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">АЛЮМИНИЙ</text>
<text x="678" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Екі жақта да 4 Al</text>
<text x="943" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="988" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ҚАТЫНАС</text>
<text x="988" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">4 : 3 : 2</text>
</svg>
