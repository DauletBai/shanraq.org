<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Почему ионный кристалл не состоит из молекул NaCl?</title><desc id="desc">Учебная модель · частицы и расстояния не в масштабе</desc>
<rect width="1280" height="560" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">Почему ионный кристалл не состоит из молекул NaCl?</text>
<text x="40" y="145" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная модель · частицы и расстояния не в масштабе</text>
<rect x="40" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="58" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">ИОНЫ</text>
<text x="58" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Na⁺ и Cl⁻</text>
<text x="323" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="368" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">ПРИТЯЖЕНИЕ</text>
<text x="368" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Противоположные</text>
<text x="368" y="356" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">заряды</text>
<text x="633" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="678" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">РЕШЁТКА</text>
<text x="678" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Не отдельные пары</text>
<text x="943" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="988" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">ФОРМУЛА</text>
<text x="988" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">NaCl: 1 : 1</text>
</svg>
