<text x="323" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="200" width="275" height="290" rx="18" fill="#e6f4ef"/>
<text x="368" y="250" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">СРАВНИ</text>
<text x="368" y="320" font-family="Arial,sans-serif" font-size="23" fill="#143242" text-anchor="start">n / ν</text>
<text x="633" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="200" width="275" height="290" rx="18" fill="#e6f4ef"/>
<text x="678" y="250" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">МИНИМУМ</text>
<text x="678" y="320" font-family="Arial,sans-serif" font-size="23" fill="#143242" text-anchor="start">Ограничивает</text>
<text x="943" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="200" width="275" height="290" rx="18" fill="#e6f4ef"/>
<text x="988" y="250" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ОСТАТОК</text>
