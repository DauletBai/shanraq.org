<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Как строение помогает объяснять свойства вещества?</title><desc id="desc">Учебная модель · частицы и расстояния не в масштабе</desc>
<rect width="1280" height="560" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">Как строение помогает объяснять свойства вещества?</text>
<text x="40" y="145" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная модель · частицы и расстояния не в масштабе</text>
<rect x="40" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="58" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">ЧАСТИЦЫ</text>
<text x="58" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Молекулы или</text>
<text x="58" y="356" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">решётка</text>
<text x="323" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="368" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">СВЯЗИ</text>
<text x="368" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Внутри и между</text>
<text x="633" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="678" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">ПРОВОДИМОСТЬ</text>
<text x="678" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Подвижные</text>
<text x="678" y="356" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">носители</text>
<text x="943" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="988" y="244" font-family="Arial,sans-serif" font-size="21" fill="#143242" text-anchor="start">ПРЕДЕЛ</text>
<text x="988" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Одного признака</text>
<text x="988" y="356" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">мало</text>
</svg>
