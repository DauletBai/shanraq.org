<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Как читать индексы, скобки и коэффициенты?</title><desc id="desc">Условная модель, не в масштабе</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="45" y="55" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">30 · Как читать индексы, скобки и коэффициенты?</text>
<text x="45" y="110" font-family="Arial,sans-serif" font-size="22" fill="#bedde4" text-anchor="start">Условная модель, не в масштабе</text>
<text x="640" y="185" font-family="Arial,sans-serif" font-size="32" fill="#f1f7f2" text-anchor="middle">Скобки → индекс → коэффициент</text>
<text x="640" y="300" font-family="Arial,sans-serif" font-size="78" fill="#f1f7f2" text-anchor="middle">2Ca(OH)₂</text>
<text x="640" y="420" font-family="Arial,sans-serif" font-size="47" fill="#f1f7f2" text-anchor="middle">1 Ca · 2 O · 2 H</text>
<text x="640" y="505" font-family="Arial,sans-serif" font-size="44" fill="#f1f7f2" text-anchor="middle">↓ × 2</text>
<text x="640" y="610" font-family="Arial,sans-serif" font-size="55" fill="#f1f7f2" text-anchor="middle">2 Ca · 4 O · 4 H</text>
</svg>
