<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">How does molar concentration differ from mass fraction?</title><desc id="desc">5.85 g NaCl corresponds to 0.100 mol; in 0.500 L of final solution c is 0.200 mol/L.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">56 · How does molar concentration differ from mass fraction?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Teaching model · particles and sizes are not to scale</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">5.85 g NaCl  →  5.85 / 58.5</text>
<text x="65" y="296.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">0.100 mol</text>
<rect x="40" y="355" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="397.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">0.500 L  →  0.100 / 0.500</text>
<text x="65" y="446.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">0.200 mol/L</text>
<rect x="40" y="505" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="547.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">0.30 mol/L; 0.20 L  →  0.060 × 58.5</text>
<text x="65" y="596.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">3.51 g</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">5.85 g NaCl corresponds to 0.100 mol; in 0.500 L of final solution c is 0.200 mol/L.</text>
</svg>
