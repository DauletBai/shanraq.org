<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Бейтараптануда не өзгереді және қандай иондар қалады?</title><desc id="desc">H₃O⁺ пен OH⁻ екі H₂O береді. Na⁺ пен Cl⁻ дейін де, кейін де бар; теңдеудегі қысқарту тұзды ерітіндіден жоймайды.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">63 · Бейтараптануда не өзгереді және қандай иондар қалады?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу сызбасы · деректер берілген · тәжірибе нұсқауы емес</text>
<rect x="40" y="230" width="1200" height="120" rx="18" fill="#173e4d"/>
<text x="640" y="300" font-family="Arial,sans-serif" font-size="37" fill="#f1f7f2" text-anchor="middle">H₃O⁺ + OH⁻   →   2H₂O</text>
<rect x="40" y="380" width="1200" height="120" rx="18" fill="#173e4d"/>
<text x="640" y="450" font-family="Arial,sans-serif" font-size="37" fill="#f1f7f2" text-anchor="middle">Na⁺ + Cl⁻   →   Na⁺ + Cl⁻</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">H₃O⁺ пен OH⁻ екі H₂O береді. Na⁺ пен Cl⁻ дейін де, кейін де бар; теңдеудегі қысқарту тұзды</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">ерітіндіден жоймайды.</text>
</svg>
