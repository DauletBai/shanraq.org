<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Химиялық реакцияны пішін өзгерісінен қалай ажыратамыз?</title><desc id="desc">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">32 · Химиялық реакцияны пішін өзгерісінен қалай ажыратамыз?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</text>
<rect x="40" y="200" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="252" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">H₂O(s) → H₂O(l)</text>
<text x="640" y="308" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Жаңа зат бар ма?</text>
<rect x="40" y="358" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="410" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">CO₂(aq) → CO₂(g)</text>
<text x="640" y="466" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Баламаларды қара</text>
<rect x="40" y="516" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="568" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">?</text>
<text x="640" y="624" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Шегін көрсет</text>
</svg>
