<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Неліктен қауіпсіздік туралы шешімге бір pH жеткіліксіз?</title><desc id="desc">Ойдан алынған A және B заттаңбасы араластыруға тыйым салады; белгісіз C зерттеуді тоқтатып, жауапты ересекке хабарлауды талап етеді.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">66 · Неліктен қауіпсіздік туралы шешімге бір pH жеткіліксіз?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу сызбасы · деректер берілген · тәжірибе нұсқауы емес</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">A: pH 2  →  араластырмау</text>
<text x="65" y="303.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">заттаңбаны орындау</text>
<rect x="40" y="350" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="392.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">B: pH 11  →  бөлек қолдану</text>
<text x="65" y="448.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">заттаңбаны орындау</text>
<rect x="40" y="495" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="537.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">C: белгісіз  →  заттаңба жоқ</text>
<text x="65" y="593.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">жауапты ересек</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">Ойдан алынған A және B заттаңбасы араластыруға тыйым салады; белгісіз C зерттеуді тоқтатып,</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">жауапты ересекке хабарлауды талап етеді.</text>
</svg>
