<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Дело о соли: что доказывают формулы и модели связей?</title><desc id="desc">Условная модель, не в масштабе</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="45" y="55" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">31 · Дело о соли: что доказывают формулы и модели связей?</text>
<text x="45" y="110" font-family="Arial,sans-serif" font-size="22" fill="#bedde4" text-anchor="start">Условная модель, не в масштабе</text>
<text x="640" y="185" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Данные → модель → предел</text>
<text x="240" y="325" font-family="Arial,sans-serif" font-size="58" fill="#f1f7f2" text-anchor="middle">NaCl</text>
<text x="640" y="325" font-family="Arial,sans-serif" font-size="58" fill="#f1f7f2" text-anchor="middle">H₂O</text>
<text x="1040" y="325" font-family="Arial,sans-serif" font-size="58" fill="#f1f7f2" text-anchor="middle">CO₂</text>
<text x="640" y="465" font-family="Arial,sans-serif" font-size="43" fill="#f1f7f2" text-anchor="middle">CaCl₂: (+2) + 2 × (−1) = 0</text>
<text x="640" y="535" font-family="Arial,sans-serif" font-size="42" fill="#f1f7f2" text-anchor="middle">2CaCl₂: Ca × 2; Cl × 4</text>
<text x="640" y="650" font-family="Arial,sans-serif" font-size="40" fill="#f1f7f2" text-anchor="middle">Цвет ≠ состав</text>
</svg>
