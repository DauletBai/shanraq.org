<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Как составить формулу по заданным зарядам ионов?</title><desc id="desc">Условная модель, не в масштабе</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="45" y="55" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">28 · Как составить формулу по заданным зарядам ионов?</text>
<text x="45" y="110" font-family="Arial,sans-serif" font-size="22" fill="#bedde4" text-anchor="start">Условная модель, не в масштабе</text>
<text x="640" y="185" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Заряды заданы</text>
<text x="640" y="285" font-family="Arial,sans-serif" font-size="62" fill="#f1f7f2" text-anchor="middle">Al³⁺  +  O²⁻</text>
<text x="640" y="400" font-family="Arial,sans-serif" font-size="45" fill="#f1f7f2" text-anchor="middle">2 × (+3) + 3 × (−2) = 0</text>
<text x="640" y="535" font-family="Arial,sans-serif" font-size="85" fill="#f1f7f2" text-anchor="middle">Al₂O₃</text>
<text x="640" y="650" font-family="Arial,sans-serif" font-size="49" fill="#f1f7f2" text-anchor="middle">2 : 3</text>
</svg>
