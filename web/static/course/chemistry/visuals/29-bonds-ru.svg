<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Чем валентность отличается от заряда иона?</title><desc id="desc">Условная модель, не в масштабе</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="45" y="55" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">29 · Чем валентность отличается от заряда иона?</text>
<text x="45" y="110" font-family="Arial,sans-serif" font-size="22" fill="#bedde4" text-anchor="start">Условная модель, не в масштабе</text>
<text x="640" y="185" font-family="Arial,sans-serif" font-size="36" fill="#f1f7f2" text-anchor="middle">Связи ≠ заряд</text>
<text x="230" y="330" font-family="Arial,sans-serif" font-size="55" fill="#f1f7f2" text-anchor="middle">H—H</text>
<text x="230" y="475" font-family="Arial,sans-serif" font-size="75" fill="#f1f7f2" text-anchor="middle">I</text>
<text x="640" y="330" font-family="Arial,sans-serif" font-size="55" fill="#f1f7f2" text-anchor="middle">O=O</text>
<text x="640" y="475" font-family="Arial,sans-serif" font-size="75" fill="#f1f7f2" text-anchor="middle">II</text>
<text x="1050" y="330" font-family="Arial,sans-serif" font-size="55" fill="#f1f7f2" text-anchor="middle">N≡N</text>
<text x="1050" y="475" font-family="Arial,sans-serif" font-size="75" fill="#f1f7f2" text-anchor="middle">III</text>
<text x="640" y="650" font-family="Arial,sans-serif" font-size="42" fill="#f1f7f2" text-anchor="middle">H₂ · O₂ · N₂ : 0</text>
