<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Почему доля атомов и доля массы — разные ответы?</title><desc id="desc">Учебная расчётная модель · величины и частицы не в масштабе</desc>
<rect width="1280" height="760" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">44 · Почему доля атомов и доля массы — разные ответы?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная расчётная модель · величины и частицы не в масштабе</text>
<rect x="40" y="200" width="1200" height="148" rx="18" fill="#173e4d"/>
<text x="75" y="254" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">H₂O: H</text>
<text x="450" y="254" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">2 / 18</text>
<text x="640" y="312" font-family="Arial,sans-serif" font-size="32" fill="#f1f7f2" text-anchor="middle">→ ≈ 11.1%</text>
<rect x="40" y="368" width="1200" height="148" rx="18" fill="#173e4d"/>
<text x="75" y="422" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">H₂O: O</text>
<text x="450" y="422" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">16 / 18</text>
<text x="640" y="480" font-family="Arial,sans-serif" font-size="32" fill="#f1f7f2" text-anchor="middle">→ ≈ 88.9%</text>
<rect x="40" y="536" width="1200" height="148" rx="18" fill="#173e4d"/>
<text x="75" y="590" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">CO₂: C</text>
<text x="450" y="590" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">12 / 44</text>
<text x="640" y="648" font-family="Arial,sans-serif" font-size="32" fill="#f1f7f2" text-anchor="middle">→ ≈ 27.3%</text>
</svg>
