<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Which particles remain in a solution?</title><desc id="desc">Four Na⁺ and four Cl⁻ ions: equal counts and zero total charge. Sucrose remains molecular.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">52 · Which particles remain in a solution?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Teaching model · particles and sizes are not to scale</text>
<circle data-ion="Na⁺" cx="100" cy="260" r="48" fill="#a1d9dd"/>
<text x="100" y="269" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Na⁺</text>
<circle data-ion="Cl⁻" cx="255" cy="260" r="48" fill="#a1d9dd"/>
<text x="255" y="269" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Cl⁻</text>
<circle data-ion="Na⁺" cx="410" cy="260" r="48" fill="#a1d9dd"/>
<text x="410" y="269" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Na⁺</text>
<circle data-ion="Cl⁻" cx="565" cy="260" r="48" fill="#a1d9dd"/>
<text x="565" y="269" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Cl⁻</text>
<circle data-ion="Na⁺" cx="100" cy="420" r="48" fill="#a1d9dd"/>
<text x="100" y="429" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Na⁺</text>
<circle data-ion="Cl⁻" cx="255" cy="420" r="48" fill="#a1d9dd"/>
<text x="255" y="429" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Cl⁻</text>
<circle data-ion="Na⁺" cx="410" cy="420" r="48" fill="#a1d9dd"/>
<text x="410" y="429" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Na⁺</text>
<circle data-ion="Cl⁻" cx="565" cy="420" r="48" fill="#a1d9dd"/>
<text x="565" y="429" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">Cl⁻</text>
<text x="910" y="300" font-family="Arial,sans-serif" font-size="36" fill="#f1f7f2" text-anchor="middle">C₁₂H₂₂O₁₁</text>
<text x="910" y="400" font-family="Arial,sans-serif" font-size="36" fill="#f1f7f2" text-anchor="middle">q = 0</text>
<text x="40" y="610.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">Four Na⁺ and four Cl⁻ ions: equal counts and zero total charge. Sucrose</text>
<text x="40" y="643.75" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">remains molecular.</text>
