<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Дело о соли: что доказывает нейтрализация?</title><desc id="desc">При равных количествах образуется 0,0020 моль NaCl массой 0,117 г. При 18 мл щёлочи остаётся кислотный избыток; pH≈2,28 в модели.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">67 · Дело о соли: что доказывает нейтрализация?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная схема · данные заданы · не инструкция для опыта</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">20 mL + 20 mL; 0.10 mol/L  →  n(NaCl) = 0.0020 mol</text>
<text x="65" y="303.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">m = 0.117 g</text>
<rect x="40" y="350" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="392.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">V = 0.040 L; 25 °C  →  c(NaCl) = 0.050 mol/L</text>
<text x="65" y="448.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">pH ≈ 7 в модели</text>
<rect x="40" y="495" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="537.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">20 mL HCl + 18 mL NaOH  →  избыток кислоты = 0.0002 mol</text>
<text x="65" y="593.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">pH ≈ 2.28</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">При равных количествах образуется 0,0020 моль NaCl массой 0,117 г. При 18 мл щёлочи остаётся</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">кислотный избыток; pH≈2,28 в модели.</text>
</svg>
