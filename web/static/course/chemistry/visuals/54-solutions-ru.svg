<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Что означает процент на этикетке раствора?</title><desc id="desc">12 г вещества и 188 г воды дают 200 г раствора и 6% вещества по массе.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">54 · Что означает процент на этикетке раствора?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная модель · частицы и размеры не в масштабе</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">12 g + 188 g  →  12 / 200</text>
<text x="65" y="296.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">6%</text>
<rect x="40" y="355" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="397.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">12 g + 88 g  →  12 / 100</text>
<text x="65" y="446.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">12%</text>
<rect x="40" y="505" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="547.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">7.5 g + 142.5 g  →  7.5 / 150</text>
<text x="65" y="596.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">5%</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">12 г вещества и 188 г воды дают 200 г раствора и 6% вещества по массе.</text>
</svg>
