<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Тұз туралы іс: ерітінді есебін қалай тексереміз?</title><desc id="desc">10 г тұз, бастапқы 100 г және соңғы 200 г ерітінді тізбегінде үлес 10%-дан 5%-ға кемиді.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">58 · Тұз туралы іс: ерітінді есебін қалай тексереміз?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу моделі · бөлшектер мен өлшемдер масштабта емес</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">10 g + 90 g  →  10 / 100</text>
<text x="65" y="296.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">10%</text>
<rect x="40" y="355" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="397.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">+ 100 g H₂O  →  10 / 200</text>
<text x="65" y="446.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">5%</text>
<rect x="40" y="505" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="547.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">V = 0.195 L  →  (10 / 58.5) / 0.195</text>
<text x="65" y="596.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">≈ 0.877 mol/L</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">10 г тұз, бастапқы 100 г және соңғы 200 г ерітінді тізбегінде үлес 10%-дан 5%-ға кемиді.</text>
</svg>
