<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">How do mole balances identify excess acid or alkali?</title><desc id="desc">HCl amount is 5.0 mmol and NaOH 4.0 mmol: the 1:1 balance leaves 1.0 mmol acid excess. Bar lengths represent mole amounts, not volumes.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">64 · How do mole balances identify excess acid or alkali?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Teaching schematic · supplied data · not an experiment procedure</text>
<text x="50" y="272" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">HCl</text>
<rect data-amount-mmol="5" x="350" y="225" width="700" height="75" rx="10" fill="#75b6bf"/>
<text x="1070" y="273" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">5.0 mmol</text>
<text x="50" y="402" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">NaOH</text>
<rect data-amount-mmol="4" x="350" y="355" width="560" height="75" rx="10" fill="#75b6bf"/>
<text x="930" y="403" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">4.0 mmol</text>
<text x="50" y="532" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">HCl − NaOH</text>
<rect data-amount-mmol="1" x="350" y="485" width="140" height="75" rx="10" fill="#e9bb80"/>
<text x="510" y="533" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">1.0 mmol</text>
<text x="640" y="650" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">1 : 1     5.0 − 4.0 = 1.0 mmol</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">HCl amount is 5.0 mmol and NaOH 4.0 mmol: the 1:1 balance leaves 1.0 mmol acid excess. Bar</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">lengths represent mole amounts, not volumes.</text>
</svg>
