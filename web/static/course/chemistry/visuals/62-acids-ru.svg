<text x="320" y="279" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">HA</text>
<circle data-acid-unit="HA" cx="520" cy="270" r="48" fill="#a1d9dd"/>
<text x="520" y="279" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">HA</text>
<circle data-acid-unit="HA" cx="720" cy="270" r="48" fill="#a1d9dd"/>
<text x="720" y="279" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">HA</text>
