<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Почему сильная кислота не обязательно концентрированная?</title><desc id="desc">Из десяти кислотных единиц девять HA и одна A⁻; рядом один H₃O⁺. Заданный ионизированный вклад 1 из 10, общий заряд ноль; вода опущена.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">62 · Почему сильная кислота не обязательно</text>
<text x="40" y="94.15" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">концентрированная?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная схема · данные заданы · не инструкция для опыта</text>
