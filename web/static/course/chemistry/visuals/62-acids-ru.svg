<text x="920" y="429" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">A⁻</text>
<circle data-hydronium="1" cx="1140" cy="420" r="58" fill="#e9bb80"/>
<text x="1140" y="429" font-family="Arial,sans-serif" font-size="27" fill="#102b3b" text-anchor="middle">H₃O⁺</text>
<text x="640" y="590" font-family="Arial,sans-serif" font-size="38" fill="#f1f7f2" text-anchor="middle">α = 1/10 = 0.10     q = 0</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">Из десяти кислотных единиц девять HA и одна A⁻; рядом один H₃O⁺. Заданный ионизированный</text>
