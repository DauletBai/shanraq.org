<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Құрылыс зат қасиеттерін түсіндіруге қалай көмектеседі?</title><desc id="desc">Шартты модель, масштабсыз</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="45" y="55" font-family="Arial,sans-serif" font-size="27" fill="#f1f7f2" text-anchor="start">27 · Құрылыс зат қасиеттерін түсіндіруге қалай көмектеседі?</text>
<text x="45" y="110" font-family="Arial,sans-serif" font-size="22" fill="#bedde4" text-anchor="start">Шартты модель, масштабсыз</text>
<text x="640" y="185" font-family="Arial,sans-serif" font-size="32" fill="#f1f7f2" text-anchor="middle">Бөлшек пен тасымалдаушы</text>
<text x="190" y="300" font-family="Arial,sans-serif" font-size="53" fill="#f1f7f2" text-anchor="middle">H₂O</text>
<text x="190" y="395" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">молекулалар</text>
<text x="190" y="525" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">—</text>
<text x="490" y="300" font-family="Arial,sans-serif" font-size="53" fill="#f1f7f2" text-anchor="middle">NaCl</text>
<text x="490" y="395" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">иондар</text>
<text x="490" y="525" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">иондар</text>
<text x="790" y="300" font-family="Arial,sans-serif" font-size="53" fill="#f1f7f2" text-anchor="middle">Cu</text>
<text x="790" y="395" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">Cu</text>
<text x="790" y="525" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">электрондар</text>
<text x="1090" y="300" font-family="Arial,sans-serif" font-size="53" fill="#f1f7f2" text-anchor="middle">C</text>
<text x="1090" y="395" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">атомдар торы</text>
<text x="1090" y="525" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">—</text>
<text x="640" y="640" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="middle">NaCl: балқыма · Cu: қатты</text>
</svg>
