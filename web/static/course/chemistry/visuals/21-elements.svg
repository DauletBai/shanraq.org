<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Chemistry 21: symbolic teaching diagram</title><desc id="desc">Original diagram. Sizes, colours and distances are symbolic, not to scale.</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="65" y="88" font-family="Arial,sans-serif" font-size="36" fill="#f1f7f2" text-anchor="start">CHEMISTRY · 21</text>
<rect x="140" y="190" width="420" height="360" rx="22" fill="#e5f3ed" fill-opacity=".12" stroke="#70c7cb" stroke-width="4"/>
<text x="350" y="275" font-family="Arial,sans-serif" font-size="67" fill="#f1f7f2" text-anchor="middle">Mg</text>
<text x="350" y="375" font-family="Arial,sans-serif" font-size="42" fill="#f1f7f2" text-anchor="middle">12 p · 12 e</text>
<text x="350" y="465" font-family="Arial,sans-serif" font-size="43" fill="#f1f7f2" text-anchor="middle">2 | 8 | 2</text>
<rect x="740" y="190" width="420" height="360" rx="22" fill="#e5f3ed" fill-opacity=".12" stroke="#70c7cb" stroke-width="4"/>
<text x="950" y="275" font-family="Arial,sans-serif" font-size="67" fill="#f1f7f2" text-anchor="middle">Mg²⁺</text>
<text x="950" y="375" font-family="Arial,sans-serif" font-size="42" fill="#f1f7f2" text-anchor="middle">12 p · 10 e</text>
<text x="950" y="465" font-family="Arial,sans-serif" font-size="43" fill="#f1f7f2" text-anchor="middle">2 | 8</text>
<text x="650" y="375" font-family="Arial,sans-serif" font-size="65" fill="#f1f7f2" text-anchor="middle">→</text>
<text x="640" y="655" font-family="Arial,sans-serif" font-size="40" fill="#f1f7f2" text-anchor="middle">Z = 12 · period 3 · group 2</text>
</svg>
