<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Зачем различать типы реакций, если формулы уже известны?</title><desc id="desc">Учебная модель · частицы и расстояния не в масштабе</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">39 · Зачем различать типы реакций, если формулы уже известны?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная модель · частицы и расстояния не в масштабе</text>
<rect x="40" y="200" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="252" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">2Mg + O₂ → 2MgO</text>
<text x="640" y="308" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">CaCO₃ → CaO + CO₂</text>
<rect x="40" y="358" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="410" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Zn + CuSO₄ → ZnSO₄ + Cu</text>
<text x="640" y="466" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Na₂CO₃ + CaCl₂ → CaCO₃ + 2NaCl</text>
<rect x="40" y="516" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="568" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">УСЛОВИЯ</text>
<text x="640" y="624" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Не прогноз реакции</text>
</svg>
