<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Зат формуласын өзгертпей реакцияны қалай теңестіреміз?</title><desc id="desc">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</desc>
<rect width="1280" height="720" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">35 · Зат формуласын өзгертпей реакцияны қалай теңестіреміз?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</text>
<rect x="40" y="200" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="252" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">4Al + 3O₂ → 2Al₂O₃</text>
<text x="640" y="308" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">4 : 3 : 2</text>
<rect x="40" y="358" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="410" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">Al: 4 → 4</text>
<text x="640" y="466" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">O: 6 → 6</text>
<rect x="40" y="516" width="1200" height="140" rx="18" fill="#173e4d"/>
<text x="640" y="568" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">8 : 6 : 4</text>
<text x="640" y="624" font-family="Arial,sans-serif" font-size="34" fill="#f1f7f2" text-anchor="middle">↓ ÷ 2</text>
</svg>
