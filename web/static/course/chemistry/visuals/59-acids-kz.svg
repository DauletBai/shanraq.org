<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Судағы модельде қышқыл мен негіздің айырмасы қандай?</title><desc id="desc">HCl мен су H₃O⁺ пен Cl⁻ береді; NH₃ пен су NH₄⁺ пен OH⁻ түзеді. Протон беріледі, атомдар мен заряд сақталады.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">59 · Судағы модельде қышқыл мен негіздің айырмасы қандай?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу сызбасы · деректер берілген · тәжірибе нұсқауы емес</text>
<rect x="40" y="230" width="1200" height="120" rx="18" fill="#173e4d"/>
<text x="640" y="300" font-family="Arial,sans-serif" font-size="37" fill="#f1f7f2" text-anchor="middle">HCl + H₂O   →   H₃O⁺ + Cl⁻</text>
<rect x="40" y="380" width="1200" height="120" rx="18" fill="#173e4d"/>
<text x="640" y="450" font-family="Arial,sans-serif" font-size="37" fill="#f1f7f2" text-anchor="middle">NH₃ + H₂O   ⇌   NH₄⁺ + OH⁻</text>
<rect x="40" y="530" width="1200" height="120" rx="18" fill="#173e4d"/>
<text x="640" y="600" font-family="Arial,sans-serif" font-size="37" fill="#f1f7f2" text-anchor="middle">HNO₃ + H₂O   →   H₃O⁺ + NO₃⁻</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">HCl мен су H₃O⁺ пен Cl⁻ береді; NH₃ пен су NH₄⁺ пен OH⁻ түзеді. Протон беріледі, атомдар мен</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">заряд сақталады.</text>
</svg>
