<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Почему одного pH недостаточно для решения о безопасности?</title><desc id="desc">Вымышленные этикетки A и B запрещают смешивание; неизвестная карточка C требует прекратить исследование и обратиться к ответственному взрослому.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">66 · Почему одного pH недостаточно для решения о</text>
<text x="40" y="94.15" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">безопасности?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная схема · данные заданы · не инструкция для опыта</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">A: pH 2  →  не смешивать</text>
<text x="65" y="303.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">следовать этикетке</text>
<rect x="40" y="350" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="392.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">B: pH 11  →  использовать отдельно</text>
<text x="65" y="448.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">следовать этикетке</text>
<rect x="40" y="495" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="537.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">C: неизвестное  →  нет этикетки</text>
<text x="65" y="593.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">ответственный взрослый</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">Вымышленные этикетки A и B запрещают смешивание; неизвестная карточка C требует прекратить</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">исследование и обратиться к ответственному взрослому.</text>
</svg>
