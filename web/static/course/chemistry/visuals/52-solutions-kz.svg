<text x="40" y="610.0" font-family="Arial,sans-serif" font-size="25" fill="#f1f7f2" text-anchor="start">Төрт Na⁺ және төрт Cl⁻ моделі: сандар тең, заряд нөл. Сахароза молекула</text>
