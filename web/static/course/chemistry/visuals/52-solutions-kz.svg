<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Ерітіндіде қандай бөлшектер қалады?</title><desc id="desc">Төрт Na⁺ және төрт Cl⁻ моделі: сандар тең, заряд нөл. Сахароза молекула болып қалады.</desc>
