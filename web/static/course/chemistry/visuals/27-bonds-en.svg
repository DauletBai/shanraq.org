<text x="1090" y="300" font-family="Arial,sans-serif" font-size="53" fill="#f1f7f2" text-anchor="middle">C</text>
<text x="1090" y="395" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">atom network</text>
