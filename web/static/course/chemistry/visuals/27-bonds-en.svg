<text x="190" y="525" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">—</text>
<text x="490" y="300" font-family="Arial,sans-serif" font-size="53" fill="#f1f7f2" text-anchor="middle">NaCl</text>
<text x="490" y="395" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">ions</text>
<text x="490" y="525" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="middle">ions</text>
