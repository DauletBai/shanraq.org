<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">How can we distinguish a solution from a suspension?</title><desc id="desc">10 g salt plus 90 g water gives 100 g homogeneous solution; a 20 g portion contains 2 g salt.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">51 · How can we distinguish a solution from a suspension?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Teaching model · particles and sizes are not to scale</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">NaCl  →  10 g + 90 g</text>
<text x="65" y="296.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">100 g</text>
<rect x="40" y="355" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="397.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">20 g  →  20 / 100</text>
<text x="65" y="446.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">2 g NaCl</text>
<rect x="40" y="505" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="547.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">15 g  →  15 / 60</text>
<text x="65" y="596.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">1.5 g</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">10 g salt plus 90 g water gives 100 g homogeneous solution; a 20 g portion contains 2 g</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">salt.</text>
</svg>
