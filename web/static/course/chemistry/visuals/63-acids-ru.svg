<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Что меняется при нейтрализации и какие ионы остаются?</title><desc id="desc">H₃O⁺ и OH⁻ дают две H₂O. Ионы Na⁺ и Cl⁻ присутствуют до и после; их сокращение в уравнении не удаляет соль из раствора.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">63 · Что меняется при нейтрализации и какие ионы остаются?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная схема · данные заданы · не инструкция для опыта</text>
<rect x="40" y="230" width="1200" height="120" rx="18" fill="#173e4d"/>
<text x="640" y="300" font-family="Arial,sans-serif" font-size="37" fill="#f1f7f2" text-anchor="middle">H₃O⁺ + OH⁻   →   2H₂O</text>
<rect x="40" y="380" width="1200" height="120" rx="18" fill="#173e4d"/>
<text x="640" y="450" font-family="Arial,sans-serif" font-size="37" fill="#f1f7f2" text-anchor="middle">Na⁺ + Cl⁻   →   Na⁺ + Cl⁻</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">H₃O⁺ и OH⁻ дают две H₂O. Ионы Na⁺ и Cl⁻ присутствуют до и после; их сокращение в уравнении</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">не удаляет соль из раствора.</text>
</svg>
