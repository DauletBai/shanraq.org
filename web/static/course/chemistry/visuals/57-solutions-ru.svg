<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Что сохраняется при разбавлении раствора?</title><desc id="desc">Количество вещества сохраняется: 100 мл при 0,50 моль/л доведены до 250 мл при 0,20 моль/л.</desc>
<rect width="1280" height="820" rx="24" fill="#102b3b"/>
<text x="40" y="55.0" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">57 · Что сохраняется при разбавлении раствора?</text>
<text x="40" y="155" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная модель · частицы и размеры не в масштабе</text>
<rect x="40" y="205" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="247.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">100 → 250 mL  →  0.50 × 100 / 250</text>
<text x="65" y="296.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">0.20 mol/L</text>
<rect x="40" y="355" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="397.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">100 g; 10% + 100 g; 4%  →  14 / 200</text>
<text x="65" y="446.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">7%</text>
<rect x="40" y="505" width="1200" height="130" rx="18" fill="#173e4d"/>
<text x="65" y="547.0" font-family="Arial,sans-serif" font-size="26" fill="#f1f7f2" text-anchor="start">50 g; 10% + 150 g; 4%  →  11 / 200</text>
<text x="65" y="596.0" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">5.5%</text>
<text x="40" y="725.0" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">Количество вещества сохраняется: 100 мл при 0,50 моль/л доведены до 250 мл при 0,20</text>
<text x="40" y="753.35" font-family="Arial,sans-serif" font-size="21" fill="#f1f7f2" text-anchor="start">моль/л.</text>
</svg>
