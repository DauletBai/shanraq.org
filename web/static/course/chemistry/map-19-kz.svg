<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Периодтық үрдістер және болжамның шегі</title><desc id="desc">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</desc>
<rect width="1280" height="560" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">Периодтық үрдістер және болжамның шегі</text>
<text x="40" y="145" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Оқу моделі · бөлшектер мен арақашықтық масштабта емес</text>
<rect x="40" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="60" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">1. ТӨМЕН</text>
<text x="60" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Li &lt; Na &lt; K</text>
<text x="322" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="370" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">2. ОҢҒА</text>
<text x="370" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Na &gt; Mg &gt; Al</text>
<text x="632" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="680" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">3. СЕБЕП</text>
<text x="680" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Қабат пен ядро</text>
<text x="942" y="365" font-family="Arial,sans-serif" font-size="29" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="990" y="244" font-family="Arial,sans-serif" font-size="22" fill="#143242" text-anchor="start">4. ШЕК</text>
<text x="990" y="320" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Бір қасиет</text>
</svg>
