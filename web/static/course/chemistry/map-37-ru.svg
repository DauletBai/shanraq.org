<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Почему масса на весах может измениться, хотя атомы сохраняются?</title><desc id="desc">Учебная модель · частицы и расстояния не в масштабе</desc>
<rect width="1280" height="560" rx="24" fill="#102b3b"/>
<text x="40" y="55" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">Почему масса на весах может измениться, хотя атомы</text>
<text x="40" y="92" font-family="Arial,sans-serif" font-size="30" fill="#f1f7f2" text-anchor="start">сохраняются?</text>
<text x="40" y="150" font-family="Arial,sans-serif" font-size="20" fill="#bedde4" text-anchor="start">Учебная модель · частицы и расстояния не в масштабе</text>
<rect x="40" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="58" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ГРАНИЦА</text>
<text x="58" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Что входит в</text>
<text x="58" y="345" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">систему?</text>
<text x="323" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="350" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="368" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ЗАКРЫТАЯ</text>
<text x="368" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Нет обмена</text>
<text x="368" y="345" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">веществом</text>
<text x="633" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="660" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="678" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ОТКРЫТАЯ</text>
<text x="678" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Учти вход и выход</text>
<text x="943" y="365" font-family="Arial,sans-serif" font-size="28" fill="#f1f7f2" text-anchor="start">→</text>
<rect x="970" y="195" width="275" height="295" rx="18" fill="#e6f4ef"/>
<text x="988" y="244" font-family="Arial,sans-serif" font-size="20" fill="#143242" text-anchor="start">ТОЧНОСТЬ</text>
<text x="988" y="310" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">Измерение не</text>
<text x="988" y="345" font-family="Arial,sans-serif" font-size="24" fill="#143242" text-anchor="start">идеально</text>
</svg>
