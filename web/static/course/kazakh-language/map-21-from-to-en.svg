<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="The whole route">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf7fb"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#73c8ee"/><stop offset="1" stop-color="#2f8fbd"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe497"/><stop offset="1" stop-color="#e2a63e"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#84afc8" stroke-width="1" opacity=".25"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#17364e" flood-opacity=".22"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c83236"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#paper)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/>
<g font-family="Inter,Arial,sans-serif"><text x="800" y="86" text-anchor="middle" font-size="50" font-weight="830" fill="#17364e"><tspan x="800" y="86">The whole route</tspan></text><text x="800" y="174" text-anchor="middle" font-size="25" font-weight="560" fill="#4d6d80">choose the role before the ending</text><path d="M300 470H760M840 470H1300" stroke="#c83236" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><circle cx="260" cy="470" r="138" fill="#fff" stroke="#e1a53a" stroke-width="7"/><circle cx="260" cy="470" r="92" fill="#e1a53a" opacity=".16"/><text x="260" y="455" text-anchor="middle" font-size="25" font-weight="790" fill="#17364e">start · Қайдан?</text><text x="260" y="500" text-anchor="middle" font-size="23" font-weight="650" fill="#486779">мектептен</text></g><g filter="url(#shadow)"><circle cx="800" cy="470" r="138" fill="#fff" stroke="#3998c2" stroke-width="7"/><circle cx="800" cy="470" r="92" fill="#3998c2" opacity=".16"/><text x="800" y="455" text-anchor="middle" font-size="25" font-weight="790" fill="#17364e">landmark</text><text x="800" y="500" text-anchor="middle" font-size="23" font-weight="650" fill="#486779">саябақтан кейін</text></g><g filter="url(#shadow)"><circle cx="1340" cy="470" r="138" fill="#fff" stroke="#49a468" stroke-width="7"/><circle cx="1340" cy="470" r="92" fill="#49a468" opacity=".16"/><text x="1340" y="455" text-anchor="middle" font-size="25" font-weight="790" fill="#17364e">goal · Қайда?</text><text x="1340" y="500" text-anchor="middle" font-size="23" font-weight="650" fill="#486779">кітапханаға дейін</text></g>
<g transform="translate(356 792)" filter="url(#shadow)"><rect width="888" height="64" rx="19" fill="#17364e"/><text x="444" y="42" text-anchor="middle" font-size="25" font-weight="760" fill="#fff">КӨР → ТЫҢДА → АЙТ → ҚОЛДАН → ТЕКСЕР</text></g></g></svg>