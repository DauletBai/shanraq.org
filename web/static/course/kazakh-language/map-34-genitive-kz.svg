<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ілік септік — екіжақты көпір"><defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf7eb"/><stop offset=".55" stop-color="#f3faf9"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd26d"/><stop offset="1" stop-color="#d78b22"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69c4e6"/><stop offset="1" stop-color="#197da8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79d398"/><stop offset="1" stop-color="#238050"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#709aac" stroke-opacity=".16" stroke-width="1.5"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#17364e" flood-opacity=".25"/></filter>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c9343a"/></marker>
    </defs><rect width="1600" height="900" rx="34" fill="url(#paper)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/><g font-family="Inter,Arial,sans-serif"><text x="800" y="70" text-anchor="middle" font-size="47" font-weight="870" fill="#17364e"><tspan x="800" dy="0">Ілік септік — екіжақты көпір</tspan></text><text x="800" y="145" text-anchor="middle" font-size="24" font-weight="600" fill="#4e6c7d"><tspan x="800" dy="0">Екі атау бір байланысты көрсетеді</tspan></text><g filter="url(#shadow)"><rect x="165.0" y="407" width="390" height="116" rx="25" fill="#fff" stroke="#d69627" stroke-width="4"/><rect x="175.0" y="417" width="370" height="42" rx="14" fill="#d69627" opacity=".18"/><text x="360" y="445" text-anchor="middle" font-size="21" font-weight="850" fill="#17364e"><tspan x="360" dy="0">НЕНІҢ?</tspan></text><text x="360" y="493" text-anchor="middle" font-size="19" font-weight="620" fill="#4e6c7d"><tspan x="360" dy="0">МЕКТЕПТІҢ</tspan></text></g><g filter="url(#shadow)"><rect x="1045.0" y="407" width="390" height="116" rx="25" fill="#fff" stroke="#3d9b65" stroke-width="4"/><rect x="1055.0" y="417" width="370" height="42" rx="14" fill="#3d9b65" opacity=".18"/><text x="1240" y="445" text-anchor="middle" font-size="21" font-weight="850" fill="#17364e"><tspan x="1240" dy="0">НЕСІ?</tspan></text><text x="1240" y="493" text-anchor="middle" font-size="19" font-weight="620" fill="#4e6c7d"><tspan x="1240" dy="0">АУЛАСЫ</tspan></text></g><path d="M565 465C700 330 900 330 1035 465" fill="none" stroke="#2e9cc7" stroke-width="18" stroke-linecap="round"/><path d="M565 475C700 610 900 610 1035 475" fill="none" stroke="#2e9cc7" stroke-width="8" stroke-linecap="round"/><rect x="560" y="445" width="480" height="76" rx="18" fill="#fff" opacity=".94"/><text x="800" y="490" text-anchor="middle" font-size="32" font-weight="850" fill="#17364e"><tspan x="800" dy="0">мектептің  ═══  ауласы</tspan></text><g transform="translate(310 790)" filter="url(#shadow)"><rect width="980" height="62" rx="19" fill="#17364e"/><text x="490" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#fff"><tspan x="490" dy="0">МАҒЫНА → СҰРАҚ → ФОРМА → ТЕКСЕРУ</tspan></text></g></g></svg>