          <path d="M106 630 H490" stroke="#e4a83e" stroke-width="10" opacity=".18" stroke-linecap="round"/>
          <text x="298" y="346" text-anchor="middle" font-size="29" font-weight="800" fill="#17364e">адамдар</text>
          <text text-anchor="middle" font-size="26" font-weight="600" fill="#183b52"><tspan x="298" y="432">ы/і · Бұл кім?</tspan><tspan x="298" y="480">кімнің? · сан</tspan></text>
        </g><g filter="url(#arrowShadow)">
              <path d="M530 463 H565" stroke="#c83236" stroke-width="8" stroke-linecap="round"/>
              <path d="M556 449 L574 463 L556 477" fill="none" stroke="#c83236" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </g><g filter="url(#cardShadow)">
          <path d="M614 276 H980 Q1010 276 1010 306 V626 Q1010 654 982 654 H614 Q590 654 590 630 V300 Q590 276 614 276Z" fill="#e8f6ff" stroke="#2c91bd" stroke-width="3"/>
          <path d="M610 296 H990 V374 H610Z" rx="14" fill="#2c91bd" opacity=".14"/>
          <path d="M608 630 H992" stroke="#2c91bd" stroke-width="10" opacity=".18" stroke-linecap="round"/>
          <text x="800" y="346" text-anchor="middle" font-size="29" font-weight="800" fill="#17364e">үй</text>
          <text text-anchor="middle" font-size="26" font-weight="600" fill="#183b52"><tspan x="800" y="432">қайда?</tspan><tspan x="800" y="480">бар · жоқ · бар ма?</tspan></text>
        </g><g filter="url(#arrowShadow)">
              <path d="M1032 463 H1067" stroke="#c83236" stroke-width="8" stroke-linecap="round"/>
              <path d="M1058 449 L1076 463 L1058 477" fill="none" stroke="#c83236" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
