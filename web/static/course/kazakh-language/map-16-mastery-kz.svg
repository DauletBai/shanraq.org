          <path d="M1116 276 H1482 Q1512 276 1512 306 V626 Q1512 654 1484 654 H1116 Q1092 654 1092 630 V300 Q1092 276 1116 276Z" fill="#eaf8ed" stroke="#3e9c61" stroke-width="3"/>
          <path d="M1112 296 H1492 V374 H1112Z" rx="14" fill="#3e9c61" opacity=".14"/>
          <path d="M1110 630 H1494" stroke="#3e9c61" stroke-width="10" opacity=".18" stroke-linecap="round"/>
          <text x="1302" y="346" text-anchor="middle" font-size="29" font-weight="800" fill="#17364e">дәлел</text>
          <text text-anchor="middle" font-size="26" font-weight="600" fill="#183b52"><tspan x="1302" y="432">қазір 8/10</tspan><tspan x="1302" y="480">7 күннен кейін 7/10</tspan></text>
        </g></g>
      <g transform="translate(300 732)" filter="url(#cardShadow)">
        <rect width="1000" height="92" rx="22" fill="#17364e"/>
        <path d="M24 18 H976" stroke="#5fa4c7" stroke-width="2" opacity=".55"/>
        <text x="500" y="59" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="760" fill="#fff">КӨР → ТЫҢДА → АЙТ → ҚОЛДАН → ТЕКСЕР</text>
      </g>
    </svg>