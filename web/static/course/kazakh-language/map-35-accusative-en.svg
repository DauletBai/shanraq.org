    </defs><rect width="1600" height="900" rx="34" fill="url(#paper)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/><g font-family="Inter,Arial,sans-serif"><text x="800" y="70" text-anchor="middle" font-size="47" font-weight="870" fill="#17364e"><tspan x="800" dy="0">General activity or specific object?</tspan></text><text x="800" y="145" text-anchor="middle" font-size="24" font-weight="600" fill="#4e6c7d"><tspan x="800" dy="0">Can both speakers identify the same book?</tspan></text><g filter="url(#shadow)"><circle cx="800" cy="325" r="70" fill="url(#gold)" stroke="#fff" stroke-width="8"/><text x="800" y="336" text-anchor="middle" font-size="27" font-weight="850" fill="#17364e"><tspan x="800" dy="0">КІТАП</tspan></text></g><path d="M770 390L430 520" stroke="#2e9cc7" stroke-width="6" marker-end="url(#redArrow)"/><path d="M830 390L1170 520" stroke="#c9343a" stroke-width="6" marker-end="url(#redArrow)"/><g filter="url(#shadow)"><rect x="150.0" y="527" width="480" height="116" rx="25" fill="#fff" stroke="#2e9cc7" stroke-width="4"/><rect x="160.0" y="537" width="460" height="42" rx="14" fill="#2e9cc7" opacity=".18"/><text x="390" y="565" text-anchor="middle" font-size="21" font-weight="850" fill="#17364e"><tspan x="390" dy="0">GENERAL</tspan></text><text x="390" y="613" text-anchor="middle" font-size="19" font-weight="620" fill="#4e6c7d"><tspan x="390" dy="0">кітап оқимын</tspan></text></g><g filter="url(#shadow)"><rect x="970.0" y="527" width="480" height="116" rx="25" fill="#fff" stroke="#c9343a" stroke-width="4"/><rect x="980.0" y="537" width="460" height="42" rx="14" fill="#c9343a" opacity=".18"/><text x="1210" y="565" text-anchor="middle" font-size="21" font-weight="850" fill="#17364e"><tspan x="1210" dy="0">SPECIFIC</tspan></text><text x="1210" y="613" text-anchor="middle" font-size="19" font-weight="620" fill="#4e6c7d"><tspan x="1210" dy="0">бұл кітапты оқимын</tspan></text></g><g transform="translate(310 790)" filter="url(#shadow)"><rect width="980" height="62" rx="19" fill="#17364e"/><text x="490" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#fff"><tspan x="490" dy="0">МАҒЫНА → СҰРАҚ → ФОРМА → ТЕКСЕРУ</tspan></text></g></g></svg>