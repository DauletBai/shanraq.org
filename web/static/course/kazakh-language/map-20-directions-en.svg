<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A spoken route">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf7fb"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#73c8ee"/><stop offset="1" stop-color="#2f8fbd"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe497"/><stop offset="1" stop-color="#e2a63e"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#84afc8" stroke-width="1" opacity=".25"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#17364e" flood-opacity=".22"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c83236"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#paper)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/>
<g font-family="Inter,Arial,sans-serif"><text x="800" y="86" text-anchor="middle" font-size="50" font-weight="830" fill="#17364e"><tspan x="800" y="86">A spoken route</tspan></text><text x="800" y="174" text-anchor="middle" font-size="25" font-weight="560" fill="#4d6d80">every arrow matches its instruction</text><g filter="url(#shadow)"><rect x="150" y="270" width="1300" height="410" rx="30" fill="#fff" stroke="#63a7c8" stroke-width="3"/>
        <path d="M270 620V420H1050V300" fill="none" stroke="#c83236" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
        <circle cx="270" cy="620" r="28" fill="#e1a53a"/><circle cx="1050" cy="300" r="28" fill="#49a468"/></g><g filter="url(#shadow)"><rect x="285" y="546" width="320" height="88" rx="18" fill="#fff" stroke="#3998c2" stroke-width="3"/><text x="445" y="585" text-anchor="middle" font-size="23" font-weight="780" fill="#17364e">1</text><text x="445" y="617" text-anchor="middle" font-size="21" font-weight="620" fill="#486779">Тура жүріңіз</text></g><g filter="url(#shadow)"><rect x="490" y="321" width="320" height="88" rx="18" fill="#fff" stroke="#3998c2" stroke-width="3"/><text x="650" y="360" text-anchor="middle" font-size="23" font-weight="780" fill="#17364e">2</text><text x="650" y="392" text-anchor="middle" font-size="21" font-weight="620" fill="#486779">Оңға бұрылыңыз</text></g><g filter="url(#shadow)"><rect x="1080" y="306" width="320" height="88" rx="18" fill="#fff" stroke="#3998c2" stroke-width="3"/><text x="1240" y="345" text-anchor="middle" font-size="23" font-weight="780" fill="#17364e">3</text><text x="1240" y="377" text-anchor="middle" font-size="21" font-weight="620" fill="#486779">Солға бұрылыңыз</text></g>
<g transform="translate(356 792)" filter="url(#shadow)"><rect width="888" height="64" rx="19" fill="#17364e"/><text x="444" y="42" text-anchor="middle" font-size="25" font-weight="760" fill="#fff">КӨР → ТЫҢДА → АЙТ → ҚОЛДАН → ТЕКСЕР</text></g></g></svg>