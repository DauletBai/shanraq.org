<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Locative fixes a coordinate"><defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf7eb"/><stop offset=".55" stop-color="#f3faf9"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd26d"/><stop offset="1" stop-color="#d78b22"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69c4e6"/><stop offset="1" stop-color="#197da8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79d398"/><stop offset="1" stop-color="#238050"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#709aac" stroke-opacity=".16" stroke-width="1.5"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#17364e" flood-opacity=".25"/></filter>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c9343a"/></marker>
    </defs><rect width="1600" height="900" rx="34" fill="url(#paper)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/><g font-family="Inter,Arial,sans-serif"><text x="800" y="70" text-anchor="middle" font-size="47" font-weight="870" fill="#17364e"><tspan x="800" dy="0">Locative fixes a coordinate</tspan></text><text x="800" y="145" text-anchor="middle" font-size="24" font-weight="600" fill="#4e6c7d"><tspan x="800" dy="0">Movement has stopped: where or when?</tspan></text><g filter="url(#shadow)"><rect x="120" y="275" width="1360" height="400" rx="28" fill="#fff" stroke="#6ba6bf" stroke-width="4"/><path d="M160 610H1440M240 650V310" stroke="#17364e" stroke-width="5"/><path d="M240 485H1440" stroke="#8fb7c8" stroke-width="3" stroke-dasharray="14 12"/></g><g filter="url(#shadow)"><rect x="135.0" y="442" width="350" height="116" rx="25" fill="#fff" stroke="#d69627" stroke-width="4"/><rect x="145.0" y="452" width="330" height="42" rx="14" fill="#d69627" opacity=".18"/><text x="310" y="480" text-anchor="middle" font-size="21" font-weight="850" fill="#17364e"><tspan x="310" dy="0">PLACE</tspan></text><text x="310" y="528" text-anchor="middle" font-size="19" font-weight="620" fill="#4e6c7d"><tspan x="310" dy="0">кітапханада</tspan></text></g><g filter="url(#shadow)"><rect x="625.0" y="442" width="350" height="116" rx="25" fill="#fff" stroke="#2e9cc7" stroke-width="4"/><rect x="635.0" y="452" width="330" height="42" rx="14" fill="#2e9cc7" opacity=".18"/><text x="800" y="480" text-anchor="middle" font-size="21" font-weight="850" fill="#17364e"><tspan x="800" dy="0">DAY</tspan></text><text x="800" y="528" text-anchor="middle" font-size="19" font-weight="620" fill="#4e6c7d"><tspan x="800" dy="0">сәрсенбіде</tspan></text></g><g filter="url(#shadow)"><rect x="1115.0" y="442" width="350" height="116" rx="25" fill="#fff" stroke="#3d9b65" stroke-width="4"/><rect x="1125.0" y="452" width="330" height="42" rx="14" fill="#3d9b65" opacity=".18"/><text x="1290" y="480" text-anchor="middle" font-size="21" font-weight="850" fill="#17364e"><tspan x="1290" dy="0">HOUR</tspan></text><text x="1290" y="528" text-anchor="middle" font-size="19" font-weight="620" fill="#4e6c7d"><tspan x="1290" dy="0">сағат онда</tspan></text></g><g transform="translate(310 790)" filter="url(#shadow)"><rect width="980" height="62" rx="19" fill="#17364e"/><text x="490" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#fff"><tspan x="490" dy="0">МАҒЫНА → СҰРАҚ → ФОРМА → ТЕКСЕРУ</tspan></text></g></g></svg>