<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ошибка становится исправимой, когда она точна">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8ef"/><stop offset="1" stop-color="#edf7f8"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7ba6b8" stroke-opacity=".16" stroke-width="1.5"/></pattern>
 <filter id="cardShadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#17364e" flood-opacity=".24"/></filter>
 <filter id="barShadow" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#17364e" flood-opacity=".23"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c7353a"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#paper)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/>
<g font-family="Inter,Arial,sans-serif"><text x="800" y="58" text-anchor="middle" font-size="48" font-weight="870" fill="#17364e"><tspan x="800" dy="0">Ошибка становится исправимой, когда она</tspan><tspan x="800" dy="52">точна</tspan></text><text x="800" y="166" text-anchor="middle" font-size="24" font-weight="580" fill="#4f6f80"><tspan x="800" dy="0">Сравните одно поле и попросите следующий шаг</tspan></text>
<g transform="translate(75 292)" filter="url(#cardShadow)">
          <path d="M26 0H414L460 46V352A28 28 0 0 1 432 380H28A28 28 0 0 1 0 352V28A28 28 0 0 1 28 0Z" fill="#fff" stroke="#e2a13b" stroke-width="4"/>
          <path d="M414 0V46H460" fill="none" stroke="#e2a13b" stroke-width="4"/>
          <rect x="24" y="24" width="190" height="58" rx="16" fill="#e2a13b"/>
          <text x="119" y="62" text-anchor="middle" font-size="19" font-weight="850" fill="#fff"><tspan x="119" dy="0">ГДЕ?</tspan></text>
          <circle cx="230" cy="151" r="48" fill="#e2a13b" opacity=".17"/>
          <circle cx="230" cy="151" r="34" fill="none" stroke="#e2a13b" stroke-width="6"/>
          <text x="230" y="242" text-anchor="middle" font-size="27" font-weight="850" fill="#17364e"><tspan x="230" dy="0">тегім</tspan></text>
          <text x="230" y="307" text-anchor="middle" font-size="22" font-weight="620" fill="#4f6f80"><tspan x="230" dy="0">поле «фамилия»</tspan></text>
        </g><g transform="translate(585 292)" filter="url(#cardShadow)">
          <path d="M26 0H414L460 46V352A28 28 0 0 1 432 380H28A28 28 0 0 1 0 352V28A28 28 0 0 1 28 0Z" fill="#fff" stroke="#35a0c8" stroke-width="4"/>
          <path d="M414 0V46H460" fill="none" stroke="#35a0c8" stroke-width="4"/>
          <rect x="24" y="24" width="190" height="58" rx="16" fill="#35a0c8"/>
          <text x="119" y="62" text-anchor="middle" font-size="19" font-weight="850" fill="#fff"><tspan x="119" dy="0">ЧТО НЕ ТАК?</tspan></text>
          <circle cx="230" cy="151" r="48" fill="#35a0c8" opacity=".17"/>
          <circle cx="230" cy="151" r="34" fill="none" stroke="#35a0c8" stroke-width="6"/>
          <text x="230" y="242" text-anchor="middle" font-size="27" font-weight="850" fill="#17364e"><tspan x="230" dy="0">дұрыс жазылмаған</tspan></text>
          <text x="230" y="307" text-anchor="middle" font-size="22" font-weight="620" fill="#4f6f80"><tspan x="230" dy="0">написано неверно</tspan></text>
        </g><g transform="translate(1095 292)" filter="url(#cardShadow)">
          <path d="M26 0H414L460 46V352A28 28 0 0 1 432 380H28A28 28 0 0 1 0 352V28A28 28 0 0 1 28 0Z" fill="#fff" stroke="#48a36b" stroke-width="4"/>
          <path d="M414 0V46H460" fill="none" stroke="#48a36b" stroke-width="4"/>
          <rect x="24" y="24" width="190" height="58" rx="16" fill="#48a36b"/>
          <text x="119" y="62" text-anchor="middle" font-size="19" font-weight="850" fill="#fff"><tspan x="119" dy="0">ЧТО ДЕЛАТЬ?</tspan></text>
          <circle cx="230" cy="151" r="48" fill="#48a36b" opacity=".17"/>
          <circle cx="230" cy="151" r="34" fill="none" stroke="#48a36b" stroke-width="6"/>
          <text x="230" y="242" text-anchor="middle" font-size="27" font-weight="850" fill="#17364e"><tspan x="230" dy="0">түзетуге бола ма?</tspan></text>
          <text x="230" y="307" text-anchor="middle" font-size="22" font-weight="620" fill="#4f6f80"><tspan x="230" dy="0">можно исправить?</tspan></text>
        </g><path d="M540 482H568" stroke="#c7353a" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1050 482H1078" stroke="#c7353a" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
<g transform="translate(284 774)" filter="url(#barShadow)"><rect width="1032" height="70" rx="20" fill="#17364e"/><text x="516" y="45" text-anchor="middle" font-size="25" font-weight="800" fill="#fff"><tspan x="516" dy="0">КӨР → ТЫҢДА → АЙТ → ҚОЛДАН → ТЕКСЕР</tspan></text></g>
</g></svg>