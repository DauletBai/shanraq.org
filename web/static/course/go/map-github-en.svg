ss="mono" x="0.00" y="-99.00">git remote add origin … · git push -u origin main</text><text class="cap" x="0.00" y="408.00">THIS IS NOT A BACKUP — IT IS WORK PEOPLE CAN SEE</text><text class="mono" x="0.00" y="435.00">README.md — the first thing a person reads</text><g transform="translate(0,152.00) scale(1.250) translate(-0.00,-124.45)"><polygon class="band-res" points="-144.80,51.30 144.80,51.30 144.80,93.10 -144.80,93.10"/><polygon class="arw-res" points="-89.23,71.44 -103.00,64.60 -103.00,78.28"/><polygon class="arw-res" points="9.50,71.44 -4.28,64.60 -4.28,78.28"/><polygon class="arw-res" points="108.23,71.44 94.45,64.60 94.45,78.28"/><polygon class="band-req" points="-144.80,117.80 144.80,117.80 144.80,159.60 -144.80,159.60"/><polygon class="arw-req" points="-108.23,137.94 -94.45,131.10 -94.45,144.78"/><polygon class="arw-req" points="-9.50,137.94 4.28,131.10 4.28,144.78"/><polygon class="arw-req" points="89.23,137.94 103.00,131.10 103.00,144.78"/><polygon class="gt" points="-276.44,41.80 -181.00,96.90 -276.44,152.00 -371.87,96.90"/><polygon class="gr" points="-371.87,152.00 -276.44,207.10 -276.44,152.00 -371.87,96.90"/><polygon class="gl" points="-181.00,152.00 -276.44,207.10 -276.44,152.00 -181.00,96.90"/><text class="lbl-acc" x="-276.44" y="94.90">your computer</text><text class="sub-acc" x="-276.44" y="107.90">the .git folder</text><polygon class="t" points="276.44,41.80 371.87,96.90 276.44,152.00 181.00,96.90"/><polygon class="r" points="181.00,152.00 276.44,207.10 276.44,152.00 181.00,96.90"/><polygon class="l" points="371.87,152.00 276.44,207.10 276.44,152.00 371.87,96.90"/><text class="lbl" x="276.44" y="94.90">GitHub</text><text class="sub" x="276.44" y="107.90">the network copy</text><text class="mono" x="0.00" y="48.64">git push</text><text class="mono" x="0.00" y="117.04">git pull</text></g></svg>