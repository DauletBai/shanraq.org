<svg xmlns="http://www.w3.org/2000/svg" viewBox="-440.9 -23.1 888.4 330.4" width="888" height="330" role="img" aria-label="Екі қадам: git add таңдайды, git commit жазып қояды"><style>
:root{
  --ink:#3a3a3a; --soft:#5c5c5c; --line:#d6d3ce;
  --top:#ded8cd; --lft:#bcb6aa; --rgt:#9d978d;
  --red:#d32f2f; --red-d:#a92525; --red-l:#d9564f;
  --grn:#2e7d32; --grn-d:#24632a; --grn-l:#4e8f52;
