.sub-acc{fill:var(--tagink);opacity:.8;font-size:11px;text-anchor:middle}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:var(--soft);text-anchor:middle}
