<svg xmlns="http://www.w3.org/2000/svg" viewBox="-608 -190 1216 684" width="1216" height="684" role="img" aria-label="Six familiar parts come together into one program"><style>
:root{
  --ink:#3a3a3a; --soft:#5c5c5c; --line:#d6d3ce;
  --top:#ded8cd; --lft:#bcb6aa; --rgt:#9d978d;
  --red:#d32f2f; --red-d:#a92525; --red-l:#d9564f;
  --grn:#2e7d32; --grn-d:#24632a; --grn-l:#4e8f52;
  --tagink:#ffffff;
}
@media (prefers-color-scheme: dark){
