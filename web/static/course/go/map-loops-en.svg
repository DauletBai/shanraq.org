 x="0.00" y="-99.00">the only loop in Go is for</text><text class="cap" x="0.00" y="408.00">GO HAS NONE OF THESE</text><text class="mono" x="0.00" y="435.00">while · do-while · foreach</text><g transform="translate(0,152.00) scale(1.250) translate(-0.00,-130.15)"><polygon class="t" points="-329.09,47.50 -223.78,108.30 -329.09,169.10 -434.40,108.30"/><polygon class="r" points="-434.40,152.00 -329.09,212.80 -329.09,169.10 -434.40,108.30"/><polygon class="l" points="-223.78,152.00 -329.09,212.80 -329.09,169.10 -223.78,108.30"/><text class="lbl" x="-329.09" y="106.30">COUNTER</text><text class="sub" x="-329.09" y="119.30">for i := 1; i &lt;= 3; i++</text><polygon class="t" points="0.00,47.50 105.31,108.30 0.00,169.10 -105.31,108.30"/><polygon class="r" points="-105.31,152.00 0.00,212.80 0.00,169.10 -105.31,108.30"/><polygon class="l" points="105.31,152.00 0.00,212.80 0.00,169.10 105.31,108.30"/><text class="lbl" x="0.00" y="106.30">CONDITION</text><text class="sub" x="0.00" y="119.30">for words &lt; 600</text><polygon class="t" points="329.09,47.50 434.40,108.30 329.09,169.10 223.78,108.30"/><polygon class="r" points="223.78,152.00 329.09,212.80 329.09,169.10 223.78,108.30"/><polygon class="l" points="434.40,152.00 329.09,212.80 329.09,169.10 434.40,108.30"/><text class="lbl" x="329.09" y="106.30">ENDLESS</text><text class="sub" x="329.09" y="119.30">for { … break }</text><polygon class="band-flow" points="-217.20,112.01 -111.89,112.01 -111.89,143.93 -217.20,143.93"/><polygon class="band-flow" points="111.89,112.01 217.20,112.01 217.20,143.93 111.89,143.93"/></g></svg>