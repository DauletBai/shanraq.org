"mono" x="0.00" y="-99.00">template.Must(template.ParseFS(files, …))</text><text class="cap" x="0.00" y="408.00">ЧУЖОЙ ТЕКСТ ОБЕЗВРЕЖИВАЕТСЯ САМ</text><text class="mono" x="0.00" y="435.00">«&lt;script&gt;» на странице останется текстом, а не кодом</text><g transform="translate(0,152.00) scale(1.250) translate(23.04,-132.05)"><polygon class="band-flow" points="-157.96,28.50 65.82,28.50 65.82,66.50 -157.96,66.50"/><polygon class="arw-flow" points="-115.55,46.74 -129.33,39.90 -129.33,53.58"/><polygon class="arw-flow" points="-49.74,46.74 -63.51,39.90 -63.51,53.58"/><polygon class="arw-flow" points="16.08,46.74 2.31,39.90 2.31,53.58"/><polygon class="band-res" points="-157.96,195.70 65.82,195.70 65.82,233.70 -157.96,233.70"/><polygon class="arw-res" points="-115.55,213.94 -129.33,207.10 -129.33,220.78"/><polygon class="arw-res" points="-49.74,213.94 -63.51,207.10 -63.51,220.78"/><polygon class="arw-res" points="16.08,213.94 2.31,207.10 2.31,220.78"/><polygon class="t" points="-263.27,-20.90 -177.71,28.50 -263.27,77.90 -348.84,28.50"/><polygon class="r" points="-348.84,68.40 -263.27,117.80 -263.27,77.90 -348.84,28.50"/><polygon class="l" points="-177.71,68.40 -263.27,117.80 -263.27,77.90 -177.71,28.50"/><text class="lbl" x="-263.27" y="26.50">шаблон</text><text class="sub" x="-263.27" y="39.50">{{ .Title }}</text><polygon class="gt" points="-263.27,146.30 -177.71,195.70 -263.27,245.10 -348.84,195.70"/><polygon class="gr" points="-348.84,235.60 -263.27,285.00 -263.27,245.10 -348.84,195.70"/><polygon class="gl" points="-177.71,235.60 -263.27,285.00 -263.27,245.10 -177.71,195.70"/><text class="lbl-acc" x="-263.27" y="193.70">данные</text><text class="sub-acc" x="-263.27" y="206.70">[]Article</text><polygon class="gt" points="204.04,43.70 302.76,100.70 204.04,157.70 105.31,100.70"/><polygon class="gr" points="105.31,152.00 204.04,209.00 204.04,157.70 105.31,100.70"/><polygon class="gl" points="302.76,152.00 204.04,209.00 204.04,157.70 302.76,100.70"/><text class="lbl-acc" x