o" x="0.00" y="-99.00">func (a Article)   ·   func (a *Article)</text><text class="cap" x="0.00" y="408.00">МЕНЯЕТ — УКАЗАТЕЛЬ, ТОЛЬКО ЧИТАЕТ — ЗНАЧЕНИЕ</text><text class="mono" x="0.00" y="435.00">for i := range blog { blog[i].Publish() }</text><g transform="translate(0,152.00) scale(1.250) translate(-26.33,-87.02)"><polygon class="band-flow" points="-157.96,10.26 289.60,10.26 289.60,54.34 -157.96,54.34"/><polygon class="arw-flow" points="-82.65,31.54 -96.42,24.70 -96.42,38.38"/><polygon class="arw-flow" points="35.83,31.54 22.05,24.70 22.05,38.38"/><polygon class="arw-flow" points="154.30,31.54 140.52,24.70 140.52,38.38"/><polygon class="band-res" points="-157.96,116.66 289.60,116.66 289.60,160.74 -157.96,160.74"/><polygon class="arw-res" points="-88.48,137.94 -74.71,131.10 -74.71,144.78"/><polygon class="arw-res" points="29.99,137.94 43.77,131.10 43.77,144.78"/><polygon class="arw-res" points="148.46,137.94 162.24,131.10 162.24,144.78"/><polygon class="gt" points="-283.02,0.00 -187.58,55.10 -283.02,110.20 -378.45,55.10"/><polygon class="gr" points="-378.45,115.90 -283.02,171.00 -283.02,110.20 -378.45,55.10"/><polygon class="gl" points="-187.58,115.90 -283.02,171.00 -283.02,110.20 -187.58,55.10"/><text class="lbl-acc" x="-283.02" y="89.20">Article</text><text class="sub-acc" x="-283.02" y="102.20">значение в памяти</text><polygon class="t" points="368.58,-14.06 431.11,22.04 368.58,58.14 306.05,22.04"/><polygon class="r" points="306.05,38.00 368.58,74.10 368.58,58.14 306.05,22.04"/><polygon class="l" points="431.11,38.00 368.58,74.10 368.58,58.14 431.11,22.04"/><text class="lbl" x="368.58" y="26.04">копия</text><polygon class="rt" points="368.58,99.94 431.11,136.04 368.58,172.14 306.05,136.04"/><polygon class="rr" points="306.05,152.00 368.58,188.10 368.58,172.14 306.05,136.04"/><polygon class="rl" points="431.11,152.00 368.58,188.10 368.58,172.14 431.11,136.04"/><text class="tag" x="368.58" y="140.04">&amp;a</text><text class="sub" x="65.82" y="10.64">правка остаё