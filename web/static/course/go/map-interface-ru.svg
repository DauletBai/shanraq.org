<svg xmlns="http://www.w3.org/2000/svg" viewBox="-440.9 -36.4 888.4 347.5" width="888" height="348" role="img" aria-label="Одна функция, любое хранилище: договор — это список умений"><style>
:root{
  --ink:#3a3a3a; --soft:#5c5c5c; --line:#d6d3ce;
