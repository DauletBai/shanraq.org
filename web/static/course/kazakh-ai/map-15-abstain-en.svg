<text x="80" y="469.0" text-anchor="middle" font-size="22" font-weight="800" fill="var(--red)">2</text>
<text x="410" y="453.0" text-anchor="middle" font-size="23" font-weight="700">Lookup key ⇒ facts (from lesson 16), not</text>
