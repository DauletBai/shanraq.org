<text x="410" y="384.0" text-anchor="middle" font-size="23" font-weight="700">іске қосу ортасы; 200 шақыру</text>
<path d="M380 432.0 V468.0" stroke="var(--green)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
