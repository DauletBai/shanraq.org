<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Почему карандаш в воде кажется сломанным? Свет на границе сред</title><desc id="desc">Воздух: 45°; Граница: y = 4; Вода: ≈32°; Частота та же</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d4e8ed"/></pattern><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#37657b" flood-opacity=".2"/></filter></defs>
<rect width="1600" height="900" fill="#f2f9fb"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="70" y="195" width="875" height="590" rx="16" fill="url(#paper)" stroke="#99bac8" stroke-width="3" filter="url(#shadow)"/>
<rect x="975" y="195" width="555" height="590" rx="16" fill="#fff" stroke="#99bac8" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="76" text-anchor="start" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#16445e">Почему карандаш в воде кажется сломанным? Свет на</text>
<text x="75" y="126" text-anchor="start" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#16445e">границе сред</text>
<rect x="170" y="500" width="695" height="230" fill="#cce8f2" opacity=".8"/>
<path d="M170 500H865" fill="none" stroke="#5e9bb1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M500 260V735" fill="none" stroke="#91b9c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/>
<path d="M320 320L500 500L650 750" fill="none" stroke="#d98857" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="392" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#16445e">45°</text>
<text x="582" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#16445e">≈32°</text>
<rect x="1005" y="220" width="495" height="110" rx="10" fill="#e6f5fa" stroke="#d0e2e8" stroke-width="2"/>
<text x="1027" y="266" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#16445e">Воздух: 45°</text>
<rect x="1005" y="358" width="495" height="110" rx="10" fill="#fff0e4" stroke="#d0e2e8" stroke-width="2"/>
<text x="1027" y="404" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#16445e">Граница: y = 4</text>
<rect x="1005" y="496" width="495" height="110" rx="10" fill="#eaf4e9" stroke="#d0e2e8" stroke-width="2"/>
<text x="1027" y="542" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#16445e">Вода: ≈32°</text>
<rect x="1005" y="634" width="495" height="110" rx="10" fill="#edf0fa" stroke="#d0e2e8" stroke-width="2"/>
<text x="1027" y="680" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#16445e">Частота та же</text>
</svg>
