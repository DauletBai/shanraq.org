<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How does the Sun warm us across space?</title>
<desc id="desc">Source: the Sun | Between us: even vacuum | Transfer: radiation | Shade reduces incoming flow</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cfebf0"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#375b74" flood-opacity=".2"/></filter><linearGradient id="card" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e0eef3"/></linearGradient></defs>
<rect width="1600" height="900" fill="#eef8f8"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="75" y="200" width="900" height="550" rx="24" fill="url(#card)" stroke="#9bbecb" stroke-width="3" filter="url(#shadow)"/>
<rect x="1015" y="200" width="510" height="550" rx="24" fill="#fff" stroke="#9bbecb" stroke-width="3" filter="url(#shadow)"/>
<text x="76" y="72" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="34" fill="#173d58">How does the Sun warm us across</text>
<text x="76" y="120" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="34" fill="#173d58">space?</text>
<rect x="1044" y="235" width="450" height="94" rx="14" fill="#e4f5fa" stroke="#d3e4e9"/>
<text x="1064" y="272" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#173d58">Source: the Sun</text>
<rect x="1044" y="357" width="450" height="94" rx="14" fill="#fff0df" stroke="#d3e4e9"/>
<text x="1064" y="394" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#173d58">Between us: even vacuum</text>
<rect x="1044" y="479" width="450" height="94" rx="14" fill="#e9f5ee" stroke="#d3e4e9"/>
<text x="1064" y="516" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#173d58">Transfer: radiation</text>
<rect x="1044" y="601" width="450" height="94" rx="14" fill="#e9edfa" stroke="#d3e4e9"/>
<text x="1064" y="638" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#173d58">Shade reduces incoming</text>
<text x="1064" y="670" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#173d58">flow</text>
<circle cx="315" cy="418" r="84" fill="#ffd36b" stroke="#e9a246" stroke-width="8"/>
<path d="M485 355l315-75 M487 415h300 M485 475l315 75" fill="none" stroke="#f1b351" stroke-width="11" stroke-linecap="round"/>
<path d="M720 300v280" stroke="#607e94" stroke-width="17"/>
<rect x="775" y="500" width="90" height="60" rx="9" fill="#9ccadb" stroke="#4a8599" stroke-width="5"/>
<text x="525" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#315b72">Radiation needs no air flow</text>
