<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Why can square centimetres change an answer ten thousandfold?</title>
<desc id="desc">1 m² = 10,000 cm² | 2 cm² = 0.0002 m² | F = 4 N | p = 20,000 Pa = 20 kPa</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d3e8ef" stroke-width="1"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#31516c" flood-opacity=".20"/></filter><linearGradient id="water" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b3edf8"/><stop offset="1" stop-color="#168bbd"/></linearGradient><linearGradient id="plate" x1="0" x2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#d7e9f0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#edf6f8"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="65" y="188" width="915" height="565" rx="22" fill="url(#plate)" stroke="#9fbfcb" stroke-width="3" filter="url(#shadow)"/>
<rect x="1015" y="188" width="520" height="565" rx="22" fill="#ffffff" stroke="#a5c5d0" stroke-width="3" filter="url(#shadow)"/>
<text x="80" y="80" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="750" fill="#143e5a">Why can square centimetres change an answer ten</text>
<text x="80" y="136" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="750" fill="#143e5a">thousandfold?</text>
<rect x="1045" y="240" width="460" height="84" rx="12" fill="#e9f6fc" stroke="#d0e2e8"/>
<text x="1070" y="274" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">1 m² = 10,000 cm²</text>
<rect x="1045" y="352" width="460" height="84" rx="12" fill="#edf8f4" stroke="#d0e2e8"/>
<text x="1070" y="386" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">2 cm² = 0.0002 m²</text>
<rect x="1045" y="464" width="460" height="84" rx="12" fill="#fff4e7" stroke="#d0e2e8"/>
<text x="1070" y="498" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">F = 4 N</text>
<rect x="1045" y="576" width="460" height="84" rx="12" fill="#e9f0fa" stroke="#d0e2e8"/>
<text x="1070" y="610" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">p = 20,000 Pa = 20 kPa</text>
<rect x="220" y="540" width="600" height="22" rx="5" fill="#637f8b"/>
<rect x="275" y="415" width="160" height="125" rx="8" fill="#d58559" stroke="#9f4e37" stroke-width="4"/>
<rect x="575" y="415" width="230" height="125" rx="8" fill="#d58559" stroke="#9f4e37" stroke-width="4"/>
<path d="M355 355v53m-15-18 15 18 15-18 M690 355v53m-15-18 15 18 15-18" fill="none" stroke="#267ba5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="355" y="610" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#203e57">2 cm² = 0.0002 m²</text>
<text x="690" y="655" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600" fill="#203e57">F = 4 N</text>
</svg>
