<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Как энергия ядра становится электричеством в розетке?</title><desc id="desc">Собираем всю цепочку преобразований и проверяем, где заканчивается наша модель.</desc>
