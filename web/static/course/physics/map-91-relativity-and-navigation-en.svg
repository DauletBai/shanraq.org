<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Why can a satellite clock not simply copy time on Earth?</title><desc id="desc">Add two measured GPS corrections and learn the limits of the classroom model.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#daeaf0"/></pattern><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f4f7"/></linearGradient><radialGradient id="nucleus"><stop stop-color="#fff5e7"/><stop offset="1" stop-color="#dc9b84"/></radialGradient><radialGradient id="cloud"><stop stop-color="#c6e6f3" stop-opacity=".9"/><stop offset="1" stop-color="#c6e6f3" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#315b74" flood-opacity=".16"/></filter></defs>
<rect width="1600" height="900" fill="#f3f9fb"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="70" y="190" width="875" height="590" rx="13" fill="url(#paper)" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<rect x="975" y="190" width="555" height="590" rx="13" fill="#fff" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#153d59">Support map: modern physics</text>
<path d="M215 675H810 M300 290V690" fill="none" stroke="#718fa2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="714" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#153d59">0</text>
<rect x="230" y="340" width="70" height="55" rx="6" fill="#dc9577"/>
<text x="206" y="377" text-anchor="end" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#153d59">-7</text>
<rect x="300" y="470" width="450" height="55" rx="6" fill="#70afc9"/>
<text x="774" y="507" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#153d59">+45</text>
<rect x="300" y="600" width="380" height="55" rx="6" fill="#88c6af"/>
<text x="704" y="637" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#153d59">+38</text>
<text x="545" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#153d59">−7 + 45 = +38</text>
<rect x="1005" y="235" width="495" height="125" rx="13" fill="#e6f5fa" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="1025" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153d59">Motion: −7 µs/day</text>
<rect x="1005" y="400" width="495" height="125" rx="13" fill="#fff0e4" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="1025" y="461" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153d59">Gravity: +45 µs/day</text>
<rect x="1005" y="565" width="495" height="125" rx="13" fill="#eaf4e9" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="1025" y="626" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153d59">Net: +38 µs/day</text>
</svg>
