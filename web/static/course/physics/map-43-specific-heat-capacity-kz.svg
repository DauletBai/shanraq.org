<text x="1064" y="394" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#173d58">c = 4200 Дж/(кг·°C)</text>
<rect x="1044" y="479" width="450" height="94" rx="14" fill="#e9f5ee" stroke="#d3e4e9"/>
<text x="1064" y="516" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="28" fill="#173d58">ΔT = 25 − 20 = 5 °C</text>
