<text x="76" y="72" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="34" fill="#173d58">Неге аз су көп суға қарағанда</text>
<text x="76" y="120" text-anchor="start" font-family="Arial,sans-serif" font-weight="650" font-size="34" fill="#173d58">тезірек жылиды?</text>
