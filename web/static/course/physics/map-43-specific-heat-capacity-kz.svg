<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Неге аз су көп суға қарағанда тезірек жылиды?</title>
<desc id="desc">Су: m = 0,2 кг | c = 4200 Дж/(кг·°C) | ΔT = 25 − 20 = 5 °C | Q = 4200 Дж</desc>
