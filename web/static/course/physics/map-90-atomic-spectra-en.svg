<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Why does a gas have its own set of coloured lines?</title><desc id="desc">Connect a spectrum to gaps between allowed atomic energies.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#daeaf0"/></pattern><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9f4f7"/></linearGradient><radialGradient id="nucleus"><stop stop-color="#fff5e7"/><stop offset="1" stop-color="#dc9b84"/></radialGradient><radialGradient id="cloud"><stop stop-color="#c6e6f3" stop-opacity=".9"/><stop offset="1" stop-color="#c6e6f3" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#315b74" flood-opacity=".16"/></filter></defs>
<rect width="1600" height="900" fill="#f3f9fb"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="70" y="190" width="875" height="590" rx="13" fill="url(#paper)" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<rect x="975" y="190" width="555" height="590" rx="13" fill="#fff" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#153d59">Support map: modern physics</text>
<path d="M260 270H745" fill="none" stroke="#5a92af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153d59">8</text>
<path d="M260 450H745" fill="none" stroke="#5a92af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153d59">5</text>
<path d="M260 630H745" fill="none" stroke="#5a92af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153d59">2</text>
<path d="M570 470V608 M558 590L570 608L582 590" fill="none" stroke="#d17d66" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="650" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#153d59">5 − 2 = 3</text>
<text x="190" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#153d59">E</text>
<rect x="1005" y="235" width="495" height="125" rx="13" fill="#e6f5fa" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="1025" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153d59">Level 3</text>
<rect x="1005" y="400" width="495" height="125" rx="13" fill="#fff0e4" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="1025" y="461" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153d59">Level 2</text>
<rect x="1005" y="565" width="495" height="125" rx="13" fill="#eaf4e9" stroke="#88aec0" stroke-width="3" filter="url(#shadow)"/>
<text x="1025" y="626" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#153d59">Photon: difference</text>
</svg>
