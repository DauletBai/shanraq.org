<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">“Saves energy”: how can we test that claim?</title><desc id="desc">Build an honest conclusion from a question, comparison, calculation and limits.</desc>
