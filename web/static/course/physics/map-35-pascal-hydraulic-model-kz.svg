<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Кішкентай поршень үлкен жүкті қалай қозғайды?</title>
<desc id="desc">Кіші: 2 см²; F₁ = 4 Н | Үлкен: 10 см²; F₂ = 20 Н | Жол: 5 см → 1 см | Жұмыс: 0,2 Дж = 0,2 Дж</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d3e8ef" stroke-width="1"/></pattern><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#31516c" flood-opacity=".20"/></filter><linearGradient id="water" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b3edf8"/><stop offset="1" stop-color="#168bbd"/></linearGradient><linearGradient id="plate" x1="0" x2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#d7e9f0"/></linearGradient></defs>
<rect width="1600" height="900" fill="#edf6f8"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="65" y="188" width="915" height="565" rx="22" fill="url(#plate)" stroke="#9fbfcb" stroke-width="3" filter="url(#shadow)"/>
<rect x="1015" y="188" width="520" height="565" rx="22" fill="#ffffff" stroke="#a5c5d0" stroke-width="3" filter="url(#shadow)"/>
<text x="80" y="80" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="750" fill="#143e5a">Кішкентай поршень үлкен жүкті қалай қозғайды?</text>
<rect x="1045" y="240" width="460" height="84" rx="12" fill="#e9f6fc" stroke="#d0e2e8"/>
<text x="1070" y="274" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">Кіші: 2 см²; F₁ = 4 Н</text>
<rect x="1045" y="352" width="460" height="84" rx="12" fill="#edf8f4" stroke="#d0e2e8"/>
<text x="1070" y="386" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">Үлкен: 10 см²; F₂ = 20 Н</text>
<rect x="1045" y="464" width="460" height="84" rx="12" fill="#fff4e7" stroke="#d0e2e8"/>
<text x="1070" y="498" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">Жол: 5 см → 1 см</text>
<rect x="1045" y="576" width="460" height="84" rx="12" fill="#e9f0fa" stroke="#d0e2e8"/>
<text x="1070" y="610" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650" fill="#1d425c">Жұмыс: 0,2 Дж = 0,2 Дж</text>
<path d="M250 570V350H450V570 M620 570V420H825V570 M350 565H720" fill="none" stroke="#527284" stroke-width="14"/>
<path d="M260 470H440V560H635V485H815V560H260Z" fill="url(#water)"/>
<path d="M255 465H445 M615 480H830" stroke="#be7652" stroke-width="22"/>
<path d="M350 330v110m-18-18 18 18 18-18 M720 370v90m-18-18 18 18 18-18" fill="none" stroke="#ca684e" stroke-width="8"/>
<text x="350" y="635" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="600" fill="#203e57">2 см²</text>
<text x="720" y="635" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="600" fill="#203e57">10 см²</text>
