<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Волна несёт возмущение, а не воду через весь лоток</title><desc id="desc">0 с: 0 см; 1 с: 2 см; 2 с: 4 см; Поплавок ≈ 2 см</desc>
