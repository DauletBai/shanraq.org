<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Why is there no eclipse at every new moon?</title><desc id="desc">Add the Moon&#x27;s tilted orbital plane to the familiar phase diagram.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9eaf0"/></pattern><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient><radialGradient id="earthSphere" cx="35%" cy="28%" r="75%"><stop stop-color="#dcf5f7"/><stop offset=".45" stop-color="#72bcd6"/><stop offset="1" stop-color="#2d719d"/></radialGradient><radialGradient id="sunSphere" cx="35%" cy="28%" r="75%"><stop stop-color="#fff7c5"/><stop offset=".5" stop-color="#fac778"/><stop offset="1" stop-color="#d77d4c"/></radialGradient><radialGradient id="moonSphere" cx="35%" cy="28%" r="75%"><stop stop-color="#fff4dc"/><stop offset=".5" stop-color="#e6c592"/><stop offset="1" stop-color="#a98c75"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#37657b" flood-opacity=".18"/></filter><filter id="sphereShadow" x="-25%" y="-25%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#23465a" flood-opacity=".22"/></filter></defs>
<rect width="1600" height="900" fill="#f2f9fb"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="70" y="190" width="875" height="590" rx="14" fill="url(#paper)" stroke="#93bac9" stroke-width="3" filter="url(#shadow)"/>
<rect x="975" y="190" width="555" height="590" rx="14" fill="#fff" stroke="#93bac9" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#123b58">Support map: test the model</text>
<path d="M250 290H820" fill="none" stroke="#df9b65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/>
<path d="M250 315L820 265" fill="none" stroke="#7eaac0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="780" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#123b58">≈5°</text>
<text x="490" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#123b58">Orbital planes</text>
<circle cx="225" cy="550" r="53" fill="url(#sunSphere)" stroke="#305e77" stroke-width="4" filter="url(#sphereShadow)"/>
<circle cx="725" cy="550" r="57" fill="url(#earthSphere)" stroke="#305e77" stroke-width="4" filter="url(#sphereShadow)"/>
<circle cx="490" cy="435" r="18" fill="url(#moonSphere)" stroke="#305e77" stroke-width="4" filter="url(#sphereShadow)"/>
<path d="M285 550H652" fill="none" stroke="#df9b65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/>
<path d="M505 435H665" fill="none" stroke="#cf8c68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 9"/>
<text x="225" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">Sun</text>
<text x="725" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">Earth</text>
<text x="490" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">Moon</text>
<text x="495" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#123b58">Shadow misses Earth</text>
<rect x="1005" y="235" width="495" height="125" rx="10" fill="#e6f5fa" stroke="#d0e2e8" stroke-width="2"/>
<text x="1025" y="293" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123b58">New + node</text>
<rect x="1005" y="400" width="495" height="125" rx="10" fill="#fff0e4" stroke="#d0e2e8" stroke-width="2"/>
<text x="1025" y="458" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123b58">Full + node</text>
<rect x="1005" y="565" width="495" height="125" rx="10" fill="#eaf4e9" stroke="#d0e2e8" stroke-width="2"/>
<text x="1025" y="623" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123b58">Tilt ≈ 5°</text>
</svg>
