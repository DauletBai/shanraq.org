<text x="970" y="525" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" fill="#9d5e35">ҚАРСЫ ЖАҚ</text>
<text x="205" y="395" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#194a70">ҚАЙТУ = 1 ТЕРБЕЛІС</text>
<text x="800" y="755" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#194a70">10 тербеліс = 11,0 с</text>
<text x="800" y="805" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="800" fill="#b95347">T = 11,0 / 10 = 1,10 с</text>
