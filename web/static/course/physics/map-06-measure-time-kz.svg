<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Уақытты және маятниктің периодын өлшейміз</title><desc id="desc">10 тербеліс = 11,0 с</desc>
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f9fdff"/><stop offset="1" stop-color="#e5f1fd"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35b9ee"/><stop offset="1" stop-color="#2868b7"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#50d7c4"/><stop offset="1" stop-color="#168d99"/></linearGradient>
 <linearGradient id="amber" x2="1" y2="1"><stop stop-color="#ffc867"/><stop offset="1" stop-color="#ed8150"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#16446c" flood-opacity=".19"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b9d2e8" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#paper)"/><rect width="1600" height="900" fill="url(#grid)"/>
<text x="800" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800" fill="#143858">УАҚЫТТЫ ЖӘНЕ МАЯТНИКТІҢ ПЕРИОДЫН ӨЛШЕЙМІЗ</text>
<text x="800" y="132" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" fill="#526e83">10 тербеліс = 11,0 с</text>

<g filter="url(#shadow)"><rect x="150" y="185" width="1300" height="650" rx="26" fill="#fff"/></g>
<circle cx="800" cy="265" r="13" fill="#d85754"/>
<path d="M663.2 640.9 Q800 705 936.8 640.9" fill="none" stroke="#88b8d7" stroke-width="3" stroke-dasharray="10 8"/>
<line x1="800" y1="265" x2="663.2" y2="640.9" stroke="#2787be" stroke-width="4" opacity=".7"/>
<circle cx="663.2" cy="640.9" r="25" fill="#2787be" stroke="#fff" stroke-width="3"/>
<line x1="800" y1="265" x2="800" y2="665" stroke="#52b8aa" stroke-width="4" opacity=".7"/>
<circle cx="800" cy="665" r="25" fill="#52b8aa" stroke="#fff" stroke-width="3"/>
<line x1="800" y1="265" x2="936.8" y2="640.9" stroke="#ed9a55" stroke-width="4" opacity=".7"/>
