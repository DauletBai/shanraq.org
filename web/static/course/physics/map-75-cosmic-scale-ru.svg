<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Почему Луна на рисунках почти касается Земли?</title><desc id="desc">Строим честную масштабную модель и учимся отличать размер от расстояния.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9eaf0"/></pattern><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient><radialGradient id="earthSphere" cx="35%" cy="28%" r="75%"><stop stop-color="#dcf5f7"/><stop offset=".45" stop-color="#72bcd6"/><stop offset="1" stop-color="#2d719d"/></radialGradient><radialGradient id="sunSphere" cx="35%" cy="28%" r="75%"><stop stop-color="#fff7c5"/><stop offset=".5" stop-color="#fac778"/><stop offset="1" stop-color="#d77d4c"/></radialGradient><radialGradient id="moonSphere" cx="35%" cy="28%" r="75%"><stop stop-color="#fff4dc"/><stop offset=".5" stop-color="#e6c592"/><stop offset="1" stop-color="#a98c75"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#37657b" flood-opacity=".18"/></filter><filter id="sphereShadow" x="-25%" y="-25%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#23465a" flood-opacity=".22"/></filter></defs>
<rect width="1600" height="900" fill="#f2f9fb"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="70" y="190" width="875" height="590" rx="14" fill="url(#paper)" stroke="#93bac9" stroke-width="3" filter="url(#shadow)"/>
<rect x="975" y="190" width="555" height="590" rx="14" fill="#fff" stroke="#93bac9" stroke-width="3" filter="url(#shadow)"/>
<text x="75" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#123b58">Опорная карта: проверяем модель</text>
<path d="M215 520H815" fill="none" stroke="#849fab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="215" cy="470" r="10" fill="url(#earthSphere)" stroke="#305e77" stroke-width="1"/>
<circle cx="815" cy="470" r="2.7" fill="url(#moonSphere)" stroke="#305e77" stroke-width="1"/>
<path d="M215 540H815" fill="none" stroke="#db8858" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M215 528V553 M815 528V553" fill="none" stroke="#db8858" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="515" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">30 см</text>
<text x="215" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">Земля</text>
<text x="815" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">Луна</text>
<text x="215" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">1 см</text>
<text x="815" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#123b58">0,27 см</text>
<rect x="1005" y="235" width="495" height="125" rx="10" fill="#e6f5fa" stroke="#d0e2e8" stroke-width="2"/>
<text x="1025" y="293" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123b58">Земля Ø 1 см</text>
<rect x="1005" y="400" width="495" height="125" rx="10" fill="#fff0e4" stroke="#d0e2e8" stroke-width="2"/>
<text x="1025" y="458" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123b58">Луна Ø 0,27 см</text>
<rect x="1005" y="565" width="495" height="125" rx="10" fill="#eaf4e9" stroke="#d0e2e8" stroke-width="2"/>
<text x="1025" y="623" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123b58">Центры: 30 см</text>
