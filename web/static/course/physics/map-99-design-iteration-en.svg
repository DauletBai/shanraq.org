<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How does measurement become a design decision?</title><desc id="desc">Set a limit, choose a candidate and plan a new test.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dcecf1"/></pattern><linearGradient id="barBlue" x2="1" y2=".2"><stop stop-color="#9bd1e3"/><stop offset=".55" stop-color="#65abc3"/><stop offset="1" stop-color="#3e819e"/></linearGradient><linearGradient id="barPeach" x2="1" y2=".2"><stop stop-color="#f3c4a0"/><stop offset=".55" stop-color="#db9975"/><stop offset="1" stop-color="#af6b55"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#234c62" flood-opacity=".18"/></filter></defs>
<rect width="1600" height="900" fill="#f5f9fa"/><rect width="1600" height="900" fill="url(#grid)"/>
<rect x="70" y="190" width="875" height="590" rx="15" fill="#fff" stroke="#9ebfca" stroke-width="2" filter="url(#shadow)"/>
<rect x="975" y="190" width="555" height="590" rx="15" fill="#fff" stroke="#9ebfca" stroke-width="2" filter="url(#shadow)"/>
<text x="74" y="105" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#173c57">PHYSICS · FINAL INVESTIGATION</text>
<path d="M205 490H840" fill="none" stroke="#7b9aa8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M520 365V435" fill="none" stroke="#d99371" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="520" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173c57">45 cm</text>
<path d="M625 455V525" fill="none" stroke="#cfb772" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="625" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173c57">60 cm</text>
<path d="M786 545V615" fill="none" stroke="#68acc6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="786" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173c57">83 cm</text>
<text x="525" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173c57">60 − 45 = 15 cm</text>
<rect x="1004" y="226" width="497" height="146" rx="15" fill="#e6f5fa" stroke="#9ebfca" stroke-width="2" filter="url(#shadow)"/>
<text x="1020" y="263" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#173c57">Criterion: at most 60 cm</text>
<rect x="1004" y="397" width="497" height="146" rx="15" fill="#fff1df" stroke="#9ebfca" stroke-width="2" filter="url(#shadow)"/>
<text x="1020" y="434" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#173c57">Fabric mean: 45 cm</text>
<rect x="1004" y="568" width="497" height="146" rx="15" fill="#edf6e8" stroke="#9ebfca" stroke-width="2" filter="url(#shadow)"/>
<text x="1020" y="605" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#173c57">A fresh real test is needed</text>
</svg>
