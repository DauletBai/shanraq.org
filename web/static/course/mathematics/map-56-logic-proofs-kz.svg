<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Логика және дәлелдеу: қорытынды шарттан неге шығады</title><desc id="desc">Импликацияның ақиқат кестесі және жұп сан квадратының жұп екенін дәлелдеу тізбегі</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".55" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d8effc" /></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed" /><stop offset="1" stop-color="#126aa4" /></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a" /><stop offset="1" stop-color="#e89b23" /></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58" /><stop offset="1" stop-color="#b8172c" /></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16" /></pattern><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#183c59" flood-opacity=".24" /></filter><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" /></filter><marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd" /></marker><marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d" /></marker><marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735" /></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-logic="p-&gt;q:TTT,TFF,FTT,FFT;even-square" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#shadow)"><rect x="55" y="65" width="450" height="500" rx="30" fill="#fff" stroke="#4b7c9b" stroke-width="5" /><rect x="550" y="65" width="595" height="500" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5" /></g><g font-size="28" font-weight="900" text-anchor="middle"><text x="145" y="135">p</text><text x="280" y="135">q</text><text x="415" y="135">p→q</text></g><g stroke="#7da7bc" stroke-width="3"><path d="M90 155H470M90 235H470M90 315H470M90 395H470M90 475H470M210 105V505M350 105V505" /></g><g font-size="28" font-weight="850" text-anchor="middle"><text x="145" y="210">T</text><text x="280" y="210">T</text><text x="415" y="210">T</text><text x="145" y="290">T</text><text x="280" y="290">F</text><text x="415" y="290" fill="#c92735">F</text><text x="145" y="370">F</text><text x="280" y="370">T</text><text x="415" y="370">T</text><text x="145" y="450">F</text><text x="280" y="450">F</text><text x="415" y="450">T</text></g><g filter="url(#shadow)"><rect x="615" y="110" width="465" height="82" rx="22" fill="url(#blue)" /><rect x="615" y="240" width="465" height="82" rx="22" fill="#fff" stroke="#5a8ca8" stroke-width="4" /><rect x="615" y="370" width="465" height="115" rx="22" fill="url(#gold)" /></g><path d="M847 200V225M847 330V355" stroke="#1689bd" stroke-width="8" marker-end="url(#arrowBlue)" /><g text-anchor="middle" font-weight="900"><text x="847" y="162" font-size="27.28" fill="#fff">n = 2k</text><text x="847" y="292" font-size="25.52">n² = (2k)² = 4k²</text><text x="847" y="420" font-size="25.52">n² = 2(2k²)</text><text x="847" y="462" font-size="22.0">2k² ∈ ℤ</text></g></g></svg>
