<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Checkpoint: change and accumulation</title><desc id="desc">Five supports of calculus lead to 8/10 now and 7/10 after seven days</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".58" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d9f0fb" /></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#42ccef" /><stop offset="1" stop-color="#1688bd" /></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe39b" /><stop offset="1" stop-color="#e79a25" /></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58" /><stop offset="1" stop-color="#b8172c" /></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".15" /></pattern><filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#183c59" flood-opacity=".24" /></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#365675" /></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-calculus-skills="5" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g font-size="22" font-weight="850" text-anchor="middle"><g filter="url(#s)"><rect class="calculus-skill" x="45" y="70" width="205" height="125" rx="25" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="147" y="143">Limit</text><g filter="url(#s)"><rect class="calculus-skill" x="270" y="70" width="205" height="125" rx="25" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="372" y="143">Derivative</text><g filter="url(#s)"><rect class="calculus-skill" x="495" y="70" width="205" height="125" rx="25" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="597" y="143">Optimization</text><g filter="url(#s)"><rect class="calculus-skill" x="720" y="70" width="205" height="125" rx="25" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="822" y="143">Integral</text><g filter="url(#s)"><rect class="calculus-skill" x="945" y="70" width="205" height="125" rx="25" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="1047" y="143">Diff. eq.</text></g><path d="M150 270H1050" stroke="#1688bd" stroke-width="9" marker-end="url(#arrow)" /><g filter="url(#s)"><rect x="190" y="365" width="350" height="160" rx="30" fill="url(#gold)" stroke="#9c6b1d" stroke-width="4" /><rect x="660" y="365" width="350" height="160" rx="30" fill="url(#gold)" stroke="#9c6b1d" stroke-width="4" /></g><g text-anchor="middle" font-weight="900"><text x="365" y="430" font-size="21.12">FIRST ATTEMPT</text><text x="365" y="495" font-size="42.24">8/10</text><text x="835" y="430" font-size="21.12">AFTER 7 DAYS</text><text x="835" y="495" font-size="42.24">7/10</text></g></g></svg>
