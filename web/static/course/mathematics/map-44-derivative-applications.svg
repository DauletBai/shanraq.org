<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Производная в действии: рост, экстремумы и оптимизация</title><desc id="desc">Парабола площади A=x(10−x) достигает максимума 25 при x=5</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff"/><stop offset="1" stop-color="#fff7e6"/></linearGradient><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#365675"/></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><g data-optimization="A=x(10-x);max=A(5)=25" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><path d="M100 520H1100M170 570V70" stroke="#365675" stroke-width="7" marker-end="url(#arrow)"/><path d="M220 500Q600 40 980 500" fill="none" stroke="#24a7d8" stroke-width="13"/><circle cx="600" cy="155" r="15" fill="#c51620"/><path d="M600 155V520M170 155H600" stroke="#d7b06a" stroke-width="5" stroke-dasharray="12 12"/><g font-size="30" font-weight="820" text-anchor="middle"><text x="600" y="105">A(5)=25 — максимум</text><text x="600" y="565">5</text><text x="125" y="165">25</text><text x="345" y="420">A′ &gt; 0</text><text x="855" y="420">A′ &lt; 0</text></g></g></svg>
