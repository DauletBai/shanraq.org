<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Differential equations: a law of change as a process model</title><desc id="desc">Growth y′=0.05y starts at 100 and produces the curve y=100e^(0.05t)</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff" /><stop offset="1" stop-color="#fff7e6" /></linearGradient><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#365675" /></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><g data-diffeq="yprime=.05y;y(0)=100;y=100e^(.05t)" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><path d="M100 520H1100M180 570V70" stroke="#365675" stroke-width="7" marker-end="url(#arrow)" /><path d="M190 475C390 455 610 390 940 110" fill="none" stroke="#24a7d8" stroke-width="13" /><g stroke="#c51620" stroke-width="8"><path d="M280 465L390 438" /><path d="M500 410L620 360" /><path d="M735 275L865 180" /></g><circle cx="190" cy="475" r="13" fill="#c51620" /><g font-size="29" font-weight="820"><text x="210" y="465">100</text><text x="500" y="105">y′ = 0.05y</text><text x="630" y="560">y = 100e^(0.05t)</text><text x="785" y="325">slope grows with y</text></g></g></svg>
