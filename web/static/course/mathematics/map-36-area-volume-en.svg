<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Area and volume: measuring with unit squares and cubes</title><desc id="desc">A parallelogram rearranged into a rectangle and a prism filled with cubes</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff" /><stop offset="1" stop-color="#fff7e6" /></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167" /><stop offset="1" stop-color="#c51620" /></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18" /></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><g data-measure="S=8*5=40;V=40*3=120" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><path d="M80 430L200 160H580L460 430Z" fill="#fff" stroke="#c51620" stroke-width="9" /><path d="M200 160V430M460 430L580 160" stroke="#d7b06a" stroke-width="5" stroke-dasharray="12 12" /><path d="M700 430V175L880 80L1080 190V445L900 535Z" fill="#fff" stroke="#24a7d8" stroke-width="8" /><path d="M700 175L900 285L1080 190M900 285V535" fill="none" stroke="#365675" stroke-width="6" /><g font-size="28" font-weight="800" text-anchor="middle"><text x="330" y="500">A = 8 × 5 = 40 cm²</text><text x="900" y="585">V = 40 × 3 = 120 cm³</text></g></g></svg>
