<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Окружность и круг: постоянное отношение и измерение кривой</title><desc id="desc">Круг радиуса 4 с диаметром 8, длиной 8π и площадью 16π</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff"/><stop offset="1" stop-color="#fff7e6"/></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167"/><stop offset="1" stop-color="#c51620"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><g data-circle="r=4;d=8;C=8pi;S=16pi" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><circle cx="420" cy="315" r="210" fill="#fff" stroke="#c51620" stroke-width="11"/><path d="M210 315H630M420 315V105" stroke="#365675" stroke-width="7"/><circle cx="420" cy="315" r="11" fill="#17324d"/><g font-size="31" font-weight="820"><text x="500" y="285">r = 4</text><text x="330" y="355">d = 8</text><text x="745" y="230">C = 8π</text><text x="745" y="330">S = 16π</text><text x="745" y="430">C/d = π</text></g></g></svg>
