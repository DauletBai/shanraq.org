<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Производная: мгновенная скорость изменения</title><desc id="desc">Секущие к параболе сходятся к касательной, а их наклон приближается к производной</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff"/><stop offset="1" stop-color="#fff7e6"/></linearGradient><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#365675"/></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><g data-derivative="f=x^2;x=2;fprime=4" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><path d="M100 520H1100M180 570V70" stroke="#365675" stroke-width="7" marker-end="url(#arrow)"/><path d="M210 500Q470 490 610 360T930 90" fill="none" stroke="#24a7d8" stroke-width="12"/><path d="M300 535L940 55" stroke="#c51620" stroke-width="9"/><path d="M430 475L900 155" stroke="#d7b06a" stroke-width="7" stroke-dasharray="14 12"/><circle cx="610" cy="360" r="13" fill="#c51620"/><g font-size="29" font-weight="800"><text x="720" y="335">касательная: наклон 4</text><text x="740" y="205">секущая</text><text x="310" y="115">h → 0: средний наклон → мгновенный</text></g></g></svg>
