<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Три восьмых как десятичная дробь</title><desc id="desc">Умножение числителя и знаменателя на сто двадцать пять превращает три восьмых в триста семьдесят пять тысячных и запись ноль целых триста семьдесят пять тысячных.</desc>
<defs>
