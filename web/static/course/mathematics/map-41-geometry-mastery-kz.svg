<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Бақылау нүктесі: геометрия және кеңістік</title><desc id="desc">Геометрияның сегіз тірегі және екі аралықтағы нәтиже</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".58" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d9f0fb" /></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167" /><stop offset="1" stop-color="#c51620" /></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#42ccef" /><stop offset="1" stop-color="#1688bd" /></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe39b" /><stop offset="1" stop-color="#e79a25" /></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".15" /></pattern><filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#183c59" flood-opacity=".24" /></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-geometry-skills="8" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g font-size="19" font-weight="800" text-anchor="middle"><g filter="url(#s)"><rect class="geometry-skill" x="40" y="45" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="165" y="98">Тіл және дәлел</text><g filter="url(#s)"><rect class="geometry-skill" x="325" y="45" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="450" y="98">Үшбұрыштар</text><g filter="url(#s)"><rect class="geometry-skill" x="610" y="45" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="735" y="98">Ұқсастық</text><g filter="url(#s)"><rect class="geometry-skill" x="895" y="45" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="1020" y="98">Аудан және көлем</text><g filter="url(#s)"><rect class="geometry-skill" x="40" y="180" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="165" y="233">Пифагор</text><g filter="url(#s)"><rect class="geometry-skill" x="325" y="180" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="450" y="233">Шеңбер</text><g filter="url(#s)"><rect class="geometry-skill" x="610" y="180" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="735" y="233">Тригонометрия</text><g filter="url(#s)"><rect class="geometry-skill" x="895" y="180" width="250" height="92" rx="22" fill="url(#glass)" stroke="#5b88a3" stroke-width="4" /></g><text x="1020" y="233">Векторлар</text></g><path d="M150 350H1050" stroke="#1688bd" stroke-width="9" /><g text-anchor="middle" font-weight="900" filter="url(#s)"><rect x="190" y="405" width="350" height="150" rx="30" fill="url(#gold)" stroke="#9c6b1d" stroke-width="4" /><rect x="660" y="405" width="350" height="150" rx="30" fill="url(#gold)" stroke="#9c6b1d" stroke-width="4" /></g><g text-anchor="middle" font-weight="900"><text x="365" y="465" font-size="21.12">АЛҒАШҚЫ ӘРЕКЕТ</text><text x="365" y="525" font-size="42.24">8/10</text><text x="835" y="465" font-size="21.12">7 КҮННЕН КЕЙІН</text><text x="835" y="525" font-size="42.24">7/10</text></g></g></svg>
