<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Интеграл: ұсақ өзгерістерден жинақталу</title><desc id="desc">y=2x графигінің 0 мен 3 арасындағы ауданы қосындылар шегімен және интегралмен 9-ға тең</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff" /><stop offset="1" stop-color="#fff7e6" /></linearGradient><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#365675" /></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><g data-integral="integral_0^3 2x dx=9" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><path d="M100 520H1100M180 570V70" stroke="#365675" stroke-width="7" marker-end="url(#arrow)" /><path d="M180 520L870 100" fill="none" stroke="#c51620" stroke-width="11" /><path d="M180 520H870L870 100Z" fill="#24a7d8" opacity=".24" /><g fill="#24a7d8" opacity=".45"><rect x="180" y="450" width="115" height="70" /><rect x="295" y="380" width="115" height="140" /><rect x="410" y="310" width="115" height="210" /><rect x="525" y="240" width="115" height="280" /><rect x="640" y="170" width="115" height="350" /><rect x="755" y="100" width="115" height="420" /></g><g font-size="30" font-weight="820"><text x="760" y="75">y=2x</text><text x="420" y="160">∫₀³ 2x dx = 9</text><text x="500" y="570">ұсақ үлестер → қосынды → шек</text></g></g></svg>
