<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Интеграл: ұсақ өзгерістерден жинақталу</title><desc id="desc">y=2x графигінің 0 мен 3 арасындағы ауданы қосындылар шегімен және интегралмен 9-ға тең</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".58" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d9f0fb" /></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#42ccef" /><stop offset="1" stop-color="#1688bd" /></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe39b" /><stop offset="1" stop-color="#e79a25" /></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58" /><stop offset="1" stop-color="#b8172c" /></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".15" /></pattern><filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#183c59" flood-opacity=".24" /></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#365675" /></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-integral="integral_0^3 2x dx=9" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#s)"><rect x="65" y="60" width="1070" height="500" rx="32" fill="url(#glass)" stroke="#5b88a3" stroke-width="5" /></g><path d="M125 500H1060M180 540V100" stroke="#365675" stroke-width="6" marker-end="url(#arrow)" /><path d="M180 500L870 95" stroke="#c92735" stroke-width="10" /><path d="M180 500H870L870 95Z" fill="#29a9d3" opacity=".14" /><g fill="url(#blue)" opacity=".62" filter="url(#s)"><rect x="180" y="433" width="115" height="67" /><rect x="295" y="365" width="115" height="135" /><rect x="410" y="298" width="115" height="202" /><rect x="525" y="230" width="115" height="270" /><rect x="640" y="163" width="115" height="337" /><rect x="755" y="95" width="115" height="405" /></g><g filter="url(#s)"><rect x="245" y="75" width="360" height="70" rx="22" fill="url(#gold)" /></g><g font-size="27" font-weight="900"><text x="760" y="82">y=2x</text><text x="285" y="120">∫₀³ 2x dx = 9</text><text x="515" y="550">ұсақ үлестер → қосынды → шек</text></g></g></svg>
