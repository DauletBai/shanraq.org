<g stroke="#70a8c4" stroke-width="2" opacity=".48"><path d="M120 156L220 461M180 140L280 445M240 123L340 428M300 107L400 412M360 90L460 395" /><path d="M85 216L395 131M105 278L415 193M125 340L435 255M145 402L455 317" /><path d="M785 114L870 444M850 103L935 433M915 92L1000 422M980 81L1065 411" /><path d="M735 185L1065 130M752 250L1082 195M769 315L1099 260M786 380L1116 325" /></g>
