<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Vector spaces and bases: the directions that build a vector</title><desc id="desc">A matrix mixed the components of an input. We now ask why components describe a vector and which directions may replace the usual horizontal and vertical axes.</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".55" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".96" /><stop offset="1" stop-color="#d8effc" stop-opacity=".9" /></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed" /><stop offset="1" stop-color="#126aa4" /></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a" /><stop offset="1" stop-color="#e89b23" /></linearGradient>
<linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58" /><stop offset="1" stop-color="#b8172c" /></linearGradient>
<pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16" /></pattern>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#183c59" flood-opacity=".24" /></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" /></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd" /></marker>
<marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d" /></marker>
<marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735" /></marker>
</defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-basis="v=(6,2)=4(1,1)+2(1,-1)" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="410" cy="525" rx="350" ry="48" fill="#3b7391" opacity=".16" filter="url(#soft)" /><g filter="url(#shadow)"><rect x="45" y="55" width="725" height="510" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5" /></g>
<g stroke="#76a9c3" stroke-width="2" opacity=".52"><path d="M85 90V540M135 90V540M185 90V540M235 90V540M285 90V540M335 90V540M385 90V540M435 90V540M485 90V540M535 90V540M585 90V540M635 90V540M685 90V540M735 90V540" /><path d="M85 90H735M85 140H735M85 190H735M85 240H735M85 290H735M85 340H735M85 390H735M85 440H735M85 490H735M85 540H735" /></g>
<path d="M85 490H735M185 540V90" stroke="#365675" stroke-width="4" opacity=".82" /><circle cx="185" cy="490" r="10" fill="#17324d" />
<path d="M185 490L485 390" stroke="url(#red)" stroke-width="13" marker-end="url(#arrowRed)" opacity=".88" /><path d="M185 490L385 290" stroke="url(#blue)" stroke-width="12" marker-end="url(#arrowBlue)" /><path d="M385 290L485 390" stroke="url(#gold)" stroke-width="12" marker-end="url(#arrowGold)" />
<g font-size="20" font-weight="850" text-anchor="middle"><text x="185" y="522">O</text><text x="385" y="262">P=(4; 4)</text><text x="485" y="425">V=(6; 2)</text></g>
<g filter="url(#shadow)"><rect x="805" y="65" width="340" height="390" rx="28" fill="#fff" stroke="#5a8ca8" stroke-width="4" /></g><text x="975" y="118" text-anchor="middle" font-size="19.36" font-weight="900">BASIS: two directions</text>
<g font-size="25" font-weight="830"><circle cx="850" cy="175" r="10" fill="#1689bd" /><text x="880" y="184">b₁ = (1; 1)</text><text x="880" y="222">4b₁ = (4; 4)</text><circle cx="850" cy="285" r="10" fill="#d98e1d" /><text x="880" y="294">b₂ = (1; −1)</text><text x="880" y="332">2b₂ = (2; −2)</text><circle cx="850" cy="394" r="10" fill="#c92735" /><text x="880" y="403">v = (6; 2)</text></g>
<g filter="url(#shadow)"><rect x="805" y="485" width="340" height="82" rx="22" fill="url(#red)" /></g><text x="975" y="537" fill="#fff" font-size="25.52" font-weight="900" text-anchor="middle">v = 4b₁ + 2b₂</text></g></svg>
