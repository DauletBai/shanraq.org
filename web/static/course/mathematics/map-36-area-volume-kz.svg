<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Аудан және көлем: бірлік квадраттар мен кубтар арқылы өлшеу</title><desc id="desc">Параллелограмды тіктөртбұрышқа айналдыру және призманы кубтармен толтыру</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".58" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d9f0fb" /></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167" /><stop offset="1" stop-color="#c51620" /></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#42ccef" /><stop offset="1" stop-color="#1688bd" /></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe39b" /><stop offset="1" stop-color="#e79a25" /></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".15" /></pattern><filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#183c59" flood-opacity=".24" /></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-measure="S=8*5=40;V=40*3=120" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#s)"><rect x="55" y="60" width="520" height="420" rx="30" fill="url(#glass)" stroke="#5b88a3" stroke-width="5" /><rect x="625" y="60" width="520" height="420" rx="30" fill="url(#glass)" stroke="#5b88a3" stroke-width="5" /></g><path d="M125 375L235 145H510L400 375Z" fill="#fff0ef" stroke="#c92735" stroke-width="10" /><path d="M235 145V375M400 375L510 145" stroke="#d98e1d" stroke-width="5" stroke-dasharray="12 10" /><path d="M705 360V170L865 90L1060 185V375L900 455Z" fill="#e8f8fd" stroke="#1688bd" stroke-width="9" /><path d="M705 170L900 265L1060 185M900 265V455" fill="none" stroke="#365675" stroke-width="6" /><g filter="url(#s)"><rect x="115" y="515" width="420" height="68" rx="22" fill="url(#gold)" /><rect x="665" y="515" width="420" height="68" rx="22" fill="url(#blue)" /></g><g font-size="27" font-weight="900" text-anchor="middle"><text x="325" y="558">S = 8 × 5 = 40 см²</text><text x="875" y="558" fill="#fff">V = 40 × 3 = 120 см³</text></g></g></svg>
