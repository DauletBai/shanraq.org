<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Кеңістіктегі векторлар: ұзындық, бағыт және орын ауыстыруды қосу</title><desc id="desc">a=(3;4), b=(−1;2), қосындысы (2;6), |a|=5</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff" /><stop offset="1" stop-color="#fff7e6" /></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167" /><stop offset="1" stop-color="#c51620" /></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18" /></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><g data-vectors="a=(3,4);b=(-1,2);a+b=(2,6);|a|=5" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(180 540)" fill="none" stroke-width="11"><path d="M0 0L360 -240" stroke="#c51620" /><path d="M360 -240L240 -400" stroke="#24a7d8" /><path d="M0 0L240 -400" stroke="#d7b06a" /></g><g font-size="31" font-weight="820" text-anchor="middle"><text x="380" y="390">a=(3;4)</text><text x="600" y="220">b=(−1;2)</text><text x="310" y="230">a+b=(2;6)</text><text x="850" y="330">|a|=√(3²+4²)=5</text></g></g></svg>
