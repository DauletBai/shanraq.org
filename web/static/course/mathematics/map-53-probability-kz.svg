<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Ықтималдық: нөл мен бір арасындағы белгісіздік өлшемі</title><desc id="desc">Үш қызыл және екі көк шары бар дорбадан екі рет алу ағашы екі қызылдың ықтималдығын 3/10 деп көрсетеді</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".55" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d8effc" /></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed" /><stop offset="1" stop-color="#126aa4" /></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a" /><stop offset="1" stop-color="#e89b23" /></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58" /><stop offset="1" stop-color="#b8172c" /></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16" /></pattern><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#183c59" flood-opacity=".24" /></filter><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" /></filter><marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd" /></marker><marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d" /></marker><marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735" /></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-probability="3R,2B;P(RR)=3/10" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#shadow)"><rect x="45" y="55" width="1110" height="520" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5" /></g><circle cx="125" cy="315" r="34" fill="#fff" stroke="#315b79" stroke-width="5" /><text x="125" y="325" text-anchor="middle" font-size="17.6" font-weight="900">БАСТАУ</text><g fill="none" stroke-width="9"><path d="M160 300L390 175" stroke="#c92735" marker-end="url(#arrowRed)" /><path d="M160 330L390 455" stroke="#1689bd" marker-end="url(#arrowBlue)" /><path d="M430 170L700 105" stroke="#c92735" marker-end="url(#arrowRed)" /><path d="M430 190L700 270" stroke="#1689bd" marker-end="url(#arrowBlue)" /><path d="M430 440L700 355" stroke="#c92735" marker-end="url(#arrowRed)" /><path d="M430 460L700 525" stroke="#1689bd" marker-end="url(#arrowBlue)" /></g><g font-size="24" font-weight="900" text-anchor="middle"><text x="275" y="205">R: 3/5</text><text x="275" y="430">B: 2/5</text><text x="565" y="100">R: 2/4</text><text x="565" y="270">B: 2/4</text><text x="565" y="365">R: 3/4</text><text x="565" y="525">B: 1/4</text></g><g filter="url(#shadow)"><rect x="735" y="70" width="365" height="105" rx="24" fill="url(#red)" /><rect x="735" y="225" width="365" height="105" rx="24" fill="#fff" stroke="#5a8ca8" stroke-width="4" /><rect x="735" y="380" width="365" height="105" rx="24" fill="url(#gold)" /></g><g text-anchor="middle" font-weight="900"><text x="917" y="135" font-size="24.64" fill="#fff">P(RR)=3/5·2/4</text><text x="917" y="292" font-size="24.64">= 6/20</text><text x="917" y="447" font-size="35.2">= 3/10</text></g></g></svg>
