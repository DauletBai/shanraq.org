<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Собственные значения и векторы: направления, которые преобразование сохраняет</title><desc id="desc">Матрица преобразует вектор (1; 1) в трёхкратно более длинный в том же направлении, а (1; −1) оставляет без изменения</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".55" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff1cf"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#d8effc" stop-opacity=".9"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed"/><stop offset="1" stop-color="#126aa4"/></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a"/><stop offset="1" stop-color="#e89b23"/></linearGradient>
<linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58"/><stop offset="1" stop-color="#b8172c"/></linearGradient>
<pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#183c59" flood-opacity=".24"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd"/></marker>
<marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d"/></marker>
<marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735"/></marker>
</defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3"/><g data-eigen="A=[[2,1],[1,2]];lambda1=3;v1=(1,1);lambda2=1;v2=(1,-1)" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="600" cy="500" rx="500" ry="45" fill="#3b7391" opacity=".16" filter="url(#soft)"/>
<g filter="url(#shadow)"><rect x="55" y="80" width="450" height="410" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5"/><rect x="695" y="80" width="450" height="410" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5"/><rect x="530" y="205" width="140" height="160" rx="28" fill="url(#glass)" stroke="#315b79" stroke-width="5"/></g>
<g stroke="#75abc7" stroke-width="2" opacity=".52"><path d="M100 130V430M160 130V430M220 130V430M280 130V430M340 130V430M400 130V430M460 130V430M100 130H460M100 190H460M100 250H460M100 310H460M100 370H460M100 430H460"/><path d="M740 130V430M800 130V430M860 130V430M920 130V430M980 130V430M1040 130V430M1100 130V430M740 130H1100M740 190H1100M740 250H1100M740 310H1100M740 370H1100M740 430H1100"/></g>
<g font-size="25" font-weight="850" text-anchor="middle"><text x="280" y="535">ДО ПРЕОБРАЗОВАНИЯ</text><text x="920" y="535">ПОСЛЕ ПРЕОБРАЗОВАНИЯ</text><text x="600" y="250">A</text><text x="570" y="310">2</text><text x="630" y="310">1</text><text x="570" y="345">1</text><text x="630" y="345">2</text></g>
<path d="M505 285H520M680 285H695" stroke="#1689bd" stroke-width="8" marker-end="url(#arrowBlue)"/>
<circle cx="220" cy="310" r="9" fill="#17324d"/><path d="M220 310L280 250" stroke="#1689bd" stroke-width="12" marker-end="url(#arrowBlue)"/><path d="M220 310L280 370" stroke="#d98e1d" stroke-width="12" marker-end="url(#arrowGold)"/>
<circle cx="800" cy="370" r="9" fill="#17324d"/><path d="M800 370L980 190" stroke="#c92735" stroke-width="14" marker-end="url(#arrowRed)"/><path d="M800 370L860 430" stroke="#d98e1d" stroke-width="12" marker-end="url(#arrowGold)"/>
<g font-size="23" font-weight="850"><text x="275" y="235">v₁=(1; 1)</text><text x="278" y="405">v₂=(1; −1)</text><text x="950" y="170">Av₁=3v₁</text><text x="875" y="465">Av₂=1v₂</text></g>
<g filter="url(#shadow)"><rect x="285" y="560" width="630" height="48" rx="18" fill="#fff" stroke="#6c9bb4" stroke-width="3"/></g><text x="600" y="592" text-anchor="middle" font-size="23" font-weight="800">направление сохраняется · меняется только масштаб</text></g></svg>
