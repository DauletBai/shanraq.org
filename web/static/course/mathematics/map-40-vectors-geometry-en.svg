<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Vectors in space: magnitude, direction, and adding displacements</title><desc id="desc">Vectors a=(3,4) and b=(−1,2), sum (2,6), and |a|=5</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".58" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" /><stop offset="1" stop-color="#d9f0fb" /></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167" /><stop offset="1" stop-color="#c51620" /></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#42ccef" /><stop offset="1" stop-color="#1688bd" /></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe39b" /><stop offset="1" stop-color="#e79a25" /></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".15" /></pattern><filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#183c59" flood-opacity=".24" /></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-vectors="a=(3,4);b=(-1,2);a+b=(2,6);|a|=5" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><defs><marker id="vArrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735" /></marker><marker id="vArrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1688bd" /></marker><marker id="vArrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d" /></marker></defs>
<g filter="url(#s)"><rect x="50" y="50" width="740" height="525" rx="30" fill="url(#glass)" stroke="#5b88a3" stroke-width="5" /></g>
<g stroke="#78adc7" stroke-width="2" opacity=".55"><path d="M95 80V560M155 80V560M215 80V560M275 80V560M335 80V560M395 80V560M455 80V560M515 80V560M575 80V560M635 80V560M695 80V560M755 80V560" /><path d="M95 80H755M95 140H755M95 200H755M95 260H755M95 320H755M95 380H755M95 440H755M95 500H755M95 560H755" /></g>
