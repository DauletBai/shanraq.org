<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Теорема Пифагора: расстояние из площадей квадратов</title><desc id="desc">Прямоугольный треугольник 3–4–5 и квадраты площадей 9, 16 и 25</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".58" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff1cf"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d9f0fb"/></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167"/><stop offset="1" stop-color="#c51620"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#42ccef"/><stop offset="1" stop-color="#1688bd"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe39b"/><stop offset="1" stop-color="#e79a25"/></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".15"/></pattern><filter id="s" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#183c59" flood-opacity=".24"/></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3"/><g data-pythagoras="3^2+4^2=5^2" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#s)"><rect x="70" y="70" width="760" height="455" rx="30" fill="url(#glass)" stroke="#5b88a3" stroke-width="5"/></g><path d="M315 420V165H665Z" fill="#eef9fd" stroke="#365675" stroke-width="9"/><rect x="205" y="165" width="110" height="255" rx="10" fill="url(#red)" opacity=".85"/><rect x="315" y="420" width="350" height="90" rx="10" fill="url(#blue)" opacity=".85"/><path d="M315 420L665 165" stroke="#d98e1d" stroke-width="15"/><g font-size="30" font-weight="900" text-anchor="middle"><text x="260" y="305" fill="#fff">3²=9</text><text x="490" y="477" fill="#fff">4²=16</text></g><g filter="url(#s)"><rect x="875" y="170" width="245" height="190" rx="30" fill="url(#gold)" stroke="#9c6b1d" stroke-width="5"/></g><g font-weight="900" text-anchor="middle"><text x="998" y="245" font-size="27">9 + 16 = 25</text><text x="998" y="322" font-size="43">5² = 25</text></g></g></svg>
