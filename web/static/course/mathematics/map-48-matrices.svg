<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Матрицы: таблица чисел, которая преобразует данные</title><desc id="desc">Матрица два на два преобразует вектор (4; 2) в вектор (10; 10)</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".55" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff1cf"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#d8effc" stop-opacity=".9"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed"/><stop offset="1" stop-color="#126aa4"/></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a"/><stop offset="1" stop-color="#e89b23"/></linearGradient>
<linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58"/><stop offset="1" stop-color="#b8172c"/></linearGradient>
<pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#183c59" flood-opacity=".24"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd"/></marker>
<marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d"/></marker>
<marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735"/></marker>
</defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3"/><g data-matrix="[[2,1],[1,3]]*(4,2)=(10,10)" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="600" cy="416" rx="360" ry="46" fill="#3b7391" opacity=".16" filter="url(#soft)"/>
<g filter="url(#shadow)"><rect x="70" y="155" width="210" height="190" rx="28" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/><path d="M80 165L98 145H290L280 165Z" fill="#a9d9ee"/><rect x="360" y="82" width="480" height="330" rx="30" fill="url(#glass)" stroke="#315b79" stroke-width="5"/><path d="M375 82L397 58H852L840 82Z" fill="#9fd8ee"/><path d="M840 82L852 58V380L840 412Z" fill="#77b5d2" opacity=".7"/><rect x="920" y="155" width="210" height="190" rx="28" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/><path d="M930 155L948 135H1140L1130 155Z" fill="#f4cb74"/></g>
<g font-weight="850" text-anchor="middle"><text x="175" y="205" font-size="24">ВХОД</text><text x="175" y="278" font-size="43">x = (4; 2)</text><text x="600" y="118" font-size="23">МАТРИЦА ПРЕОБРАЗОВАНИЯ</text><text x="1025" y="205" font-size="24">РЕЗУЛЬТАТ</text><text x="1025" y="278" font-size="34">Ax = (10; 10)</text></g>
<g filter="url(#shadow)"><rect x="430" y="142" width="150" height="105" rx="18" fill="url(#blue)"/><rect x="620" y="142" width="150" height="105" rx="18" fill="url(#gold)"/><rect x="430" y="275" width="150" height="105" rx="18" fill="url(#gold)"/><rect x="620" y="275" width="150" height="105" rx="18" fill="url(#blue)"/></g>
<g font-size="47" font-weight="900" fill="#fff" text-anchor="middle"><text x="505" y="212">2</text><text x="695" y="212">1</text><text x="505" y="345">1</text><text x="695" y="345">3</text></g>
<path d="M286 250H342M858 250H910" stroke="#1689bd" stroke-width="9" marker-end="url(#arrowBlue)"/>
<g filter="url(#shadow)"><rect x="120" y="470" width="960" height="105" rx="24" fill="#fff" stroke="#6c9bb4" stroke-width="3"/></g><g font-size="25" font-weight="760"><text x="170" y="515">строка 1:</text><text x="350" y="515">2·4 + 1·2 = 10</text><text x="650" y="515">строка 2:</text><text x="830" y="515">1·4 + 3·2 = 10</text><text x="600" y="557" text-anchor="middle">(2×2) · (2×1) = (2×1)</text></g></g></svg>
