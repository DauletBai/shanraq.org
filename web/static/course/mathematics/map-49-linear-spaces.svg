<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Линейное пространство и базис: из каких направлений собирается вектор</title><desc id="desc">Вектор (6; 2) разложен как четыре вектора (1; 1) и два вектора (1; −1)</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".55" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff1cf"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#d8effc" stop-opacity=".9"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed"/><stop offset="1" stop-color="#126aa4"/></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a"/><stop offset="1" stop-color="#e89b23"/></linearGradient>
<linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58"/><stop offset="1" stop-color="#b8172c"/></linearGradient>
<pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#183c59" flood-opacity=".24"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd"/></marker>
<marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d"/></marker>
<marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735"/></marker>
</defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3"/><g data-basis="v=(6,2)=4(1,1)+2(1,-1)" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="525" cy="475" rx="385" ry="55" fill="#3b7391" opacity=".18" filter="url(#soft)"/><g filter="url(#shadow)"><path d="M100 420L565 105L955 290L490 590Z" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5"/><path d="M100 420L490 590L490 608L100 438Z" fill="#75aec7" opacity=".7"/><path d="M490 590L955 290V308L490 608Z" fill="#5b93b1" opacity=".7"/></g>
<g stroke="#76a9c3" stroke-width="2" opacity=".45"><path d="M180 455L645 140M260 490L725 175M340 525L805 210M420 560L885 245"/><path d="M178 367L568 552M257 313L647 498M337 259L727 444M416 205L806 390M496 151L886 336"/></g>
<circle cx="285" cy="445" r="13" fill="#17324d"/><path d="M285 445L590 238" stroke="url(#blue)" stroke-width="13" marker-end="url(#arrowBlue)"/><path d="M285 445L600 530" stroke="url(#gold)" stroke-width="13" marker-end="url(#arrowGold)"/><path d="M285 445L825 322" stroke="url(#red)" stroke-width="15" marker-end="url(#arrowRed)"/><path d="M590 238L825 322M600 530L825 322" fill="none" stroke="#456b83" stroke-width="4" stroke-dasharray="12 10"/>
<g filter="url(#shadow)"><rect x="775" y="65" width="335" height="165" rx="26" fill="#fff" stroke="#5a8ca8" stroke-width="4"/></g><g font-size="27" font-weight="830"><text x="815" y="112">b₁ = (1; 1)</text><text x="815" y="153">b₂ = (1; −1)</text><text x="815" y="207">БАЗИС: два направления</text><text x="650" y="255">4b₁</text><text x="620" y="565">2b₂</text><text x="850" y="355">v = (6; 2)</text></g>
<g filter="url(#shadow)"><rect x="705" y="490" width="405" height="80" rx="22" fill="url(#red)"/></g><text x="907" y="540" fill="#fff" font-size="31" font-weight="900" text-anchor="middle">v = 4b₁ + 2b₂</text></g></svg>
