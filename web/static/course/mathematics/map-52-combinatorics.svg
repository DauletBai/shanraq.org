<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Комбинаторика: как считать варианты и не пересчитывать их вручную</title><desc id="desc">Из пяти объектов получается 20 упорядоченных пар и 10 неупорядоченных пар</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".55" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff1cf"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d8effc"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed"/><stop offset="1" stop-color="#126aa4"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a"/><stop offset="1" stop-color="#e89b23"/></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58"/><stop offset="1" stop-color="#b8172c"/></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16"/></pattern><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#183c59" flood-opacity=".24"/></filter><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter><marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd"/></marker><marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d"/></marker><marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735"/></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3"/><g data-combinatorics="P(5,2)=20;C(5,2)=10" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#shadow)"><rect x="55" y="65" width="535" height="500" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5"/><rect x="630" y="65" width="515" height="500" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5"/></g><g text-anchor="middle" font-weight="900"><text x="322" y="125" font-size="32">P(5,2)=5·4=20</text><text x="887" y="125" font-size="32">C(5,2)=10</text></g><g filter="url(#shadow)"><rect x="115" y="180" width="170" height="120" rx="26" fill="url(#blue)"/><rect x="360" y="180" width="170" height="120" rx="26" fill="url(#gold)"/></g><g text-anchor="middle" font-weight="900"><text x="200" y="225" font-size="24" fill="#fff">1</text><text x="200" y="278" font-size="48" fill="#fff">5</text><text x="445" y="225" font-size="24">2</text><text x="445" y="278" font-size="48">4</text><text x="322" y="365" font-size="27">AB ≠ BA</text><text x="322" y="425" font-size="24">5 × 4 = 20</text><text x="887" y="505" font-size="24">AB = BA</text></g><path d="M292 240H342" stroke="#1689bd" stroke-width="8" marker-end="url(#arrowBlue)"/><g filter="url(#shadow)"><rect class="combination-pair" x="735" y="170" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="774" y="206" text-anchor="middle" font-size="22" font-weight="900">AB</text><g filter="url(#shadow)"><rect class="combination-pair" x="830" y="170" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="869" y="206" text-anchor="middle" font-size="22" font-weight="900">AC</text><g filter="url(#shadow)"><rect class="combination-pair" x="925" y="170" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="964" y="206" text-anchor="middle" font-size="22" font-weight="900">AD</text><g filter="url(#shadow)"><rect class="combination-pair" x="1020" y="170" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="1059" y="206" text-anchor="middle" font-size="22" font-weight="900">AE</text><g filter="url(#shadow)"><rect class="combination-pair" x="782" y="250" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="821" y="286" text-anchor="middle" font-size="22" font-weight="900">BC</text><g filter="url(#shadow)"><rect class="combination-pair" x="877" y="250" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="916" y="286" text-anchor="middle" font-size="22" font-weight="900">BD</text><g filter="url(#shadow)"><rect class="combination-pair" x="972" y="250" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="1011" y="286" text-anchor="middle" font-size="22" font-weight="900">BE</text><g filter="url(#shadow)"><rect class="combination-pair" x="830" y="330" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="869" y="366" text-anchor="middle" font-size="22" font-weight="900">CD</text><g filter="url(#shadow)"><rect class="combination-pair" x="925" y="330" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="964" y="366" text-anchor="middle" font-size="22" font-weight="900">CE</text><g filter="url(#shadow)"><rect class="combination-pair" x="877" y="410" width="78" height="54" rx="18" fill="url(#glass)" stroke="#5a8ca8" stroke-width="3"/></g><text x="916" y="446" text-anchor="middle" font-size="22" font-weight="900">DE</text></g></svg>
