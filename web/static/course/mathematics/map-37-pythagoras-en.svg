<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">The Pythagorean theorem: distance from square areas</title><desc id="desc">A 3–4–5 right triangle with square areas 9, 16, and 25</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff" /><stop offset="1" stop-color="#fff7e6" /></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff7167" /><stop offset="1" stop-color="#c51620" /></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18" /></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><g data-pythagoras="3^2+4^2=5^2" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><path d="M300 500V180H720Z" fill="#fff" stroke="#365675" stroke-width="10" /><rect x="185" y="180" width="115" height="320" fill="#ff7167" opacity=".65" /><rect x="300" y="500" width="420" height="90" fill="#24a7d8" opacity=".65" /><path d="M300 500L720 180" fill="none" stroke="#d7b06a" stroke-width="16" /><rect x="790" y="205" width="250" height="155" rx="28" fill="#f1d08d" stroke="#365675" stroke-width="6" /><g font-size="34" font-weight="850" text-anchor="middle"><text x="245" y="350">3²=9</text><text x="510" y="558">4²=16</text><text x="915" y="295">5²=25</text><text x="600" y="95">9 + 16 = 25</text></g></g></svg>
