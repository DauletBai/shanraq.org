<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Шек: нүктеге жетпей-ақ жақындауды қалай сипаттаймыз</title><desc id="desc">Ойық нүктелі график: x саны 2-ге жақындағанда функция мәні 4-ке жақындайды</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff" /><stop offset="1" stop-color="#fff7e6" /></linearGradient><marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#365675" /></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><g data-limit="x-&gt;2;(x^2-4)/(x-2)-&gt;4" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><path d="M120 520H1080M180 570V70" stroke="#365675" stroke-width="7" marker-end="url(#arrow)" /><path d="M210 490L930 130" fill="none" stroke="#24a7d8" stroke-width="12" /><circle cx="570" cy="310" r="18" fill="#fff" stroke="#c51620" stroke-width="9" /><path d="M570 520V310M180 310H570" stroke="#d7b06a" stroke-width="5" stroke-dasharray="12 12" /><g font-size="28" font-weight="800"><text x="545" y="560">2</text><text x="135" y="320">4</text><text x="650" y="105">x саны 2-ге жақын → f(x) саны 4-ке жақын</text><text x="700" y="410">1,9 → 3,9</text><text x="700" y="450">1,99 → 3,99</text><text x="700" y="490">2,01 → 4,01</text></g></g></svg>
