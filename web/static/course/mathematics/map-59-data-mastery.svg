<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Финальная контрольная точка: вероятность, данные, логика, графы и моделирование</title><desc id="desc">Семь опор заключительного блока ведут к результату 8 из 10 сейчас и 7 из 10 через семь дней</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset=".55" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff1cf"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d8effc"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed"/><stop offset="1" stop-color="#126aa4"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a"/><stop offset="1" stop-color="#e89b23"/></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58"/><stop offset="1" stop-color="#b8172c"/></linearGradient><pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16"/></pattern><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#183c59" flood-opacity=".24"/></filter><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter><marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd"/></marker><marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d"/></marker><marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735"/></marker></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3"/><g data-data-skills="7" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round"><g text-anchor="middle" font-weight="900"><g filter="url(#shadow)"><rect class="data-skill" x="55" y="55" width="250" height="92" rx="22" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/></g><text x="180" y="110" font-size="20">Комбинаторика</text><g filter="url(#shadow)"><rect class="data-skill" x="340" y="55" width="250" height="92" rx="22" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/></g><text x="465" y="110" font-size="20">Вероятность</text><g filter="url(#shadow)"><rect class="data-skill" x="625" y="55" width="250" height="92" rx="22" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/></g><text x="750" y="110" font-size="20">Статистика</text><g filter="url(#shadow)"><rect class="data-skill" x="910" y="55" width="250" height="92" rx="22" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/></g><text x="1035" y="110" font-size="20">Вывод</text><g filter="url(#shadow)"><rect class="data-skill" x="55" y="190" width="250" height="92" rx="22" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/></g><text x="180" y="245" font-size="20">Логика</text><g filter="url(#shadow)"><rect class="data-skill" x="340" y="190" width="250" height="92" rx="22" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/></g><text x="465" y="245" font-size="20">Графы</text><g filter="url(#shadow)"><rect class="data-skill" x="625" y="190" width="250" height="92" rx="22" fill="url(#glass)" stroke="#4b7c9b" stroke-width="4"/></g><text x="750" y="245" font-size="20">Модель</text></g><path d="M170 340H1030" stroke="#1689bd" stroke-width="9" marker-end="url(#arrowBlue)"/><g filter="url(#shadow)"><rect x="170" y="410" width="360" height="135" rx="28" fill="url(#gold)" stroke="#9b6a1d" stroke-width="4"/><rect x="670" y="410" width="360" height="135" rx="28" fill="url(#gold)" stroke="#9b6a1d" stroke-width="4"/></g><g text-anchor="middle" font-weight="900"><text x="350" y="460" font-size="24">ПЕРВАЯ ПОПЫТКА</text><text x="350" y="520" font-size="46">8/10</text><text x="850" y="460" font-size="24">ЧЕРЕЗ 7 ДНЕЙ</text><text x="850" y="520" font-size="46">7/10</text></g></g></svg>
