<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Бақылау нүктесі: матрицалар, базис және меншікті бағыттар</title><desc id="desc">Сызықтық алгебраның үш тірегі қазір 8/10 және жеті күннен кейін 7/10 нәтижесіне апарады</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff" /><stop offset=".55" stop-color="#f8fbff" /><stop offset="1" stop-color="#fff1cf" /></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".96" /><stop offset="1" stop-color="#d8effc" stop-opacity=".9" /></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#35c7ed" /><stop offset="1" stop-color="#126aa4" /></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffe29a" /><stop offset="1" stop-color="#e89b23" /></linearGradient>
<linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff6a58" /><stop offset="1" stop-color="#b8172c" /></linearGradient>
<pattern id="draft" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6aa5c8" stroke-width="1" opacity=".16" /></pattern>
<filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#183c59" flood-opacity=".24" /></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" /></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#1689bd" /></marker>
<marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d98e1d" /></marker>
<marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#c92735" /></marker>
</defs><rect width="1200" height="630" rx="34" fill="url(#bg)" /><rect x="20" y="20" width="1160" height="590" rx="26" fill="url(#draft)" stroke="#fff" stroke-width="3" /><g data-linear-skills="3" font-family="system-ui,sans-serif" fill="#17324d" stroke-linecap="round" stroke-linejoin="round">
<path d="M120 270C300 345 430 345 600 270S900 195 1080 270" fill="none" stroke="#1689bd" stroke-width="12" opacity=".22" />
<g filter="url(#shadow)"><rect class="linear-skill" x="70" y="70" width="300" height="210" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5" /><rect class="linear-skill" x="450" y="70" width="300" height="210" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5" /><rect class="linear-skill" x="830" y="70" width="300" height="210" rx="30" fill="url(#glass)" stroke="#4b7c9b" stroke-width="5" /></g>
<g filter="url(#shadow)"><rect x="125" y="105" width="80" height="62" rx="12" fill="url(#blue)" /><rect x="235" y="105" width="80" height="62" rx="12" fill="url(#gold)" /><rect x="125" y="182" width="80" height="62" rx="12" fill="url(#gold)" /><rect x="235" y="182" width="80" height="62" rx="12" fill="url(#blue)" /></g><g fill="#fff" font-size="23" font-weight="900" text-anchor="middle"><text x="165" y="145">2</text><text x="275" y="145">1</text><text x="165" y="222">1</text><text x="275" y="222">3</text></g>
<circle cx="520" cy="225" r="9" fill="#17324d" /><path d="M520 225L585 150" stroke="#1689bd" stroke-width="9" marker-end="url(#arrowBlue)" /><path d="M520 225L635 220" stroke="#d98e1d" stroke-width="9" marker-end="url(#arrowGold)" /><path d="M520 225L700 145" stroke="#c92735" stroke-width="10" marker-end="url(#arrowRed)" /><path d="M585 150L700 145M635 220L700 145" stroke="#597b90" stroke-width="3" stroke-dasharray="8 7" />
<circle cx="885" cy="225" r="9" fill="#17324d" /><path d="M885 225L1035 105" stroke="#c92735" stroke-width="12" marker-end="url(#arrowRed)" /><path d="M885 225L935 185" stroke="#1689bd" stroke-width="9" marker-end="url(#arrowBlue)" /><g font-size="21" font-weight="900"><text x="925" y="170">v</text><text x="965" y="245">Av=3v</text></g>
<g text-anchor="middle" font-size="26" font-weight="850"><text x="220" y="325">Матрицалар</text><text x="600" y="318">Кеңістік</text><text x="600" y="351">және базис</text><text x="980" y="318">Меншікті</text><text x="980" y="351">бағыттар</text></g>
<path d="M180 400H1020" stroke="#1689bd" stroke-width="9" marker-end="url(#arrowBlue)" />
<g filter="url(#shadow)"><rect x="170" y="455" width="360" height="120" rx="28" fill="url(#gold)" stroke="#9b6a1d" stroke-width="4" /><rect x="670" y="455" width="360" height="120" rx="28" fill="url(#gold)" stroke="#9b6a1d" stroke-width="4" /></g><g text-anchor="middle" font-weight="900"><text x="350" y="500" font-size="21.12">АЛҒАШҚЫ ӘРЕКЕТ</text><text x="350" y="552" font-size="38.72">8/10</text><text x="850" y="500" font-size="21.12">7 КҮННЕН КЕЙІН</text><text x="850" y="552" font-size="38.72">7/10</text></g></g></svg>
