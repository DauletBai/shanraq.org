<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">DIAGNOSIS DOES NOT GIVE A GRADE</title><desc id="desc">It chooses the amount of support and the project theme</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f1fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54b8ff"/><stop offset="1" stop-color="#1765b5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e0dd"/><stop offset="1" stop-color="#138c9e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b89cff"/><stop offset="1" stop-color="#6742ba"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcb6b"/><stop offset="1" stop-color="#de7b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#17324f" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11Z" fill="#d53d3d"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bfd2e6" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>
  <style>
    .title{font:800 42px Inter,Arial,sans-serif;fill:#17324f;letter-spacing:1px}
    .subtitle{font:500 22px Inter,Arial,sans-serif;fill:#4d647a}
    .step-title{font:800 23px Inter,Arial,sans-serif;fill:#fff}
    .step-sub{font:600 17px Inter,Arial,sans-serif;fill:#eaf7ff}
    .number{font:900 34px Inter,Arial,sans-serif;fill:#17324f}
    .project{font:900 27px Inter,Arial,sans-serif;fill:#17324f;letter-spacing:.5px}
    .project-sub{font:600 18px Inter,Arial,sans-serif;fill:#49647c}
  </style>

<rect width="1600" height="900" fill="url(#paper)"/><rect width="1600" height="900" fill="url(#grid)"/>

<text x="800" y="76" text-anchor="middle" class="title">DIAGNOSIS DOES NOT GIVE A GRADE</text>
<text x="800" y="116" text-anchor="middle" class="subtitle">It chooses the amount of support and the project theme</text>
<g class="diagnostic-group" data-questions="1–3" filter="url(#shadow)">
  <rect x="110" y="190" width="630" height="210" rx="28" fill="url(#blue)" stroke="#fff" stroke-width="4"/>
  <circle cx="182" cy="255" r="43" fill="#fff" opacity=".95"/>
  <text x="182" y="267" text-anchor="middle" class="number" style="font-size:25px">1–3</text>
  <text x="245" y="258" class="step-title">DEVICE AND DATA</text>
  <text x="245" y="303" class="step-sub">file • memory • size</text>
  <path d="M175 348 H675" stroke="#fff" stroke-width="3" opacity=".55"/>
  <text x="425" y="377" text-anchor="middle" class="step-sub">✓ / ? / not yet</text>
</g>
<g class="diagnostic-group" data-questions="4–6" filter="url(#shadow)">
  <rect x="860" y="190" width="630" height="210" rx="28" fill="url(#cyan)" stroke="#fff" stroke-width="4"/>
  <circle cx="932" cy="255" r="43" fill="#fff" opacity=".95"/>
  <text x="932" y="267" text-anchor="middle" class="number" style="font-size:25px">4–6</text>
  <text x="995" y="258" class="step-title">ALGORITHM</text>
  <text x="995" y="303" class="step-sub">step • state • boundary</text>
  <path d="M925 348 H1425" stroke="#fff" stroke-width="3" opacity=".55"/>
  <text x="1175" y="377" text-anchor="middle" class="step-sub">✓ / ? / not yet</text>
</g>
<g class="diagnostic-group" data-questions="7–8" filter="url(#shadow)">
  <rect x="110" y="475" width="630" height="210" rx="28" fill="url(#violet)" stroke="#fff" stroke-width="4"/>
  <circle cx="182" cy="540" r="43" fill="#fff" opacity=".95"/>
  <text x="182" y="552" text-anchor="middle" class="number" style="font-size:25px">7–8</text>
  <text x="245" y="543" class="step-title">ERROR AND SAFETY</text>
  <text x="245" y="588" class="step-sub">fact • link • decision</text>
  <path d="M175 633 H675" stroke="#fff" stroke-width="3" opacity=".55"/>
  <text x="425" y="662" text-anchor="middle" class="step-sub">✓ / ? / not yet</text>
</g>
<g class="diagnostic-group" data-questions="9–10" filter="url(#shadow)">
  <rect x="860" y="475" width="630" height="210" rx="28" fill="url(#orange)" stroke="#fff" stroke-width="4"/>
  <circle cx="932" cy="540" r="43" fill="#fff" opacity=".95"/>
  <text x="932" y="552" text-anchor="middle" class="number" style="font-size:25px">9–10</text>
  <text x="995" y="543" class="step-title">DATA AND AI</text>
  <text x="995" y="588" class="step-sub">honest claim • verification</text>
  <path d="M925 633 H1425" stroke="#fff" stroke-width="3" opacity=".55"/>
  <text x="1175" y="662" text-anchor="middle" class="step-sub">✓ / ? / not yet</text>
</g>
<path d="M800 700 V758" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="300" y="770" width="1000" height="86" rx="24" fill="#fff" stroke="#76a9d3" stroke-width="3"/>
  <text x="800" y="823" text-anchor="middle" class="project">result → lesson support → version 0.0 passport</text>
</g></svg>