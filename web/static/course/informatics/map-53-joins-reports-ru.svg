<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Соединение таблиц и честный отчёт">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#164c60"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#286076"/><stop offset="1" stop-color="#102b3f"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c7eaf2" stroke-opacity=".12"/></pattern></defs>
<style>.eyebrow{font:700 22px Arial,sans-serif;fill:#86eee7;letter-spacing:3px}.title{font:700 43px Arial,sans-serif;fill:#f5f9ff}.number{font:700 30px Arial,sans-serif;fill:#102333}.label{font:700 28px Arial,sans-serif;fill:#fff}.value{font:600 27px 'Courier New',monospace;fill:#fff}.relation{font:700 21px 'Courier New',monospace;fill:#fff}.bar{font:700 20px Arial,sans-serif;fill:#fff}.explain{font:600 25px Arial,sans-serif;fill:#e0f4f8}.foot{font:600 27px Arial,sans-serif;fill:#e0f0f7}</style>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<text x="64" y="75" class="eyebrow">DATA · 53 / 72</text><text x="64" y="147" class="title">Соединение таблиц и честный отчёт</text>
<path d="M64 253 H1536" stroke="#6b94ab" stroke-width="2"/>
<g class="data-stage" transform="translate(54 307)">
<rect x="9" y="13" width="482" height="354" rx="22" fill="#020d17" opacity=".67"/>
<rect width="482" height="354" rx="22" fill="url(#panel)" stroke="#66e6df" stroke-width="3"/>
<path d="M22 22 H460" stroke="#b7dcea" opacity=".4"/>
<rect x="25" y="24" width="59" height="57" rx="14" fill="#66e6df"/>
<text x="54" y="65" text-anchor="middle" class="number">1</text>
<text x="99" y="65" class="label">Левая таблица</text>
<path d="M27 107 H454" stroke="#6e91a9" stroke-width="2"/>
<rect x="27" y="136" width="428" height="89" rx="12" fill="#061b2b" stroke="#4b758b"/>
<text x="241" y="192" text-anchor="middle" class="value">3 задачи</text>
<text x="241" y="291" text-anchor="middle" class="explain">включая t-02</text>
</g><g class="data-stage" transform="translate(568 307)">
<rect x="9" y="13" width="482" height="354" rx="22" fill="#020d17" opacity=".67"/>
<rect width="482" height="354" rx="22" fill="url(#panel)" stroke="#ffd27d" stroke-width="3"/>
<path d="M22 22 H460" stroke="#b7dcea" opacity=".4"/>
<rect x="25" y="24" width="59" height="57" rx="14" fill="#ffd27d"/>
<text x="54" y="65" text-anchor="middle" class="number">2</text>
<text x="99" y="65" class="label">LEFT JOIN</text>
<path d="M27 107 H454" stroke="#6e91a9" stroke-width="2"/>
<rect x="27" y="136" width="428" height="89" rx="12" fill="#061b2b" stroke="#4b758b"/>
<text x="241" y="192" text-anchor="middle" class="value" style="font-size:21px">4 занятия + пустая связь</text>
<text x="241" y="291" text-anchor="middle" class="explain">сохранить t-02</text>
</g><g class="data-stage" transform="translate(1082 307)">
<rect x="9" y="13" width="482" height="354" rx="22" fill="#020d17" opacity=".67"/>
<rect width="482" height="354" rx="22" fill="url(#panel)" stroke="#ff9584" stroke-width="3"/>
<path d="M22 22 H460" stroke="#b7dcea" opacity=".4"/>
<rect x="25" y="24" width="59" height="57" rx="14" fill="#ff9584"/>
<text x="54" y="65" text-anchor="middle" class="number">3</text>
<text x="99" y="65" class="label">Отчёт</text>
