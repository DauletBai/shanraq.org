<text x="900" y="345" fill="#234056" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="600" text-anchor="start">255, 0, 0</text>
<rect x="410" y="280" width="165" height="150" rx="14" fill="#37ba69" stroke="#afbfcc" stroke-width="3"/>
<text x="1205" y="345" fill="#234056" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="600" text-anchor="start">0, 255, 0</text>
<rect x="180" y="475" width="165" height="150" rx="14" fill="#427ded" stroke="#afbfcc" stroke-width="3"/>
<text x="900" y="540" fill="#234056" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="600" text-anchor="start">0, 0, 255</text>
