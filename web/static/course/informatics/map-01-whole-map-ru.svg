<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ИНФОРМАТИКА И ИИ</title><desc id="desc">Один проект растёт от замысла до проверяемого продукта</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f1fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54b8ff"/><stop offset="1" stop-color="#1765b5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e0dd"/><stop offset="1" stop-color="#138c9e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b89cff"/><stop offset="1" stop-color="#6742ba"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcb6b"/><stop offset="1" stop-color="#de7b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#17324f" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11Z" fill="#d53d3d"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bfd2e6" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>
  <style>
    .title{font:800 42px Inter,Arial,sans-serif;fill:#17324f;letter-spacing:1px}
    .subtitle{font:500 22px Inter,Arial,sans-serif;fill:#4d647a}
    .step-title{font:800 23px Inter,Arial,sans-serif;fill:#fff}
    .step-sub{font:600 17px Inter,Arial,sans-serif;fill:#eaf7ff}
    .number{font:900 34px Inter,Arial,sans-serif;fill:#17324f}
    .project{font:900 27px Inter,Arial,sans-serif;fill:#17324f;letter-spacing:.5px}
    .project-sub{font:600 18px Inter,Arial,sans-serif;fill:#49647c}
  </style>

<rect width="1600" height="900" fill="url(#paper)"/><rect width="1600" height="900" fill="url(#grid)"/>

<text x="800" y="68" text-anchor="middle" class="title">ИНФОРМАТИКА И ИИ</text>
<text x="800" y="106" text-anchor="middle" class="subtitle">Один проект растёт от замысла до проверяемого продукта</text>
<path class="course-arrow" d="M505 225 H590" fill="none" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="course-arrow" d="M1010 225 H1095" fill="none" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="course-arrow" d="M1305 300 V345.0 H1305 V390" fill="none" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="course-arrow" d="M1095 465 H1010" fill="none" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="course-arrow" d="M590 465 H505" fill="none" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="course-arrow" d="M295 540 V585.0 H545 V630" fill="none" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="course-arrow" d="M755 705 H845" fill="none" stroke="#d53d3d" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<g class="course-step" data-step="1" filter="url(#shadow)">
  <rect x="85" y="150" width="420" height="150" rx="22" fill="url(#blue)" stroke="#fff" stroke-width="3"/>
  <circle cx="133" cy="195" r="29" fill="#fff" opacity=".94"/>
  <text x="133" y="207" text-anchor="middle" class="number">1</text>
  <text x="177" y="205" class="step-title">Компьютер и проект</text>
  <text x="177" y="246" class="step-sub">уроки 1–10 • версия 0.1</text>
</g>
<g class="course-step" data-step="2" filter="url(#shadow)">
  <rect x="590" y="150" width="420" height="150" rx="22" fill="url(#cyan)" stroke="#fff" stroke-width="3"/>
  <circle cx="638" cy="195" r="29" fill="#fff" opacity=".94"/>
  <text x="638" y="207" text-anchor="middle" class="number">2</text>
  <text x="682" y="205" class="step-title">Данные</text>
  <text x="682" y="246" class="step-sub">уроки 11–18 • версия 0.2</text>
</g>
<g class="course-step" data-step="3" filter="url(#shadow)">
  <rect x="1095" y="150" width="420" height="150" rx="22" fill="url(#violet)" stroke="#fff" stroke-width="3"/>
  <circle cx="1143" cy="195" r="29" fill="#fff" opacity=".94"/>
  <text x="1143" y="207" text-anchor="middle" class="number">3</text>
  <text x="1187" y="205" class="step-title">Алгоритмы</text>
  <text x="1187" y="246" class="step-sub">уроки 19–26 • версия 0.3</text>
</g>
<g class="course-step" data-step="4" filter="url(#shadow)">
  <rect x="1095" y="390" width="420" height="150" rx="22" fill="url(#orange)" stroke="#fff" stroke-width="3"/>
  <circle cx="1143" cy="435" r="29" fill="#fff" opacity=".94"/>
  <text x="1143" y="447" text-anchor="middle" class="number">4</text>
  <text x="1187" y="445" class="step-title">Python</text>
  <text x="1187" y="486" class="step-sub">уроки 27–38 • версия 1.0</text>
</g>
<g class="course-step" data-step="5" filter="url(#shadow)">
  <rect x="590" y="390" width="420" height="150" rx="22" fill="url(#blue)" stroke="#fff" stroke-width="3"/>
  <circle cx="638" cy="435" r="29" fill="#fff" opacity=".94"/>
  <text x="638" y="447" text-anchor="middle" class="number">5</text>
  <text x="682" y="445" class="step-title">Веб и облако</text>
  <text x="682" y="486" class="step-sub">уроки 39–46 • версия 1.1</text>
</g>
<g class="course-step" data-step="6" filter="url(#shadow)">
  <rect x="85" y="390" width="420" height="150" rx="22" fill="url(#cyan)" stroke="#fff" stroke-width="3"/>
  <circle cx="133" cy="435" r="29" fill="#fff" opacity=".94"/>
  <text x="133" y="447" text-anchor="middle" class="number">6</text>
  <text x="177" y="445" class="step-title">SQLite</text>
  <text x="177" y="486" class="step-sub">уроки 47–54 • версия 1.2</text>
</g>
<g class="course-step" data-step="7" filter="url(#shadow)">
  <rect x="335" y="630" width="420" height="150" rx="22" fill="url(#violet)" stroke="#fff" stroke-width="3"/>
  <circle cx="383" cy="675" r="29" fill="#fff" opacity=".94"/>
  <text x="383" y="687" text-anchor="middle" class="number">7</text>
  <text x="427" y="685" class="step-title">Безопасность</text>
  <text x="427" y="726" class="step-sub">уроки 55–62 • версия 1.3</text>
</g>
<g class="course-step" data-step="8" filter="url(#shadow)">
  <rect x="845" y="630" width="420" height="150" rx="22" fill="url(#orange)" stroke="#fff" stroke-width="3"/>
  <circle cx="893" cy="675" r="29" fill="#fff" opacity=".94"/>
  <text x="893" y="687" text-anchor="middle" class="number">8</text>
  <text x="937" y="685" class="step-title">ИИ и выпуск</text>
  <text x="937" y="726" class="step-sub">уроки 63–72 • версия 2.1</text>
</g>
<g filter="url(#shadow)">
  <rect x="420" y="806" width="760" height="70" rx="20" fill="#fff" stroke="#76a9d3" stroke-width="2"/>
  <text x="800" y="836" text-anchor="middle" class="project">МОЙ ЦИФРОВОЙ ПОМОЩНИК</text>
  <text x="800" y="862" text-anchor="middle" class="project-sub">каждый блок улучшает тот же продукт</text>
</g></svg>