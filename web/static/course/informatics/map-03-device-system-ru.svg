<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ТЕЛЕФОН И НОУТБУК — СИСТЕМЫ</title><desc id="desc">Разные корпуса, одна проверяемая модель</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f1fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54b8ff"/><stop offset="1" stop-color="#1765b5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e0dd"/><stop offset="1" stop-color="#138c9e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b89cff"/><stop offset="1" stop-color="#6742ba"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcb6b"/><stop offset="1" stop-color="#de7b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#17324f" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11Z" fill="#d53d3d"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bfd2e6" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>
  <style>
    .title{font:800 42px Inter,Arial,sans-serif;fill:#17324f;letter-spacing:1px}
    .subtitle{font:500 22px Inter,Arial,sans-serif;fill:#4d647a}
    .step-title{font:800 23px Inter,Arial,sans-serif;fill:#fff}
    .step-sub{font:600 17px Inter,Arial,sans-serif;fill:#eaf7ff}
    .number{font:900 34px Inter,Arial,sans-serif;fill:#17324f}
    .project{font:900 27px Inter,Arial,sans-serif;fill:#17324f;letter-spacing:.5px}
    .project-sub{font:600 18px Inter,Arial,sans-serif;fill:#49647c}
  </style>

<rect width="1600" height="900" fill="url(#paper)"/><rect width="1600" height="900" fill="url(#grid)"/>

<text x="800" y="68" text-anchor="middle" class="title">ТЕЛЕФОН И НОУТБУК — СИСТЕМЫ</text>
<text x="800" y="105" text-anchor="middle" class="subtitle">Разные корпуса, одна проверяемая модель</text>
<g class="system-role" data-order="1" filter="url(#shadow)"><rect x="55" y="160" width="250" height="105" rx="22" fill="url(#orange)" stroke="#fff" stroke-width="3"/><text x="180" y="225" text-anchor="middle" class="step-title">цель</text></g>
<path d="M309 212 H357" stroke="#d53d3d" stroke-width="7" marker-end="url(#arrow)"/>
<g class="system-role" data-order="2" filter="url(#shadow)"><rect x="365" y="160" width="250" height="105" rx="22" fill="url(#blue)" stroke="#fff" stroke-width="3"/><text x="490" y="225" text-anchor="middle" class="step-title">вход</text></g>
<path d="M619 212 H667" stroke="#d53d3d" stroke-width="7" marker-end="url(#arrow)"/>
<g class="system-role" data-order="3" filter="url(#shadow)"><rect x="675" y="160" width="250" height="105" rx="22" fill="url(#violet)" stroke="#fff" stroke-width="3"/><text x="800" y="225" text-anchor="middle" class="step-title">обработка</text></g>
<path d="M929 212 H977" stroke="#d53d3d" stroke-width="7" marker-end="url(#arrow)"/>
<g class="system-role" data-order="4" filter="url(#shadow)"><rect x="985" y="160" width="250" height="105" rx="22" fill="url(#cyan)" stroke="#fff" stroke-width="3"/><text x="1110" y="225" text-anchor="middle" class="step-title">состояние</text></g>
<path d="M1239 212 H1287" stroke="#d53d3d" stroke-width="7" marker-end="url(#arrow)"/>
<g class="system-role" data-order="5" filter="url(#shadow)"><rect x="1295" y="160" width="250" height="105" rx="22" fill="url(#orange)" stroke="#fff" stroke-width="3"/><text x="1420" y="225" text-anchor="middle" class="step-title">выход</text></g>
<g class="device-system" data-device="телефон" filter="url(#shadow)"><rect x="90" y="345" width="1420" height="170" rx="28" fill="#fff" stroke="#8db7d8" stroke-width="3"/><rect x="90" y="345" width="240" height="170" rx="28" fill="url(#blue)"/><text x="210" y="443" text-anchor="middle" class="step-title">ТЕЛЕФОН</text>
<rect x="370" y="387" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="492" y="439" text-anchor="middle" class="project-sub">касание • камера</text>
<rect x="650" y="387" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="772" y="439" text-anchor="middle" class="project-sub">процессор • ОС</text>
<rect x="930" y="387" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="1052" y="439" text-anchor="middle" class="project-sub">ОЗУ • хранилище</text>
<rect x="1210" y="387" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="1332" y="439" text-anchor="middle" class="project-sub">экран • звук</text>
</g>
<g class="device-system" data-device="ноутбук" filter="url(#shadow)"><rect x="90" y="570" width="1420" height="170" rx="28" fill="#fff" stroke="#8db7d8" stroke-width="3"/><rect x="90" y="570" width="240" height="170" rx="28" fill="url(#violet)"/><text x="210" y="668" text-anchor="middle" class="step-title">НОУТБУК</text>
<rect x="370" y="612" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="492" y="664" text-anchor="middle" class="project-sub">клавиатура • камера</text>
<rect x="650" y="612" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="772" y="664" text-anchor="middle" class="project-sub">процессор • ОС</text>
<rect x="930" y="612" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="1052" y="664" text-anchor="middle" class="project-sub">ОЗУ • накопитель</text>
<rect x="1210" y="612" width="245" height="86" rx="18" fill="#edf5fb" stroke="#b8cee0" stroke-width="2"/><text x="1332" y="664" text-anchor="middle" class="project-sub">экран • звук</text>
</g>
<text x="800" y="838" text-anchor="middle" class="project">часть полезна не названием, а ролью в общей задаче</text></svg>