<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960" role="img" aria-label="Go: от первой строки до книжного магазина">
<title>Go: от первой строки до книжного магазина</title>
<!-- The cover speaks Go's own visual language: the gopher blue field, the light
     blue mascot, the yellow accent under the title, and Go's blue on the level
     line and the publisher's mark. The mark is small and at the foot, where a
     publisher's mark belongs. The gopher is drawn here rather than borrowed,
     in the spirit of Renee French's character. -->
<defs>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00ADD8"/>
    <stop offset="100%" stop-color="#007D9C"/>
  </linearGradient>
</defs>

<rect width="720" height="960" fill="#FAF8F5"/>
<rect x="0" y="0" width="720" height="660" fill="url(#field)"/>

<!-- the mascot -->
<g stroke="#06202A" stroke-linecap="round" stroke-linejoin="round">
  <!-- ears -->
  <ellipse cx="292" cy="130" rx="28" ry="34" fill="#5DC9E2" stroke-width="6"/>
  <ellipse cx="428" cy="130" rx="28" ry="34" fill="#5DC9E2" stroke-width="6"/>
  <ellipse cx="292" cy="132" rx="12" ry="17" fill="#2F97B5" stroke="none"/>
  <ellipse cx="428" cy="132" rx="12" ry="17" fill="#2F97B5" stroke="none"/>

  <!-- feet, showing below the body -->
  <ellipse cx="310" cy="414" rx="40" ry="22" fill="#F7E6CE" stroke-width="6"/>
  <ellipse cx="410" cy="414" rx="40" ry="22" fill="#F7E6CE" stroke-width="6"/>

  <!-- arms, on the body's edge so they read as attached -->
  <ellipse cx="232" cy="300" rx="22" ry="42" fill="#5DC9E2" stroke-width="6" transform="rotate(-14 232 300)"/>
  <ellipse cx="488" cy="300" rx="22" ry="42" fill="#5DC9E2" stroke-width="6" transform="rotate(14 488 300)"/>

  <!-- body -->
  <ellipse cx="360" cy="262" rx="134" ry="152" fill="#5DC9E2" stroke-width="7"/>
  <!-- the pale belly sits low: the face stays blue, the way the gopher's is -->
  <ellipse cx="360" cy="330" rx="82" ry="80" fill="#EAF8FC" stroke="none"/>

  <!-- eyes: large, white, side by side -->
  <circle cx="306" cy="196" r="54" fill="#FFFFFF" stroke-width="7"/>
  <circle cx="414" cy="196" r="54" fill="#FFFFFF" stroke-width="7"/>
  <circle cx="324" cy="204" r="21" fill="#06202A" stroke="none"/>
  <circle cx="396" cy="204" r="21" fill="#06202A" stroke="none"/>
  <circle cx="331" cy="196" r="7" fill="#FFFFFF" stroke="none"/>
  <circle cx="403" cy="196" r="7" fill="#FFFFFF" stroke="none"/>

  <!-- nose and the two front teeth -->
  <path d="M338 244c0-12 10-20 22-20s22 8 22 20-10 18-22 18-22-6-22-18z" fill="#06202A" stroke="none"/>
  <path d="M360 262v8" stroke-width="5"/>
  <rect x="343" y="270" width="16" height="28" rx="5" fill="#FFFFFF" stroke-width="5"/>
  <rect x="361" y="270" width="16" height="28" rx="5" fill="#FFFFFF" stroke-width="5"/>
</g>

<!-- the title, with Go's yellow under it -->
<text x="360" y="524" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="106" font-weight="700" letter-spacing="2">Go</text>
<rect x="318" y="542" width="84" height="7" rx="3.5" fill="#FDDD00"/>
<text x="360" y="588" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.95" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31">от первой строки</text>
<text x="360" y="628" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.95" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31">до книжного магазина</text>

<!-- the foot -->
<text x="360" y="726" text-anchor="middle" fill="#007D9C" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">JUNIOR · MIDDLE · SENIOR</text>
<line x1="150" y1="756" x2="570" y2="756" stroke="#DBD9D6" stroke-width="2"/>
<text x="360" y="806" text-anchor="middle" fill="#555759" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24">Практическая книга: один пример,</text>
<text x="360" y="842" text-anchor="middle" fill="#555759" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24">который вырастает в работающий магазин</text>

<!-- the publisher: the mark, small, immediately before the name -->
<g transform="translate(204,882)">
  <g transform="scale(0.09)" fill="none" stroke="#007D9C" stroke-linecap="round">
    <g stroke-opacity="0.35" stroke-width="45">
      <line x1="76" y1="76" x2="324" y2="324"/><line x1="137" y1="37" x2="363" y2="263"/>
      <line x1="37" y1="137" x2="263" y2="363"/><line x1="76" y1="324" x2="324" y2="76"/>
      <line x1="137" y1="363" x2="363" y2="137"/><line x1="37" y1="263" x2="263" y2="37"/>
    </g>
    <g stroke-width="28">
      <line x1="76" y1="76" x2="324" y2="324"/><line x1="137" y1="37" x2="363" y2="263"/>
      <line x1="37" y1="137" x2="263" y2="363"/><line x1="76" y1="324" x2="324" y2="76"/>
      <line x1="137" y1="363" x2="363" y2="137"/><line x1="37" y1="263" x2="263" y2="37"/>
    </g>
  </g>
</g>
<text x="252" y="911" fill="#454545" font-family="Georgia, 'Noto Serif', serif" font-size="30" font-weight="700" letter-spacing="1.5">SHANRAQ.ORG</text>
</svg>
