<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960" role="img" aria-label="Go: от первой строки до книжного магазина">
<title>Go: от первой строки до книжного магазина</title>
<!-- The cover speaks Go's own visual language: the gopher blue field, the light
     blue mascot, the yellow accent under the title, and Go's blue on the level
     line and the publisher's mark. The mark is small and at the foot, where a
     publisher's mark belongs. The gopher is drawn here rather than borrowed,
     in the spirit of Renee French's character. -->
<defs>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00ADD8"/>
    <stop offset="100%" stop-color="#007D9C"/>
  </linearGradient>
</defs>

<rect width="720" height="960" fill="#FAF8F5"/>
<rect x="0" y="0" width="720" height="706" fill="url(#field)"/>

<!-- The book's own mascot, pushing the cart the book is written towards.
     Linked rather than embedded: this file is the source, and what the site
     serves is the PNG rendered from it (an SVG shown in an <img> may not fetch
     an external image, and inlining a megabyte of base64 would make a card
     thumbnail cost half a megabyte). -->
<image href="gopher-cart.png" x="150" y="48" width="420" height="396"/>

<!-- the title: Go's own wordmark, in white, with the language's yellow under it -->
<g transform="translate(240,466) scale(1.063)" fill="#FFFFFF" fill-rule="evenodd">
  <path d="m16.2 24.1c-.4 0-.5-.2-.3-.5l2.1-2.7c.2-.3.7-.5 1.1-.5h35.7c.4 0 .5.3.3.6l-1.7 2.6c-.2.3-.7.6-1 .6z"/>
  <path d="m1.1 33.3c-.4 0-.5-.2-.3-.5l2.1-2.7c.2-.3.7-.5 1.1-.5h45.6c.4 0 .6.3.5.6l-.8 2.4c-.1.4-.5.6-.9.6z"/>
  <path d="m25.3 42.5c-.4 0-.5-.3-.3-.6l1.4-2.5c.2-.3.6-.6 1-.6h20c.4 0 .6.3.6.7l-.2 2.4c0 .4-.4.7-.7.7z"/>
  <g transform="translate(55)">
    <path d="m74.1 22.3c-6.3 1.6-10.6 2.8-16.8 4.4-1.5.4-1.6.5-2.9-1-1.5-1.7-2.6-2.8-4.7-3.8-6.3-3.1-12.4-2.2-18.1 1.5-6.8 4.4-10.3 10.9-10.2 19 .1 8 5.6 14.6 13.5 15.7 6.8.9 12.5-1.5 17-6.6.9-1.1 1.7-2.3 2.7-3.7-3.6 0-8.1 0-19.3 0-2.1 0-2.6-1.3-1.9-3 1.3-3.1 3.7-8.3 5.1-10.9.3-.6 1-1.6 2.5-1.6h36.4c-.2 2.7-.2 5.4-.6 8.1-1.1 7.2-3.8 13.8-8.2 19.6-7.2 9.5-16.6 15.4-28.5 17-9.8 1.3-18.9-.6-26.9-6.6-7.4-5.6-11.6-13-12.7-22.2-1.3-10.9 1.9-20.7 8.5-29.3 7.1-9.3 16.5-15.2 28-17.3 9.4-1.7 18.4-.6 26.5 4.9 5.3 3.5 9.1 8.3 11.6 14.1.6.9.2 1.4-1 1.7z"/>
    <path d="m107.2 77.6c-9.1-.2-17.4-2.8-24.4-8.8-5.9-5.1-9.6-11.6-10.8-19.3-1.8-11.3 1.3-21.3 8.1-30.2 7.3-9.6 16.1-14.6 28-16.7 10.2-1.8 19.8-.8 28.5 5.1 7.9 5.4 12.8 12.7 14.1 22.3 1.7 13.5-2.2 24.5-11.5 33.9-6.6 6.7-14.7 10.9-24 12.8-2.7.5-5.4.6-8 .9zm23.8-40.4c-.1-1.3-.1-2.3-.3-3.3-1.8-9.9-10.9-15.5-20.4-13.3-9.3 2.1-15.3 8-17.5 17.4-1.8 7.8 2 15.7 9.2 18.9 5.5 2.4 11 2.1 16.3-.6 7.9-4.1 12.2-10.5 12.7-19.1z" fill-rule="nonzero"/>
  </g>
</g>
<rect x="336" y="570" width="88" height="8" rx="4" fill="#FDDD00"/>
<text x="360" y="628" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="600">от первой строки</text>
<text x="360" y="678" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="600">до книжного магазина</text>

<!-- the foot -->
<text x="360" y="772" text-anchor="middle" fill="#007D9C" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">JUNIOR · MIDDLE · SENIOR</text>
<line x1="150" y1="802" x2="570" y2="802" stroke="#DBD9D6" stroke-width="2"/>
<text x="360" y="850" text-anchor="middle" fill="#555759" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24">Практическая книга: один пример,</text>
<text x="360" y="886" text-anchor="middle" fill="#555759" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24">который вырастает в работающий магазин</text>

<!-- the publisher: the mark, small, immediately before the name -->
<g transform="translate(230,914)">
  <g transform="scale(0.09)" fill="none" stroke="#007D9C" stroke-linecap="round">
    <g stroke-opacity="0.35" stroke-width="45">
      <line x1="76" y1="76" x2="324" y2="324"/><line x1="137" y1="37" x2="363" y2="263"/>
      <line x1="37" y1="137" x2="263" y2="363"/><line x1="76" y1="324" x2="324" y2="76"/>
      <line x1="137" y1="363" x2="363" y2="137"/><line x1="37" y1="263" x2="263" y2="37"/>
    </g>
    <g stroke-width="28">
      <line x1="76" y1="76" x2="324" y2="324"/><line x1="137" y1="37" x2="363" y2="263"/>
      <line x1="37" y1="137" x2="263" y2="363"/><line x1="76" y1="324" x2="324" y2="76"/>
      <line x1="137" y1="363" x2="363" y2="137"/><line x1="37" y1="263" x2="263" y2="37"/>
    </g>
  </g>
</g>
<text x="278" y="941" fill="#454545" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2.5">SHANRAQ.ORG</text>
</svg>
